<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>

    <link rel='shortcut icon' href='/favicon.png' type='image/png'>
    <title>四子棋 棋币商店</title>

    <!-- Bootstrap V5 -->
    <link href='https://quantil.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css' rel='stylesheet'>

    <!-- Shoelace -->
    <link href='https://quantil.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css' rel='stylesheet'>
    <script src='https://quantil.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js'
        type='module'></script>

    <!-- MY -->
    <script src='/js/global/ui.min.js?v=replace'></script>
    <script src='/js/risk/api.min.js?v=replace'></script>
    <script src='/js/ref/must.min.js?v=replace'></script>
    <script src='/js/ref/achievement.min.js?v=replace'></script>
    <script src='/js/ref/http.min.js?v=replace'></script>
    <script src='/js/ref/wallet.min.js?v=replace'></script>
    <link href='/css/global.min.css?v=replace' rel='stylesheet'>

    <style>
        .loading-a {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 1);
            transition: all 0.4s ease;
        }

        .loading-p {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: loading-spin 1s linear infinite;
        }

        .loading-t {
            margin-top: 15px;
            font-family: sans-serif;
            color: #666;
            font-size: 14px;
        }

        @keyframes loading-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 顶部标题 */
        .shop-header {
            padding: 3.4rem 1rem 0.6rem;
            text-align: center;
        }

        .shop-header-icon {
            font-size: 3rem;
            color: var(--sl-color-primary-600);
        }

        .shop-header h1 {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0.35rem 0 0.15rem;
        }

        /* 通用卡片：与成就展示柜保持一致的质感 */
        .shop-card {
            position: relative;
            overflow: hidden;
            padding: 1rem 1rem 1.1rem;
            border-radius: 1.15rem;
            border: 1px solid rgba(13, 110, 253, 0.14);
            background: linear-gradient(180deg, #ffffff, rgba(246, 249, 255, 0.94));
            box-shadow: 0 1.2rem 2.6rem rgba(15, 23, 42, 0.07), inset 0 1px 0 #ffffff;
        }

        .shop-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(13, 110, 253, 0.07) 1px, transparent 1px);
            background-size: 18px 18px;
            opacity: 0.55;
            pointer-events: none;
        }

        .shop-card-head {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        .shop-card-title {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--sl-color-neutral-700);
        }

        .shop-card-title sl-icon {
            color: #d4a853;
        }

        /* 收益规则 */
        .shop-rule {
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.55rem 0.7rem;
            border-radius: 0.75rem;
            border: 1px solid var(--sl-color-neutral-200);
            background: #ffffff;
        }

        .shop-rule + .shop-rule {
            margin-top: 0.5rem;
        }

        .shop-rule-icon {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.2rem;
            height: 2.2rem;
            border-radius: 0.6rem;
            border: 1px solid rgba(200, 135, 26, 0.28);
            background: linear-gradient(165deg, #fffdf3, #fbe8b5);
            font-size: 1.05rem;
            color: #a16207;
        }

        .shop-rule-main {
            flex-grow: 1;
            min-width: 0;
        }

        .shop-rule-name {
            font-weight: 700;
            font-size: 0.86rem;
            color: var(--sl-color-neutral-800);
        }

        .shop-rule-desc {
            font-size: 0.72rem;
            color: var(--sl-color-neutral-600);
            line-height: 1.35;
            word-break: break-word;
        }

        .shop-rule-value {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-weight: 800;
            font-size: 0.92rem;
            color: #b45309;
        }

        .shop-rule-value svg {
            display: block;
        }

        /* 模式倍率 */
        .shop-rates {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.55rem;
            margin-top: 0.7rem;
        }

        .shop-rate {
            display: flex;
            flex-direction: column;
            gap: 0.32rem;
            padding: 0.5rem 0.55rem;
            border-radius: 0.7rem;
            border: 1px solid var(--sl-color-neutral-200);
            background: #ffffff;
        }

        .shop-rate.is-base {
            border-color: rgba(13, 110, 253, 0.24);
            background: linear-gradient(180deg, #f8fbff, #eef4ff);
        }

        .shop-rate-mode {
            display: flex;
            flex-direction: column;
            line-height: 1.25;
        }

        .shop-rate-mode b {
            font-size: 0.78rem;
            color: #334155;
        }

        .shop-rate-mode span {
            font-size: 0.62rem;
            color: #94a3b8;
        }

        .shop-rate-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.3rem;
            padding: 0.14rem 0.42rem;
            border-radius: 0.42rem;
            background: #fef3c7;
            color: #b45309;
            font-size: 0.74rem;
            font-weight: 800;
        }

        .shop-rate-pill span {
            font-size: 0.6rem;
            font-weight: 600;
            color: #a16207;
        }

        .shop-rate-pill.is-exp {
            background: #dcfce7;
            color: #15803d;
        }

        .shop-rate-pill.is-exp span {
            color: #166534;
        }

        .shop-note {
            position: relative;
            margin-top: 0.7rem;
            font-size: 0.7rem;
            line-height: 1.55;
            color: #64748b;
        }

        /* 商品分区 */
        .shop-section {
            margin-bottom: 1.05rem;
        }

        .shop-section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.6rem;
            padding: 0 0.2rem 0.55rem;
        }

        .shop-section-title {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            font-weight: 800;
            font-size: 1rem;
            color: #334155;
        }

        .shop-section-title::before {
            content: '';
            width: 0.3rem;
            height: 1rem;
            border-radius: 99px;
            background: linear-gradient(180deg, #3b82f6, #22c55e);
        }

        .shop-section-note {
            font-size: 0.68rem;
            color: #94a3b8;
        }

        .shop-goods {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }

        /* 商品卡片 */
        .good {
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 1rem;
            border: 1px solid rgba(148, 163, 184, 0.26);
            background: #ffffff;
            box-shadow: 0 0.55rem 1.5rem rgba(15, 23, 42, 0.06);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .good:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.9rem 2rem rgba(15, 23, 42, 0.11);
        }

        .good-art {
            position: relative;
            height: 7.6rem;
            overflow: hidden;
            background: #f1f5f9;
        }

        .good-body {
            padding: 0.72rem 0.85rem 0;
        }

        .good-name {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            font-weight: 800;
            font-size: 0.9rem;
            color: #1e293b;
        }

        .good-tag {
            flex: 0 0 auto;
            padding: 0.1rem 0.36rem;
            border-radius: 99px;
            background: #f1f5f9;
            font-size: 0.6rem;
            font-weight: 600;
            color: #64748b;
        }

        .good-desc {
            min-height: 2rem;
            margin-top: 0.22rem;
            font-size: 0.7rem;
            line-height: 1.45;
            color: #64748b;
        }

        .good-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.6rem 0.85rem 0.8rem;
            margin-top: auto;
        }

        .good-price {
            display: inline-flex;
            align-items: center;
            gap: 0.28rem;
            font-weight: 800;
            font-size: 0.9rem;
            color: #b45309;
        }

        .good-price svg {
            display: block;
        }

        .good-buy {
            border: 0;
            border-radius: 0.6rem;
            padding: 0.34rem 0.85rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #16a34a, #15803d);
            cursor: pointer;
            transition: filter 0.18s ease, transform 0.18s ease;
        }

        .good-buy:hover {
            filter: brightness(1.08);
        }

        .good-buy:active {
            transform: scale(0.97);
        }

        .good-buy.buy-gold {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .good-buy[disabled] {
            background: #eef2f7;
            color: #9aa7b8;
            cursor: not-allowed;
            filter: none;
            transform: none;
        }

        .good-badge {
            position: absolute;
            top: 0.55rem;
            right: 0.55rem;
            z-index: 3;
            padding: 0.13rem 0.45rem;
            border-radius: 99px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 0.15rem 0.45rem rgba(15, 23, 42, 0.12);
            font-size: 0.6rem;
            font-weight: 800;
            color: #475569;
        }

        .good-badge.ok {
            color: #15803d;
            background: rgba(220, 252, 231, 0.94);
        }

        .good-badge.dev {
            color: #7c3aed;
            background: rgba(237, 233, 254, 0.94);
        }

        .good-badge.no {
            color: #b45309;
            background: rgba(254, 243, 199, 0.94);
        }

        /* 商品详情弹窗 */
        .good-detail {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            width: min(22rem, 78vw);
        }

        .good-detail-art {
            position: relative;
            height: 10.4rem;
            overflow: hidden;
            border-radius: 0.85rem;
            border: 1px solid rgba(148, 163, 184, 0.26);
            background: #f1f5f9;
        }

        .good-detail-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        .good-detail-name {
            font-weight: 800;
            font-size: 1rem;
            color: #1e293b;
        }

        .good-detail-price {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-weight: 800;
            font-size: 1rem;
            color: #b45309;
        }

        .good-detail-price svg {
            display: block;
        }

        .good-detail-desc {
            font-size: 0.78rem;
            line-height: 1.6;
            color: #475569;
        }

        .good-detail-note {
            padding: 0.5rem 0.65rem;
            border-radius: 0.6rem;
            border: 1px dashed rgba(148, 163, 184, 0.45);
            background: #f8fafc;
            font-size: 0.72rem;
            line-height: 1.55;
            color: #64748b;
        }

        .good-detail-foot {
            display: flex;
            justify-content: flex-end;
        }

        .good-detail-foot .good-buy {
            padding: 0.5rem 1.5rem;
            font-size: 0.82rem;
        }

        /* 商品卡面：2 / 3 级权限码通行证 */
        .art-pass,
        .art-board,
        .art-piece,
        .art-piece-rouge,
        .art-piece-atlantis,
        .art-grass,
        .art-ui,
        .art-ui-black,
        .art-ui-liuqing,
        .art-ticket,
        .art-gift {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .art-pass {
            flex-direction: column;
            align-items: flex-start;
            padding: 0.75rem 0.9rem;
            color: #e2e8f0;
            background: linear-gradient(135deg, #0b1220, #16253d 52%, #0e4b57);
        }

        .art-pass.lv3 {
            background: linear-gradient(135deg, #1e1030, #3b1e5e 50%, #6b2170);
        }

        .art-pass::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 84% 16%, rgba(103, 232, 249, 0.3), transparent 46%);
            pointer-events: none;
        }

        .art-pass.lv3::before {
            background: radial-gradient(circle at 84% 16%, rgba(216, 180, 254, 0.35), transparent 46%);
        }

        .art-pass::after {
            content: '';
            position: absolute;
            right: -2.2rem;
            bottom: -3.4rem;
            width: 8rem;
            height: 8rem;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 0 0 1.4rem rgba(255, 255, 255, 0.035);
            pointer-events: none;
        }

        .pass-top {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            width: 100%;
        }

        .pass-chip {
            padding: 0.14rem 0.42rem;
            border-radius: 0.34rem;
            border: 1px solid rgba(103, 232, 249, 0.6);
            background: rgba(8, 47, 73, 0.55);
            color: #a5f3fc;
            font-size: 0.64rem;
            font-weight: 900;
            letter-spacing: 0.08em;
        }

        .art-pass.lv3 .pass-chip {
            border-color: rgba(216, 180, 254, 0.65);
            background: rgba(59, 7, 100, 0.5);
            color: #e9d5ff;
        }

        .pass-label {
            margin-left: auto;
            font-size: 0.55rem;
            letter-spacing: 0.16em;
            color: rgba(226, 232, 240, 0.55);
        }

        .pass-nick {
            margin-top: auto;
            font-size: 1.2rem;
            font-weight: 900;
            line-height: 1.15;
            letter-spacing: 0.02em;
            color: #67e8f9;
        }

        .art-pass.lv3 .pass-nick {
            background: linear-gradient(90deg, #c084fc, #f472b6, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .pass-bar {
            display: flex;
            gap: 0.25rem;
            width: 100%;
            margin-top: 0.36rem;
        }

        .pass-bar i {
            height: 0.2rem;
            border-radius: 99px;
            background: rgba(226, 232, 240, 0.2);
        }

        .pass-bar i:first-child {
            flex: 1;
        }

        .pass-bar i:last-child {
            width: 2rem;
            background: rgba(103, 232, 249, 0.5);
        }

        .art-pass.lv3 .pass-bar i:last-child {
            background: rgba(216, 180, 254, 0.55);
        }

        .pass-code {
            margin-top: 0.34rem;
            font-size: 0.56rem;
            letter-spacing: 0.2em;
            color: rgba(226, 232, 240, 0.42);
        }

        /* 商品卡面：棋盘皮肤（半写实青玉） */
        .art-board {
            background:
                radial-gradient(circle at 50% 18%, rgba(214, 244, 226, 0.55), transparent 58%),
                linear-gradient(160deg, #eef6f0, #d9ecdf 58%, #b7d4c3);
        }

        .board-skin {
            position: relative;
            width: 5.4rem;
            height: 5.4rem;
            overflow: hidden;
            border-radius: 0.4rem;
            border: 1px solid #6f9c83;
            background-color: #d7ebdd;
            background-image:
                radial-gradient(circle at 24% 18%, rgba(255, 255, 255, 0.78), transparent 46%),
                radial-gradient(circle at 82% 30%, rgba(228, 248, 234, 0.7), transparent 40%),
                radial-gradient(circle at 40% 86%, rgba(146, 196, 164, 0.32), transparent 46%),
                linear-gradient(135deg, #f2faf3, #dcf0e2 38%, #c6e3d1 72%, #a9cdb8),
                linear-gradient(90deg, rgba(42, 86, 64, 0.42) 1px, transparent 1px),
                linear-gradient(0deg, rgba(42, 86, 64, 0.42) 1px, transparent 1px);
            background-size: auto, auto, auto, auto, 12.5% 12.5%, 12.5% 12.5%;
            box-shadow:
                0 0.5rem 1rem rgba(15, 23, 42, 0.14),
                inset 0 0 0 0.16rem rgba(255, 255, 255, 0.55),
                inset 0 -0.3rem 0.6rem rgba(57, 105, 78, 0.18);
        }

        /* 玉面斜向高光与石纹 */
        .jade-sheen {
            position: absolute;
            inset: 0;
            border-radius: 0.4rem;
            background: linear-gradient(118deg, transparent 22%, rgba(255, 255, 255, 0.42) 34%, transparent 46%);
            pointer-events: none;
        }

        .jade-vein {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .jade-vein.is-wide {
            left: -18%;
            top: 56%;
            width: 128%;
            height: 34%;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(96, 150, 118, 0.28);
            transform: rotate(-24deg);
            filter: blur(0.4px);
        }

        .jade-vein.is-thin {
            left: -10%;
            top: 22%;
            width: 120%;
            height: 22%;
            border-top: 1px solid rgba(108, 160, 126, 0.35);
            transform: rotate(16deg);
            filter: blur(0.3px);
        }

        .board-skin .bs-b,
        .board-skin .bs-w {
            position: absolute;
            width: 0.66rem;
            height: 0.66rem;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0.12rem 0.24rem rgba(15, 23, 42, 0.28);
        }

        .board-skin .bs-b {
            background: radial-gradient(circle at 34% 28%, #5b5b66, #101014 70%);
        }

        .board-skin .bs-w {
            background: radial-gradient(circle at 34% 28%, #ffffff, #d8dbe1 72%);
        }

        .board-tag {
            position: absolute;
            right: 0.65rem;
            bottom: 0.55rem;
            padding: 0.14rem 0.45rem;
            border-radius: 99px;
            border: 1px solid rgba(47, 92, 70, 0.32);
            background: rgba(244, 252, 246, 0.86);
            font-size: 0.6rem;
            font-weight: 700;
            color: #2f5c46;
        }

        /* 商品卡面：玄金棋盘（黑石盘面 + 亮金网格 + 罗马数字） */
        .art-board-gold {
            background:
                radial-gradient(circle at 50% 16%, rgba(226, 190, 106, 0.22), transparent 58%),
                linear-gradient(160deg, #5f646d, #4b5058 56%, #33383f);
        }

        .board-skin.is-gold {
            border-color: #c9a24f;
            background-color: #3d424a;
            background-image:
                radial-gradient(circle at 24% 18%, rgba(255, 255, 255, 0.18), transparent 46%),
                radial-gradient(circle at 78% 74%, rgba(0, 0, 0, 0.28), transparent 52%),
                linear-gradient(135deg, #646971, #4f545c 44%, #41464e 78%, #33383f),
                linear-gradient(90deg, rgba(8, 10, 13, 0.5) 1.6px, transparent 1.6px),
                linear-gradient(0deg, rgba(8, 10, 13, 0.5) 1.6px, transparent 1.6px),
                linear-gradient(90deg, #f1cb72 1px, transparent 1px),
                linear-gradient(0deg, #f1cb72 1px, transparent 1px);
            background-size: auto, auto, auto, 12.5% 12.5%, 12.5% 12.5%, 12.5% 12.5%, 12.5% 12.5%;
            box-shadow:
                0 0.5rem 1rem rgba(0, 0, 0, 0.5),
                inset 0 0 0 0.16rem rgba(232, 197, 111, 0.28),
                inset 0 -0.3rem 0.6rem rgba(0, 0, 0, 0.55);
        }

        .gold-sheen {
            position: absolute;
            inset: 0;
            border-radius: 0.4rem;
            background: linear-gradient(118deg, transparent 22%, rgba(255, 255, 255, 0.1) 34%, transparent 46%);
            pointer-events: none;
        }

        .gold-vein {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .gold-vein.is-wide {
            left: -18%;
            top: 56%;
            width: 128%;
            height: 34%;
            border-top: 1px solid rgba(196, 208, 224, 0.14);
            border-bottom: 1px solid rgba(0, 0, 0, 0.55);
            transform: rotate(-24deg);
            filter: blur(0.4px);
        }

        .gold-vein.is-thin {
            left: -10%;
            top: 22%;
            width: 120%;
            height: 22%;
            border-top: 1px solid rgba(0, 0, 0, 0.5);
            transform: rotate(16deg);
            filter: blur(0.3px);
        }

        .gold-num {
            position: absolute;
            transform: translate(-50%, -50%);
            font-family: 'Times New Roman', Georgia, serif;
            font-size: 0.5rem;
            font-weight: 700;
            color: #ffd77a;
            text-shadow: 0 0 0.3rem rgba(255, 196, 82, 0.65);
            pointer-events: none;
        }

        .board-tag.is-gold {
            border-color: rgba(201, 162, 79, 0.6);
            background: rgba(20, 18, 12, 0.82);
            color: #e6c16a;
        }

            justify-content: center;

        /* 石材墙面：细密竖纹 */

            position: absolute;

            height: 0;

            position: absolute;
            top: 0;
            left: 0;

            width: 1px;

        .ub-rays b:nth-child(5) {

            transform: rotate(30deg);

            height: 52%;
            transform: perspective(11rem) rotateX(57deg);

                repeating-linear-gradient(64deg, rgba(214, 178, 94, 0.16) 0 1px, transparent 1px 6%),
                repeating-linear-gradient(-64deg, rgba(214, 178, 94, 0.1) 0 1px, transparent 1px 6%),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 9%),
                radial-gradient(ellipse at 50% 78%, rgba(226, 178, 84, 0.18), transparent 62%),
                linear-gradient(180deg, rgba(22, 22, 26, 0.9), rgba(5, 5, 6, 0.98) 74%);
            pointer-events: none;

        /* 黑金 HUD 面板：双金描边 + 菱形徽记 */
        .ub-hud {
            position: relative;

            display: flex;
            flex-direction: column;
            gap: 0.34rem;
            padding: 0.45rem 0.5rem;

        .ub-hud-top,

        .ub-hud-foot {

        .ub-dot {
            flex: 0 0 auto;

    <script>
        (async () => {
            const icons = Array.from(document.querySelectorAll('sl-icon'));
            const st = Date.now();

            await Promise.allSettled([
                customElements.whenDefined('sl-button'),
                customElements.whenDefined('sl-icon'),
            ]);

            if (document.readyState === 'loading') await new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve, { 'once': true }));

            await Promise.allSettled(icons.map((icon) => new Promise((resolve) => {
                if (icon.hasAttribute('library')) resolve();
                icon.addEventListener('sl-load', () => requestAnimationFrame(() => requestAnimationFrame(resolve)), { 'once': true });
            })));

            await new Promise((resolve) => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { 'once': true });
            });

            const elapsed = Date.now() - st;
            setTimeout(() => {
                window.loaded = true;
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                    setTimeout(() => loader.remove(), 400);
                }
            }, Math.max(0, 300 - elapsed));
        })();
    </script>
