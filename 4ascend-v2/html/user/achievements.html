<html>

<head>
    <meta charset='UTF-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>

    <link rel='shortcut icon' href='/favicon.png' type='image/png'>
    <title>四子棋 我的成就</title>

    <!-- Bootstrap V5 -->
    <link href='https://quantil.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css' rel='stylesheet'>

    <!-- Shoelace -->
    <link href='https://quantil.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css' rel='stylesheet'>
    <script src='https://quantil.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js'
        type='module'></script>

    <!-- MY -->
    <script src='/js/global/ui.min.js?v=replace'></script>
    <script src='/js/risk/api.min.js?v=replace'></script>
    <script src='/js/ref/must.min.js?v=replace'></script>
    <script src='/js/ref/music.min.js?v=replace'></script>
    <script src='/js/ref/global-music.min.js?v=replace'></script>
    <script src='/js/ref/http.min.js?v=replace'></script>
    <script src='/js/ref/friends.min.js?v=replace'></script>
    <script src='/js/ref/wallet.min.js?v=replace'></script>
    <script src='/js/ref/achievement.min.js?v=replace'></script>
    <link href='/css/global.min.css?v=replace' rel='stylesheet'>

    <style>
        .loading-a {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 1);
            transition: all 0.4s ease;
        }

        .loading-p {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: loading-spin 1s linear infinite;
        }

        .loading-t {
            margin-top: 15px;
            font-family: sans-serif;
            color: #666;
            font-size: 14px;
        }

        @keyframes loading-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 顶部标题 */
        .achievement-header {
            padding: 3.4rem 1rem 0.6rem;
            text-align: center;
        }

        .achievement-header-icon {
            font-size: 3rem;
            color: var(--sl-color-primary-600);
        }

        .achievement-header h1 {
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0.35rem 0 0.15rem;
        }

        /* 展示柜 */
        .achievement-cabinet {
            position: relative;
            overflow: hidden;
            padding: 1rem 1rem 1.1rem;
            border-radius: 1.15rem;
            border: 1px solid rgba(13, 110, 253, 0.14);
            background: linear-gradient(180deg, #ffffff, rgba(246, 249, 255, 0.94));
            box-shadow: 0 1.2rem 2.6rem rgba(15, 23, 42, 0.07), inset 0 1px 0 #ffffff;
        }

        .achievement-cabinet::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(13, 110, 253, 0.07) 1px, transparent 1px);
            background-size: 18px 18px;
            opacity: 0.55;
            pointer-events: none;
        }

        .achievement-cabinet-head {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.85rem;
        }

        /* 展示位（顶部 3 个展示的成就） */
        .achievement-showcase {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.6rem;
            margin-bottom: 0.9rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.45);
        }

        .achievement-showcase-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            min-height: 3.6rem;
            padding: 0.45rem 0.6rem;
            border-radius: 0.8rem;
            border: 1px dashed rgba(148, 163, 184, 0.55);
            background: rgba(255, 255, 255, 0.72);
            text-align: left;
        }

        .achievement-showcase-item.filled {
            border-style: solid;
            border-color: rgba(212, 168, 83, 0.55);
            background: linear-gradient(165deg, #fffdf3, #fbe8b5);
            box-shadow: 0 0.25rem 0.7rem rgba(180, 130, 30, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.9);
            cursor: pointer;
        }

        .achievement-showcase-art {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.3rem;
            height: 2.3rem;
        }

        .achievement-showcase-art svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .achievement-showcase-name {
            min-width: 0;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--sl-color-neutral-800);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .achievement-showcase-empty {
            font-size: 0.72rem;
            color: var(--sl-color-neutral-500);
            line-height: 1.3;
        }

        .achievement-cabinet-title {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--sl-color-neutral-700);
        }

        .achievement-cabinet-title sl-icon {
            color: #d4a853;
        }

        .achievement-grid {
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.8rem;
        }

        .achievement-card {
            all: unset;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.25rem;
            min-height: 9.2rem;
            padding: 0.8rem 0.55rem;
            text-align: center;
            border-radius: 0.9rem;
            border: 1px solid rgba(148, 163, 184, 0.28);
            background: linear-gradient(180deg, #ffffff, #f8fafc);
            box-shadow: 0 0.28rem 0.75rem rgba(15, 23, 42, 0.05);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .achievement-card:hover,
        .achievement-card:focus-visible {
            transform: translateY(-3px);
            border-color: rgba(212, 168, 83, 0.72);
            box-shadow: 0 0.75rem 1.4rem rgba(212, 168, 83, 0.22);
        }

        .achievement-card:focus-visible {
            outline: 2px solid var(--sl-color-primary-500);
            outline-offset: 2px;
        }

        /* 稀有度只体现在卡片边框与底色（青铜 / 白银 / 黄金） */
        .achievement-card.rarity-bronze {
            background: linear-gradient(165deg, #fffaf3, #f6e3d0);
            border-color: rgba(180, 83, 9, 0.38);
            box-shadow: 0 0.28rem 0.75rem rgba(120, 63, 4, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }

        .achievement-card.rarity-silver {
            background: linear-gradient(165deg, #ffffff, #e6edf5);
            border-color: rgba(100, 116, 139, 0.42);
            box-shadow: 0 0.28rem 0.75rem rgba(51, 65, 85, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .achievement-card.rarity-gold {
            background: linear-gradient(165deg, #fffdf3, #fbe8b5);
            border-color: rgba(212, 168, 83, 0.68);
            box-shadow: 0 0.32rem 0.85rem rgba(180, 130, 30, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }

        .achievement-card.rarity-bronze:hover,
        .achievement-card.rarity-bronze:focus-visible {
            box-shadow: 0 0.8rem 1.5rem rgba(180, 83, 9, 0.24);
        }

        .achievement-card.rarity-silver:hover,
        .achievement-card.rarity-silver:focus-visible {
            box-shadow: 0 0.8rem 1.5rem rgba(71, 85, 105, 0.24);
        }

        .achievement-card.rarity-gold:hover,
        .achievement-card.rarity-gold:focus-visible {
            box-shadow: 0 0.85rem 1.6rem rgba(201, 145, 30, 0.28);
        }

        /* 钻石稀有度（隐藏成就专属）：冷冽晶面纹理 + 冰蓝棱光 */
        .achievement-card.rarity-diamond {
            border-color: rgba(96, 165, 250, 0.72);
            background:
                repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.72) 0 1px, rgba(255, 255, 255, 0) 1px 12px),
                repeating-linear-gradient(-60deg, rgba(120, 172, 226, 0.32) 0 1px, rgba(120, 172, 226, 0) 1px 12px),
                repeating-linear-gradient(152deg, rgba(255, 255, 255, 0.5) 0 1px, rgba(255, 255, 255, 0) 1px 20px),
                conic-gradient(from 200deg at 30% 18%, #f4fbff 0deg, #cfe4fa 42deg, #ffffff 88deg, #b9d9f6 138deg, #e8f3ff 190deg, #a9cdee 240deg, #f3f9ff 286deg, #d9ebfd 330deg, #f4fbff 360deg);
            box-shadow:
                0 0.32rem 0.85rem rgba(37, 99, 235, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.98),
                inset 0 0 0 1px rgba(255, 255, 255, 0.55);
        }

        .achievement-card.rarity-diamond:hover,
        .achievement-card.rarity-diamond:focus-visible {
            border-color: rgba(59, 130, 246, 0.9);
            box-shadow: 0 0.85rem 1.7rem rgba(37, 99, 235, 0.32);
        }

        /* 赛事冠军：比普通钻石更亮的冰蓝晶面 + 冰钻斜带角标 */
        .achievement-card.champion {
            border-color: rgba(37, 99, 235, 0.92);
            background:
                repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.8) 0 1px, rgba(255, 255, 255, 0) 1px 11px),
                repeating-linear-gradient(-60deg, rgba(96, 148, 214, 0.38) 0 1px, rgba(96, 148, 214, 0) 1px 11px),
                conic-gradient(from 200deg at 30% 18%, #eef8ff 0deg, #bfdcfa 40deg, #ffffff 84deg, #a5c9f2 132deg, #e2f1ff 184deg, #93beea 236deg, #f2f9ff 284deg, #cfe4fb 330deg, #eef8ff 360deg);
            box-shadow: 0 0.45rem 1.2rem rgba(37, 99, 235, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.98), inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        .achievement-card.champion:hover,
        .achievement-card.champion:focus-visible {
            box-shadow: 0 0.95rem 1.9rem rgba(37, 99, 235, 0.4);
        }

        .achievement-champion-ribbon {
            position: absolute;
            top: 0.55rem;
            right: -1.55rem;
            width: 5.6rem;
            padding: 0.08rem 0;
            transform: rotate(45deg);
            background: linear-gradient(135deg, #eaf6ff, #7cc1f5);
            border-top: 1px solid rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid rgba(30, 64, 175, 0.4);
            color: #0b3a66;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-align: center;
            box-shadow: 0 0.15rem 0.4rem rgba(37, 99, 235, 0.35);
            pointer-events: none;
        }

        .achievement-card-art {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3.7rem;
            height: 3.7rem;
        }

        .achievement-card-art svg,
        .achievement-detail-art svg,
        .achievement-all-art svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .achievement-card-progress {
            width: 100%;
            margin-top: 0.1rem;
        }

        .achievement-card-progress-track {
            height: 4px;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.28);
            overflow: hidden;
        }

        .achievement-card-progress-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #f2c14e, #c9911e);
        }

        .achievement-card-progress-text {
            margin-top: 0.15rem;
            font-size: 0.62rem;
            color: #8a6d1f;
        }

        .achievement-card-name {
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--sl-color-neutral-800);
            line-height: 1.25;
            word-break: break-word;
        }

        .achievement-card-date {
            font-size: 0.68rem;
            color: var(--sl-color-neutral-500);
        }

        /* 空状态 */
        .achievement-empty {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            min-height: 18rem;
            text-align: center;
            color: var(--sl-color-neutral-500);
        }

        .achievement-empty sl-icon {
            font-size: 3rem;
            opacity: 0.32;
        }

        /* 翻页 */
        .achievement-pager {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .achievement-pager-info {
            min-width: 6.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--sl-color-neutral-600);
        }

        /* 详情弹窗 */
        .achievement-detail-art {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 5.4rem;
            height: 5.4rem;
            padding: 0.35rem;
            border-radius: 1.1rem;
            border: 1px solid var(--sl-color-neutral-200);
            background: linear-gradient(165deg, #ffffff, #f1f5f9);
            box-shadow: 0 0.5rem 1.1rem rgba(100, 116, 139, 0.18);
        }

        .achievement-detail-art.rarity-bronze {
            border-color: rgba(180, 83, 9, 0.38);
            background: linear-gradient(165deg, #fffaf3, #f6e3d0);
        }

        .achievement-detail-art.rarity-silver {
            border-color: rgba(100, 116, 139, 0.42);
            background: linear-gradient(165deg, #ffffff, #e6edf5);
        }

        .achievement-detail-art.rarity-gold {
            border-color: rgba(212, 168, 83, 0.68);
            background: linear-gradient(165deg, #fffdf3, #fbe8b5);
        }

        .achievement-detail-art.rarity-diamond {
            border-color: rgba(96, 165, 250, 0.72);
            background:
                repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.72) 0 1px, rgba(255, 255, 255, 0) 1px 10px),
                repeating-linear-gradient(-60deg, rgba(120, 172, 226, 0.32) 0 1px, rgba(120, 172, 226, 0) 1px 10px),
                conic-gradient(from 200deg at 30% 18%, #f4fbff 0deg, #cfe4fa 42deg, #ffffff 88deg, #b9d9f6 138deg, #e8f3ff 190deg, #a9cdee 240deg, #f3f9ff 286deg, #d9ebfd 330deg, #f4fbff 360deg);
            box-shadow: 0 0.5rem 1.1rem rgba(37, 99, 235, 0.24);
        }

        .achievement-detail-progress {
            width: 100%;
            max-width: 18rem;
        }

        /* 所有成就 */
        .achievement-all-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.7rem;
            border: 1px solid var(--sl-color-neutral-200);
            border-radius: 0.75rem;
            background: #ffffff;
        }

        .achievement-all-row + .achievement-all-row {
            margin-top: 0.5rem;
        }

        .achievement-all-row.locked {
            opacity: 0.55;
            background: var(--sl-color-neutral-50);
        }

        .achievement-all-art {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.6rem;
            height: 2.6rem;
            padding: 0.15rem;
            border-radius: 0.6rem;
            border: 1px solid var(--sl-color-neutral-200);
            background: #ffffff;
        }

        .achievement-all-row.rarity-bronze .achievement-all-art {
            border-color: rgba(180, 83, 9, 0.35);
            background: linear-gradient(165deg, #fffaf3, #f6e3d0);
        }

        .achievement-all-row.rarity-silver .achievement-all-art {
            border-color: rgba(100, 116, 139, 0.4);
            background: linear-gradient(165deg, #ffffff, #e6edf5);
        }

        .achievement-all-row.rarity-gold .achievement-all-art {
            border-color: rgba(212, 168, 83, 0.62);
            background: linear-gradient(165deg, #fffdf3, #fbe8b5);
        }

        .achievement-all-row.rarity-diamond .achievement-all-art {
            border-color: rgba(96, 165, 250, 0.65);
            background:
                repeating-linear-gradient(60deg, rgba(255, 255, 255, 0.72) 0 1px, rgba(255, 255, 255, 0) 1px 9px),
                repeating-linear-gradient(-60deg, rgba(120, 172, 226, 0.3) 0 1px, rgba(120, 172, 226, 0) 1px 9px),
                conic-gradient(from 200deg at 30% 18%, #f4fbff 0deg, #cfe4fa 42deg, #ffffff 88deg, #b9d9f6 138deg, #e8f3ff 190deg, #a9cdee 240deg, #f3f9ff 286deg, #d9ebfd 330deg, #f4fbff 360deg);
        }

        .achievement-all-row.locked .achievement-all-art {
            filter: grayscale(0.75);
            opacity: 0.7;
        }

        .achievement-all-info {
            flex-grow: 1;
            min-width: 0;
        }

        .achievement-all-name {
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--sl-color-neutral-800);
        }

        .achievement-all-desc {
            font-size: 0.74rem;
            color: var(--sl-color-neutral-600);
            line-height: 1.35;
            word-break: break-word;
        }

        .achievement-all-time {
            flex: 0 0 auto;
            font-size: 0.7rem;
            color: var(--sl-color-neutral-500);
            text-align: right;
        }

        /* ==========================================
           替换 UI 适配 · 幽蓝时空
           展示柜、展示位、成就卡片与弹窗同步换成蓝黑舰桥配色
           ========================================== */
        html.theme-void .achievement-header-icon {
            color: #ff5d70;
        }

        html.theme-void .achievement-header h1 {
            color: #e8f2ff;
        }

        html.theme-void .achievement-cabinet {
            border-color: rgba(80, 132, 190, 0.32);
            background: linear-gradient(180deg, rgba(13, 26, 44, 0.94), rgba(8, 17, 30, 0.96));
            box-shadow: 0 1.2rem 2.6rem rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(140, 190, 250, 0.12);
        }

        html.theme-void .achievement-cabinet::before {
            background-image: radial-gradient(rgba(96, 158, 224, 0.22) 1px, transparent 1px);
        }

        html.theme-void .achievement-cabinet-title {
            color: #cfdcf3;
        }

        html.theme-void .achievement-cabinet-title sl-icon {
            color: #ffb15c;
        }

        html.theme-void .achievement-showcase {
            border-bottom-color: rgba(80, 132, 190, 0.34);
        }

        html.theme-void .achievement-showcase-item {
            border-color: rgba(80, 132, 190, 0.4);
            background: rgba(10, 22, 38, 0.66);
        }

        html.theme-void .achievement-showcase-item.filled {
            border-color: rgba(212, 168, 83, 0.55);
            background: linear-gradient(165deg, #241f18, #2b2214);
            box-shadow: 0 0.25rem 0.7rem rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 232, 176, 0.12);
        }

        html.theme-void .achievement-showcase-name {
            color: #dbe6f7;
        }

        html.theme-void .achievement-showcase-empty {
            color: #8499b8;
        }

        html.theme-void .achievement-card {
            border-color: rgba(80, 132, 190, 0.28);
            background: linear-gradient(180deg, #0d1a2c, #0a1422);
            box-shadow: 0 0.28rem 0.75rem rgba(0, 0, 0, 0.3);
        }

        html.theme-void .achievement-card:hover,
        html.theme-void .achievement-card:focus-visible {
            border-color: rgba(255, 177, 92, 0.72);
            box-shadow: 0 0.75rem 1.4rem rgba(0, 0, 0, 0.5);
        }

        html.theme-void .achievement-card.rarity-bronze {
            border-color: rgba(200, 126, 70, 0.55);
            background: linear-gradient(165deg, #241a16, #2e2119);
            box-shadow: 0 0.28rem 0.75rem rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 214, 178, 0.1);
        }

        html.theme-void .achievement-card.rarity-silver {
            border-color: rgba(140, 170, 205, 0.55);
            background: linear-gradient(165deg, #131f2e, #1b2a3d);
            box-shadow: 0 0.28rem 0.75rem rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(220, 238, 255, 0.12);
        }

        html.theme-void .achievement-card.rarity-gold {
            border-color: rgba(230, 180, 80, 0.6);
            background: linear-gradient(165deg, #241f14, #332713);
            box-shadow: 0 0.32rem 0.85rem rgba(0, 0, 0, 0.34), inset 0 1px 0 rgba(255, 236, 186, 0.14);
        }

        html.theme-void .achievement-card.rarity-bronze:hover,
        html.theme-void .achievement-card.rarity-bronze:focus-visible {
            box-shadow: 0 0.8rem 1.5rem rgba(0, 0, 0, 0.5);
        }

        html.theme-void .achievement-card.rarity-silver:hover,
        html.theme-void .achievement-card.rarity-silver:focus-visible {
            box-shadow: 0 0.8rem 1.5rem rgba(0, 0, 0, 0.5);
        }

        html.theme-void .achievement-card.rarity-gold:hover,
        html.theme-void .achievement-card.rarity-gold:focus-visible {
            box-shadow: 0 0.85rem 1.6rem rgba(0, 0, 0, 0.5);
        }

        html.theme-void .achievement-card.rarity-diamond {
            border-color: rgba(140, 205, 255, 0.68);

    <script>
        (async () => {
            const icons = Array.from(document.querySelectorAll('sl-icon'));
            const st = Date.now();

            await Promise.allSettled([
                customElements.whenDefined('sl-button'),
                customElements.whenDefined('sl-icon'),
                customElements.whenDefined('sl-dialog'),
            ]);

            if (document.readyState === 'loading') await new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve, { 'once': true }));

            await Promise.allSettled(icons.map((icon) => new Promise((resolve) => {
                if (icon.hasAttribute('library')) resolve();
                icon.addEventListener('sl-load', () => requestAnimationFrame(() => requestAnimationFrame(resolve)), { 'once': true });
            })));

            await new Promise((resolve) => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { 'once': true });
            });

            const elapsed = Date.now() - st;
            setTimeout(() => {
                window.loaded = true;
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                    setTimeout(() => loader.remove(), 400);
                }
            }, Math.max(0, 300 - elapsed));
        })();
    </script>
