<html>


<head>

    <meta http-equiv='X-UA-Compatible' content='IE=edge'>

    <title>四子棋 所有回放</title>

    <!-- Shoelace -->
    <link href='https://quantil.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css' rel='stylesheet'>
    <script src='https://quantil.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js'
        type='module'></script>

    <link href='/css/global.min.css?v=replace' rel='stylesheet'>
    <link href='/css/game.min.css?v=replace' rel='stylesheet'>


    <!-- 加载动画 -->
    <style>
        .loading-a {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 1);
            transition: all 0.4s ease;
        }

        .loading-p {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: loading-spin 1s linear infinite;
        }

        .loading-t {
            margin-top: 15px;
            font-family: sans-serif;
            color: #666;
            font-size: 14px;
        }

        @keyframes loading-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .replay-code {
            color: var(--sl-color-primary-600, #0d6efd);
            cursor: pointer;
            text-decoration: underline;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            user-select: text;
            -webkit-user-select: text;
        }

        .replay-code:focus {
            outline: 2px solid var(--sl-color-primary-300, #86b7fe);
            outline-offset: 2px;
        }

        .record-row:hover {
            background-color: rgba(13, 110, 253, 0.06);
        }

        .record-win {
            color: var(--sl-color-danger-600, #dc3545);
        }

        .record-loss {
            color: var(--sl-color-success-600, #198754);
        }

        /* 回放列表：桌面保持表格，手机端切换为信息卡片 */
        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100dvh;
        }

        #main {
            min-height: 0;
        }

        #main_opt {
            width: min(100%, 960px);
            min-height: 100%;
            padding-inline: clamp(0.75rem, 3vw, 1rem) !important;
        }

        .replay-intro {
            flex: 0 0 auto;
        }

        .replay-stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.65rem;
        }

        .replay-stat {
            min-width: 0;
            padding: 0.75rem 0.65rem;
            text-align: center;
        }

        .replay-stat-label {
            color: var(--bs-secondary-color, #6c757d);
            font-size: 0.78rem;
            line-height: 1.4;
        }

        .replay-stat-value {
            margin-top: 0.15rem;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.25;
        }

        .replay-stat-value.record-win {
            color: var(--sl-color-danger-600, #dc3545);
        }

        .replay-stat-value.record-loss {
            color: var(--sl-color-success-600, #198754);
        }

        .replay-stats-note {
            margin-top: 0.55rem;
            color: var(--bs-secondary-color, #6c757d);
            font-size: 0.75rem;
            text-align: center;
        }

        .replay-toolbar {
            min-width: 0;
        }

        .replay-toolbar-actions {
            flex: 0 0 auto;
        }

        .replay-table-wrap {
            min-width: 0;
        }

        .replay-table {
            min-width: 760px;
        }

        .record-row td {
            vertical-align: middle;
        }

        .record-row td > * {
            min-width: 0;
        }

        .replay-footer-links {
            flex-wrap: wrap;
            padding-inline: 0.75rem;
        }

        @media (max-width: 767.98px) {
            #button_home {
                padding: 0.5rem !important;
            }

            #header {
                padding-top: 0.65rem !important;
                padding-right: 3.5rem;
                padding-left: 3.5rem;
            }

            #main {
                padding-top: 0.5rem !important;
            }

            #main_opt {
                height: auto !important;
                padding-inline: 0 !important;
            }

            .replay-intro {
                margin-bottom: 0.85rem !important;
            }

            #game_icon {
                font-size: 3rem !important;
            }

            .replay-stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.5rem;
            }

            .replay-stat {
                padding: 0.65rem 0.45rem;
            }

            .replay-stat-value {
                font-size: 1.08rem;
            }

            .replay-toolbar-card {
                padding: 0.85rem !important;
            }

            .replay-toolbar {
                align-items: stretch !important;
                flex-direction: column;
                gap: 0.65rem !important;
            }

            #status {
                line-height: 1.45;
            }

            .replay-toolbar-actions {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0.5rem !important;
                width: 100%;
            }

            .replay-toolbar-actions sl-button {
                width: 100%;
            }

            .replay-table-card {
                overflow: visible !important;
                background: transparent !important;
            }

            .replay-table-wrap {
                overflow: visible;
            }

            .replay-table {
                min-width: 0;
                border-collapse: separate;
                border-spacing: 0 0.65rem;
            }

            .replay-table thead {
                display: none;
            }

            .replay-table tbody,
            .replay-table tr {
                display: block;
                width: 100%;
            }

            .record-row {
                display: block;
                overflow: hidden;
                border: 1px solid rgba(0, 0, 0, 0.08);
                border-radius: 0.5rem;
                background: var(--bs-body-bg, #fff);
                box-shadow: 0 0.15rem 0.45rem rgba(0, 0, 0, 0.04);
            }

            .record-row:hover {
                background: var(--bs-body-bg, #fff);
            }

            .record-row td {
                display: grid;
                grid-template-columns: 5.25rem minmax(0, 1fr);
                gap: 0.65rem;
                align-items: start;
                width: 100%;
                padding: 0.7rem 0.85rem !important;
                border-bottom: 1px solid rgba(0, 0, 0, 0.06);
                white-space: normal;
                overflow-wrap: anywhere;
            }

            .record-row td::before {
                color: var(--bs-secondary-color, #6c757d);
                content: attr(data-label);
                font-size: 0.78rem;
                line-height: 1.5;
            }

            .record-row td:last-child {
                display: block;
                border-bottom: 0;
            }

            .record-row td:last-child::before {
                display: block;
                margin-bottom: 0.45rem;
            }

            .record-row td:last-child > div {
                width: 100%;
            }

            .record-row td:last-child sl-button {
                flex: 1 1 0;
                min-width: 0;
            }

            .record-empty td {
                display: block;
                padding: 1.5rem 0.85rem !important;
                border: 0;
            }

            .record-empty td::before {
                display: none;
            }

            .replay-note {
                line-height: 1.55;
            }

            .replay-footer-links {
                row-gap: 0.2rem;
                column-gap: 0.45rem !important;
                line-height: 1.4;
            }
        }

        @media (max-width: 380px) {
            .replay-toolbar-actions {
                grid-template-columns: 1fr;
            }

            .record-row td {
                grid-template-columns: 4.7rem minmax(0, 1fr);
                gap: 0.5rem;
                padding-inline: 0.7rem !important;
            }
        }
    </style>

    <div id='loading' class='loading-a'>
        <div class='loading-p'></div>
        <p class='loading-t'>正在初始化...</p>
    </div>

    <script>
        (async () => {
            const icons = Array.from(document.querySelectorAll('sl-icon'));
            const st = Date.now();

            await Promise.allSettled([
                customElements.whenDefined('sl-button'),
                customElements.whenDefined('sl-icon'),
                customElements.whenDefined('sl-input'),
                customElements.whenDefined('sl-alert'),
                customElements.whenDefined('sl-tag'),
                customElements.whenDefined('sl-dialog'),
            ]);

            if (document.readyState === 'loading') await new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve, { 'once': true }))

            await Promise.allSettled(icons.map((icon) => {
                return new Promise((resolve) => {
                    if (icon.hasAttribute('library')) resolve();
                    icon.addEventListener('sl-load', () => requestAnimationFrame(() => requestAnimationFrame(resolve)), { 'once': true });
                });
            }));

            await new Promise((resolve) => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { 'once': true });
            });

            await Promise.allSettled([...document.images]
                .map((image) => image.complete ? Promise.resolve() : new Promise((resolve) => image.onload = resolve)));

            await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

            const elapsed = Date.now() - st;
            const delay = Math.max(0, 300 - elapsed);

            setTimeout(() => {
                window.loaded = true;

                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                    setTimeout(() => loader.remove(), 400);
                }
            }, delay);
        })();
    </script>
</head>

<script>
    const DEMO_REPLAYS = [
        { type: '房间号对战', time: '2026-09-02 12:08', duration: 755, result: '胜利', black_hp: 3, white_hp: 0, code: 'DEMO-ROOM-20260902-A' },
        { type: '排位战', time: '2026-09-01 21:34', duration: 1120, result: '失败', black_hp: 0, white_hp: 2, code: 'DEMO-RANK-20260901-B' },
        { type: '房间号对战', time: '2026-09-01 18:16', duration: 493, result: '胜利', black_hp: 1, white_hp: 0, code: 'DEMO-ROOM-20260901-C' }
    ];

    const state = { rows: [], lastCode: '', lastClickAt: 0 };
    const body = document.getElementById('replayBody');
    const status = document.getElementById('status');
    const copyAlert = document.getElementById('copy_alert');
    const statTotal = document.getElementById('statTotal');
    const statWins = document.getElementById('statWins');
    const statLosses = document.getElementById('statLosses');
    const statWinRate = document.getElementById('statWinRate');

    function formatDuration(seconds) {
        const total = Math.max(0, Number(seconds) || 0);
        return `${Math.floor(total / 60)}分${String(total % 60).padStart(2, '0')}秒`;
    }

    function normalize(row) {
        const mode = Number(row.mode);
        return {
            id: String(row.id || ''),
            type: row.type || '房间号对战',
            modeLabel: row.mode_label || (mode === 2 ? '永夜模式' : mode === 1 ? '灾荒模式' : '普通模式'),
            time: row.time ? (Number.isFinite(Number(row.time)) ? new Date(Number(row.time) * 1000).toLocaleString('zh-CN', { hour12: false }) : String(row.time)) : '未知时间',
            duration: row.duration ?? row.gameDuration ?? row.gameLength ?? 0,
            result: row.result_label || row.result || '未知',
            blackHp: row.black_hp ?? row.blackHP ?? row.hp_black ?? row.hp ?? 0,
            whiteHp: row.white_hp ?? row.whiteHP ?? row.hp_white ?? row.hp ?? 0,
            first: row.first_label || (Number(row.first) === 0 ? '黑方' : '白方'),
            black: row.black_name || row.black_uuid || '黑方',
            white: row.white_name || row.white_uuid || '白方',
            code: String(row.code || row.replayCode || row.id || '')
        };
    }

    function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[ch]));
    }

    function renderStats() {
        const rows = state.rows.slice(0, 100).map(normalize);
        const wins = rows.filter((row) => row.result === '胜利').length;
        const losses = rows.filter((row) => row.result === '失败').length;
        const total = rows.length;
        const winRate = total ? `${((wins / total) * 100).toFixed(1).replace(/\.0$/, '')}%` : '0%';

        statTotal.textContent = String(total);
        statWins.textContent = String(wins);
        statLosses.textContent = String(losses);
        statWinRate.textContent = winRate;
    }

    function render() {
        renderStats();
        body.replaceChildren();
        if (!state.rows.length) {
            body.innerHTML = '<tr class="record-empty"><td class="text-center text-muted py-4" colspan="7">暂无真人对战回放</td></tr>';
            return;
        }

        state.rows.slice(0, 100).forEach((raw) => {
            const row = normalize(raw);
            const tr = document.createElement('tr');
            tr.className = 'record-row';
            const resultClass = row.result === '胜利' ? 'record-win' : row.result === '失败' ? 'record-loss' : '';
            tr.innerHTML = `
                <td data-label="类型">${escapeHtml(row.type)}<div class="text-muted small">${escapeHtml(row.modeLabel)} · ${escapeHtml(formatDuration(row.duration))}</div></td>
                <td data-label="时间">${escapeHtml(row.time)}</td>
                <td data-label="对局双方"><div class="fw-semibold">${escapeHtml(row.black)} <span class="text-muted">VS</span> ${escapeHtml(row.white)}</div><div class="text-muted small">黑方 / 白方</div></td>
                <td data-label="先手">${escapeHtml(row.first)}</td>
                <td data-label="胜负" class="${resultClass}">${escapeHtml(row.result)}</td>
                <td data-label="双方血量"><span class="text-nowrap">黑方 ${escapeHtml(String(row.blackHp))} 血</span><span class="text-nowrap">白方 ${escapeHtml(String(row.whiteHp))} 血</span></td>
                <td data-label="操作"><div class="d-flex flex-wrap gap-1"><sl-button size="small" variant="primary" outline class="btn-copy-archive" data-id="${escapeHtml(row.id)}">复制回放码</sl-button><sl-button size="small" variant="primary" class="btn-open-archive" data-id="${escapeHtml(row.id)}">打开复盘</sl-button></div></td>
            `;
            body.appendChild(tr);
        });
        status.textContent = `已加载 ${Math.min(state.rows.length, 100)} 局 · 在线账号回放`;
        if (state.rows.length > 100) status.textContent += '（服务端将自动保留最近 100 局）';
    }

    async function copyCode(code) {
        try {
            await navigator.clipboard.writeText(code);
        } catch (_) {
            const input = document.createElement('textarea');
            input.value = code;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            input.remove();
        }
        if (copyAlert && copyAlert.toast) copyAlert.toast();
    }

    async function getArchive(id) {
        if (!id || typeof window.http_replay_get !== 'function') return;
        const data = await window.http_replay_get(id);
        if (!data) throw new Error('回放数据为空');
        return window.UtilsExports.BaseZalgo.encode(data);
    }

    async function openReplay(id) {
        window.location.assign(`/pages/local/replay.html?id=${encodeURIComponent(id)}`);
    }

    body.addEventListener('click', async (event) => {
        const copyTarget = event.target.closest('.btn-copy-archive');
        const openTarget = event.target.closest('.btn-open-archive');
        const target = copyTarget || openTarget;
        if (!target) return;
        const id = target.dataset.id;
        if (!id) return;
        if (openTarget) return openReplay(id);
        target.loading = true;
        try {
            const archive = await getArchive(id);
            await copyCode(archive);
        } catch (_) {
            status.textContent = '回放数据加载失败，请稍后重试';
        } finally {
            target.loading = false;
        }
    });

    body.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') event.target.click();
    });

    async function loadOnlineReplays() {
        status.textContent = '正在加载在线回放...';
        try {
            if (typeof window.http_replay_query === 'function' && typeof window.get_token === 'function') {
                const token = window.get_token();
                if (token) {
                    const rows = await window.http_replay_query(token);
                    state.rows = Array.isArray(rows) ? rows : [];
                    render();
                    return;
                }
            }
            state.rows = DEMO_REPLAYS;
            render();
            status.textContent = '当前为本地演示数据；登录后读取同一账号回放';
        } catch (_) {
            state.rows = DEMO_REPLAYS;
            render();
            status.textContent = '在线接口暂不可用，当前显示本地演示数据';
        }
    }

    function exportCsv() {
        const lines = [['类型', '时间', '黑方', '白方', '先手', '时长', '结果', '双方血量', '回放ID'], ...state.rows.slice(0, 100).map((raw) => {
            const row = normalize(raw);
            return [row.type, row.time, row.black, row.white, row.first, formatDuration(row.duration), row.result, `黑方${row.blackHp}血 / 白方${row.whiteHp}血`, row.id];
        })];
        const csv = '\ufeff' + lines.map((line) => line.map((value) => `"${String(value).replace(/"/g, '""')}"`).join(',')).join('\n');
        const link = document.createElement('a');
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
        link.download = '四子棋-在线回放.csv';
        link.click();
        URL.revokeObjectURL(link.href);
    }

    document.getElementById('refreshBtn').addEventListener('click', loadOnlineReplays);
    document.getElementById('exportBtn').addEventListener('click', exportCsv);
    loadOnlineReplays();
</script>
