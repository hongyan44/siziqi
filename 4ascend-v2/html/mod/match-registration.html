    <style>
        .loading-a {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 1);
            transition: all 0.4s ease;
        }

        .loading-p {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: loading-spin 1s linear infinite;
        }

        .loading-t {
            margin-top: 15px;
            font-family: sans-serif;
            color: #666;
            font-size: 14px;
        }

        @keyframes loading-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .category-title {
            font-size: 1.1rem;
            color: var(--sl-color-neutral-600);
            border-left: 4px solid var(--sl-color-primary-500);
            padding-left: 8px;
            margin-bottom: 0.5rem;
        }

        /* 节点地图画布 */
        .bracket-wrap {
            position: relative;
        }

        .bracket-canvas {
            position: relative;
            height: 480px;
            overflow: auto;
            border: 1px solid rgba(13, 110, 253, 0.14);
            border-radius: 0.85rem;
            background-color: #fff;
        }

        .bracket-spacer {
            position: relative;
            background-image: radial-gradient(rgba(13, 110, 253, 0.08) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .bracket-world {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        .bracket-edges {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 缩放控件 */
        .zoom-controls {
            position: sticky;
            float: right;
            bottom: 0.75rem;
            right: 0.75rem;
            margin-right: 0.75rem;
            z-index: 10;
            display: flex;
            gap: 0.3rem;
        }

        /* 方块节点：长方形、蓝色边框、白色内部 */
        .bracket-node {
            position: absolute;
            width: 240px;
            background: #ffffff;
            border: 1.5px solid rgba(13, 110, 253, 0.5);
            border-radius: 0.5rem;
            box-shadow: 0 0.25rem 0.9rem rgba(13, 110, 253, 0.08);
            cursor: pointer;
            user-select: none;
            touch-action: none;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .bracket-node:hover,
        .bracket-node:focus-visible {
            border-color: rgba(13, 110, 253, 0.85);
            box-shadow: 0 0.4rem 1.2rem rgba(13, 110, 253, 0.16);
            outline: none;
        }

        .bracket-node.dragging {
            box-shadow: 0 0.6rem 1.6rem rgba(13, 110, 253, 0.24);
            border-color: rgba(13, 110, 253, 0.9);
            z-index: 5;
        }

        .bracket-node-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.4rem;
            padding: 0.55rem 0.75rem;
            border-bottom: 1px solid rgba(13, 110, 253, 0.16);
        }

        .bracket-node-name {
            font-weight: 700;
            font-size: 0.92rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1 1 auto;
            min-width: 0;
        }

        .node-actions {
            display: flex;
            gap: 0.15rem;
            flex: 0 0 auto;
        }

        .node-actions sl-icon-button {
            font-size: 1rem;
        }

        .bracket-node-body {
            padding: 0.55rem 0.75rem 0.65rem;
        }

        .bracket-node-count {
            font-size: 0.8rem;
            color: var(--sl-color-neutral-500);
        }

        .bracket-node-players {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.45rem;
        }

        .bracket-node-chip {
            max-width: 100%;
            padding: 0.1rem 0.5rem;
            border: 1px solid var(--sl-color-neutral-200);
            border-radius: 999px;
            background: var(--sl-color-neutral-50);
            font-size: 0.74rem;
            color: var(--sl-color-neutral-700);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bracket-node-chip.more {
            border-style: dashed;
            color: var(--sl-color-neutral-500);
        }

        /* 弹窗分组卡片 */
        .group-card {
            border: 1px solid rgba(13, 110, 253, 0.2);
            border-radius: 0.7rem;
            background: #fff;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .group-card.drag-over {
            border-color: rgba(13, 110, 253, 0.8);
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        }

        .group-card-head {
            padding: 0.35rem 0.7rem;
            border-bottom: 1px solid rgba(13, 110, 253, 0.12);
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--sl-color-primary-700);
            background: rgba(13, 110, 253, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .group-card-body {
            padding: 0.5rem;
            min-height: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .group-card-body.empty::after {
            content: '暂无选手';
            font-size: 0.72rem;
            color: var(--sl-color-neutral-400);
            text-align: center;
            padding: 0.3rem 0;
        }

        .group-player {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.25rem 0.5rem;
            border: 1px solid var(--sl-color-neutral-200);
            border-radius: 0.4rem;
            background: var(--sl-color-neutral-50);
            font-size: 0.8rem;
            cursor: grab;
        }

        .group-player:active {
            cursor: grabbing;
        }

        .group-player .remove-btn {
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.15s ease;
            cursor: pointer;
            color: var(--sl-color-danger-500);
        }

        .group-player:hover .remove-btn {
            opacity: 1;
        }

        .admin-panel {
            border: 1px solid rgba(255, 193, 7, 0.35);
            background: rgba(255, 193, 7, 0.08);
            border-radius: 0.7rem;
        }
    </style>

    <div id='loading' class='loading-a'>
        <div class='loading-p'></div>
        <p class='loading-t'>正在初始化...</p>
    </div>

    <script>
        (async () => {
            const icons = Array.from(document.querySelectorAll('sl-icon'));
            const st = Date.now();
            await Promise.allSettled([
                customElements.whenDefined('sl-button'),
                customElements.whenDefined('sl-icon'),
                customElements.whenDefined('sl-icon-button'),
                customElements.whenDefined('sl-input'),
                customElements.whenDefined('sl-badge'),
                customElements.whenDefined('sl-dialog'),
            ]);
            if (document.readyState === 'loading') await new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve, { 'once': true }));
            await Promise.allSettled(icons.map((icon) => new Promise((resolve) => {
                if (icon.hasAttribute('library')) resolve();
                icon.addEventListener('sl-load', () => requestAnimationFrame(() => requestAnimationFrame(resolve)), { 'once': true });
            })));
            await new Promise((resolve) => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { 'once': true });
            });
            setTimeout(() => {
                window.loaded = true;
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                    setTimeout(() => loader.remove(), 400);
                }
            }, Math.max(0, 300 - (Date.now() - st)));
        })();
    </script>
</head>

    <script>
        // 管理员身份检验
        let isAdmin = false;
        let userInfo = null;

        const verify_admin = async () => {
            const token = window.get_token();
            if (!token) return;
            try {
                userInfo = await window.http_user_info(token);
                isAdmin = Number(userInfo && userInfo.level) === 4;
            } catch (_) {
                isAdmin = false;
            }
        };

        const STORAGE_KEY = 'match_bracket_state_v2';
        const NODE_WIDTH = 240;
        const NODE_HEIGHT = 120;
        const WORLD_MIN = { w: 1600, h: 1000 };
        // 世界边界可随方块拖动动态扩展
        let worldBounds = { w: WORLD_MIN.w, h: WORLD_MIN.h };

        // 节点数据模型
        // node = { id, name, maxPlayers, groupCount, players, groups, x, y, main }
        // groups: 二维数组，每项是该组的玩家名列表
        const defaultState = () => ({
            nodes: [
                { id: 'node_main', name: '主赛事（第1次抽签）', maxPlayers: 16, groupCount: 8, players: [], groups: Array.from({ length: 8 }, () => []), x: 96, y: 400, main: true }
            ],
            edges: []
        });

        let state;
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if (saved && Array.isArray(saved.nodes) && saved.nodes.length) {
                state = saved;
            } else {
                state = defaultState();
            }
        } catch (_) {
            state = defaultState();
        }

        // 数据迁移与校验
        state.nodes.forEach((node) => {
            node.maxPlayers = Number.isFinite(node.maxPlayers) ? node.maxPlayers : 16;
            node.groupCount = Number.isFinite(node.groupCount) ? node.groupCount : 8;
            node.players = Array.isArray(node.players) ? node.players : [];
            node.x = typeof node.x === 'number' ? node.x : 96;
            node.y = typeof node.y === 'number' ? node.y : 400;
            if (!Array.isArray(node.groups) || node.groups.length !== node.groupCount) {
                // 重建 groups
                node.groups = Array.from({ length: node.groupCount }, () => []);
                // 尝试把旧 players 回填到 groups
                for (let i = 0; i < node.players.length; i++) {
                    const gi = i % node.groupCount;
                    node.groups[gi].push(node.players[i]);
                }
            }
        });
        if (!state.nodes.some((node) => node.main)) state.nodes[0].main = true;

        const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

        const canvas = document.getElementById('bracket_canvas');
        const world = document.getElementById('bracket_world');
        const edgesSvg = document.getElementById('bracket_edges');
        const dialog = document.getElementById('dialog_node');
        const dialogStatus = document.getElementById('dialog_node_status');
        const dialogListTitle = document.getElementById('dialog_list_title');
        const dialogGroups = document.getElementById('dialog_node_groups');
        const dialogRegisterRow = document.getElementById('dialog_register_row');
        const dialogAdminPanel = document.getElementById('dialog_admin_panel');
        const registerAccount = document.getElementById('register_account');
        const registerHint = document.getElementById('register_hint');
        const joinButton = document.getElementById('button_join');
        const nodeNameInput = document.getElementById('input_node_name');
        const nodeMaxInput = document.getElementById('input_node_max_players');
        const nodeGroupInput = document.getElementById('input_node_group_count');
        const saveNodeButton = document.getElementById('button_save_node');
        const deleteNodeButton = document.getElementById('button_delete_node');
        const summaryPlayers = document.getElementById('summary_players');
        const summaryGroups = document.getElementById('summary_groups');
        const summaryStatus = document.getElementById('summary_status');

        let activeNodeId = null;
        let zoom = 1;

        const findNode = (id) => state.nodes.find((node) => node.id === id);

        // 仅统计主方块数据
        const mainNode = () => state.nodes.find((node) => node.main) || state.nodes[0];

        const nodeStatus = (node) => {
            const total = node.players.length;
            if (total >= node.maxPlayers) return { text: '已满员', variant: 'danger' };
            return { text: '报名中', variant: 'success' };
        };

        const updateWorldBounds = () => {
            let maxX = WORLD_MIN.w, maxY = WORLD_MIN.h;
            state.nodes.forEach((node) => {
                maxX = Math.max(maxX, node.x + NODE_WIDTH + 320);
                maxY = Math.max(maxY, node.y + NODE_HEIGHT + 240);
            });
            worldBounds = { w: Math.ceil(maxX), h: Math.ceil(maxY) };
            // spacer 负责撑开滚动区域，world 负责承载缩放后的内容
            const spacer = document.querySelector('.bracket-spacer');
            if (spacer) {
                spacer.style.width = `${worldBounds.w}px`;
                spacer.style.height = `${worldBounds.h}px`;
            }
            world.style.width = `${worldBounds.w}px`;
            world.style.height = `${worldBounds.h}px`;
            edgesSvg.setAttribute('width', worldBounds.w);
            edgesSvg.setAttribute('height', worldBounds.h);
        };

        const applyZoom = () => {
            world.style.transform = `scale(${zoom})`;
            updateWorldBounds();
        };

        const setZoom = (value) => {
            zoom = Math.max(0.4, Math.min(2, value));
            applyZoom();
        };

        document.getElementById('button_zoom_in').addEventListener('click', () => setZoom(zoom + 0.15));
        document.getElementById('button_zoom_out').addEventListener('click', () => setZoom(zoom - 0.15));
        document.getElementById('button_zoom_reset').addEventListener('click', () => setZoom(1));
        canvas.addEventListener('wheel', (event) => {
            if (!event.ctrlKey) return;
            event.preventDefault();
            setZoom(zoom * (event.deltaY < 0 ? 1.1 : 0.9));
        }, { passive: false });

        // 仅显示主方块统计
        const renderSummary = () => {
            const m = mainNode();
            const total = m.players.length;
            const filledGroups = m.groups.filter((g) => g.length > 0).length;
            summaryPlayers.textContent = `${total} / ${m.maxPlayers} 人`;
            summaryGroups.textContent = `${filledGroups} / ${m.groupCount} 组`;
            summaryStatus.textContent = total >= m.maxPlayers ? '已满员' : '报名中';
            summaryStatus.variant = total >= m.maxPlayers ? 'danger' : 'success';
        };

        const renderEdges = () => {
            edgesSvg.innerHTML = '';
            state.edges.forEach((edge) => {
                const from = findNode(edge.from);
                const to = findNode(edge.to);
                if (!from || !to) return;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const x1 = from.x + NODE_WIDTH, y1 = from.y + 60;
                const x2 = to.x, y2 = to.y + 60;
                line.setAttribute('d', `M ${x1} ${y1} C ${x1 + 48} ${y1}, ${x2 - 48} ${y2}, ${x2} ${y2}`);
                line.setAttribute('stroke', 'rgba(13, 110, 253, 0.45)');
                line.setAttribute('stroke-width', '1.5');
                line.setAttribute('fill', 'none');
                edgesSvg.appendChild(line);
            });
        };

        // 添加分支方块
        const addBranch = (parentId) => {
            const parent = findNode(parentId);
            if (!parent) return;
            const branchIndex = state.edges.filter((edge) => edge.from === parentId).length;
            const id = `node_${Date.now()}`;
            const fan = branchIndex === 0 ? 0 : (branchIndex % 2 === 1 ? 1 : -1) * Math.ceil(branchIndex / 2);
            state.nodes.push({
                id,
                name: `分支方块 ${state.nodes.length}`,
                maxPlayers: 8,
                groupCount: 4,
                players: [],
                groups: Array.from({ length: 4 }, () => []),
                drawn: false,
                x: parent.x + 340,
                y: Math.max(24, parent.y + fan * 170)
            });
            state.edges.push({ from: parentId, to: id });
            saveState();
            render();
        };

        // 删除方块（主方块除外）
        const deleteNode = (id) => {
            const node = findNode(id);
            if (!node || node.main) return;
            state.nodes = state.nodes.filter((item) => item.id !== id);
            state.edges = state.edges.filter((edge) => edge.from !== id && edge.to !== id);
            if (activeNodeId === id) activeNodeId = null;
            saveState();
            render();
        };

        // 方块拖动
        const bindDrag = (el, node) => {
            el.addEventListener('pointerdown', (event) => {
                if (!isAdmin || event.button !== 0) return;
                if (event.target.closest('.node-actions')) return;
                const drag = { startX: event.clientX, startY: event.clientY, origX: node.x, origY: node.y, moved: false };
                el.setPointerCapture(event.pointerId);
                el.classList.add('dragging');

                const onMove = (e) => {
                    const dx = (e.clientX - drag.startX) / zoom;
                    const dy = (e.clientY - drag.startY) / zoom;
                    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
                    drag.moved = true;
                    node.x = Math.max(0, drag.origX + dx);
                    node.y = Math.max(0, drag.origY + dy);
                    el.style.left = `${node.x}px`;
                    el.style.top = `${node.y}px`;
                    renderEdges();
                    // 如果拖到接近边缘，自动扩展世界并滚动
                    const viewport = canvas.getBoundingClientRect();
                    const pX = e.clientX - viewport.left;
                    const pY = e.clientY - viewport.top;
                    if (pX > viewport.width - 40) canvas.scrollLeft += 8;
                    if (pX < 40) canvas.scrollLeft -= 8;
                    if (pY > viewport.height - 40) canvas.scrollTop += 8;
                    if (pY < 40) canvas.scrollTop -= 8;
                };
                const onUp = () => {
                    el.classList.remove('dragging');
                    el.removeEventListener('pointermove', onMove);
                    el.removeEventListener('pointerup', onUp);
                    el.removeEventListener('pointercancel', onUp);
                    if (drag.moved) {
                        updateWorldBounds();
                        saveState();
                    }
                    else openNode(node.id);
                };
                el.addEventListener('pointermove', onMove);
                el.addEventListener('pointerup', onUp);
                el.addEventListener('pointercancel', onUp);
            });
        };

        const renderNodes = () => {
            world.querySelectorAll('.bracket-node').forEach((el) => el.remove());
            state.nodes.forEach((node) => {
                const status = nodeStatus(node);
                const el = document.createElement('div');
                el.className = 'bracket-node';
                el.style.left = `${node.x}px`;
                el.style.top = `${node.y}px`;
                el.setAttribute('role', 'button');
                el.setAttribute('tabindex', '0');
                el.dataset.nodeId = node.id;

                const chips = node.players.slice(0, 6).map((name) => {
                    return `<span class='bracket-node-chip'>${name}</span>`;
                }).join('');
                const more = node.players.length > 6
                    ? `<span class='bracket-node-chip more'>+${node.players.length - 6}</span>` : '';
                const empty = node.players.length ? '' : `<span class='bracket-node-chip more'>虚位以待</span>`;

                el.innerHTML = `
                    <div class='bracket-node-head'>
                        <span class='bracket-node-name'>${node.name}</span>
                        <sl-badge variant='${status.variant}' pill>${status.text}</sl-badge>
                        <span class='node-actions d-none'>
                            ${node.main ? '' : `<sl-icon-button class='node-delete' name='x-lg' label='删除方块'></sl-icon-button>`}
                            <sl-icon-button class='node-add' name='plus-lg' label='添加分支方块'></sl-icon-button>
                        </span>
                    </div>
                    <div class='bracket-node-body'>
                        <div class='bracket-node-count'>${node.groupCount} 组 · 已报名 ${node.players.length} / ${node.maxPlayers} 人</div>
                        <div class='bracket-node-players'>${chips}${more}${empty}</div>
                    </div>
                `;

                const actions = el.querySelector('.node-actions');
                const addBtn = el.querySelector('.node-add');
                const delBtn = el.querySelector('.node-delete');
                addBtn.addEventListener('click', (event) => { event.stopPropagation(); if (isAdmin) addBranch(node.id); });
                if (delBtn) delBtn.addEventListener('click', (event) => { event.stopPropagation(); if (isAdmin) deleteNode(node.id); });

                if (isAdmin) {
                    actions.classList.remove('d-none');
                    bindDrag(el, node);
                } else {
                    el.addEventListener('click', () => openNode(node.id));
                }
                el.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openNode(node.id); }
                });
                world.appendChild(el);
            });
        };

        const render = () => {
            updateWorldBounds();
            renderSummary();
            renderEdges();
            renderNodes();
        };

        // 报名：随机分配到未满的组中
        const assignRandomGroup = (node, name) => {
            if (node.players.includes(name)) return false;
            if (node.players.length >= node.maxPlayers) return false;
            const unfilled = node.groups
                .map((g, i) => ({ i, len: g.length }))
                .filter((item) => item.len < 2);
            if (!unfilled.length) return false;
            // 随机选一个未满组
            const target = unfilled[Math.floor(Math.random() * unfilled.length)];
            node.groups[target.i].push(name);
            node.players.push(name);
            return true;
        };

        // 移动玩家到指定组
        const movePlayerToGroup = (node, name, toGroupIndex) => {
            const fromGroup = node.groups.find((g) => g.includes(name));
            if (!fromGroup) return false;
            if (toGroupIndex < 0 || toGroupIndex >= node.groupCount) return false;
            const toGroup = node.groups[toGroupIndex];
            if (toGroup.includes(name)) return true; // 已在该组
            if (toGroup.length >= 2) return false; // 目标组已满
            fromGroup.splice(fromGroup.indexOf(name), 1);
            toGroup.push(name);
            return true;
        };

        // 从方块中移除玩家
        const removePlayerFromNode = (node, name) => {
            node.players = node.players.filter((n) => n !== name);
            node.groups.forEach((g) => {
                const idx = g.indexOf(name);
                if (idx >= 0) g.splice(idx, 1);
            });
        };

        // 查询账号是否已在任一方块报名，返回所在节点或 null
        const findRegistration = (name) => state.nodes.find((node) => node.players.includes(name)) || null;

        const renderRegisterRow = (node) => {
            const full = node.players.length >= node.maxPlayers;
            if (full) {
                dialogRegisterRow.classList.add('d-none');
                return;
            }
            dialogRegisterRow.classList.remove('d-none');

            const accountName = userInfo && userInfo.name ? userInfo.name : null;
            registerAccount.textContent = accountName || '未登录';

            if (!accountName) {
                joinButton.disabled = true;
                registerHint.textContent = '请先在主页登录账号，报名将与账号绑定。';
                return;
            }

            const registeredNode = findRegistration(accountName);
            if (registeredNode) {
                joinButton.disabled = true;
                registerHint.textContent = registeredNode.id === node.id
                    ? '您已报名该方块，每个账号仅可报名一次。'
                    : `您已报名「${registeredNode.name}」，每个账号在整个赛事中仅可报名一次。`;
                return;
            }

            joinButton.disabled = false;
            registerHint.textContent = '每个账号在整个赛事中仅可报名一次，报名后随机分配到未满的组。每组最多 2 人；若组数大于人数一半，则允许出现 1 人组。';
        };

        const renderDialog = () => {
            const node = findNode(activeNodeId);
            if (!node) return;

            const status = nodeStatus(node);
            dialog.label = node.name;
            dialogStatus.textContent = status.text;
            dialogStatus.variant = status.variant;
            dialogListTitle.textContent = `分组名单（${node.groupCount} 组）`;

            dialogGroups.innerHTML = '';
            node.groups.forEach((group, index) => {
                const card = document.createElement('div');
                card.className = 'group-card';
                card.dataset.groupIndex = index;
                const head = document.createElement('div');
                head.className = 'group-card-head';
                head.innerHTML = `<span>第 ${index + 1} 组</span><span class='text-secondary small'>${group.length} 人</span>`;
                const body = document.createElement('div');
                body.className = 'group-card-body' + (group.length ? '' : ' empty');
                group.forEach((name) => {
                    const row = document.createElement('div');
                    row.className = 'group-player';
                    row.draggable = isAdmin;
                    row.dataset.playerName = name;
                    row.innerHTML = `<sl-icon name='person-fill' style='font-size:0.85rem;'></sl-icon><span class='text-truncate flex-grow-1'>${name}</span>`;
                    if (isAdmin) {
                        const remove = document.createElement('sl-icon');
                        remove.className = 'remove-btn';
                        remove.name = 'x-lg';
                        remove.addEventListener('click', (e) => {
                            e.stopPropagation();
                            removePlayerFromNode(node, name);
                            saveState();
                            render();
                            renderDialog();
                        });
                        row.appendChild(remove);
                    }
                    body.appendChild(row);
                });
                card.append(head, body);

                // 管理员拖放支持
                if (isAdmin) {
                    card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drag-over'); });
                    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
                    card.addEventListener('drop', (e) => {
                        e.preventDefault();
                        card.classList.remove('drag-over');
                        const name = e.dataTransfer.getData('text/plain');
                        if (name && movePlayerToGroup(node, name, index)) {
                            saveState();
                            render();
                            renderDialog();
                        }
                    });
                    body.querySelectorAll('.group-player').forEach((row) => {
                        row.addEventListener('dragstart', (e) => {
                            e.dataTransfer.setData('text/plain', row.dataset.playerName);
                            e.dataTransfer.effectAllowed = 'move';
                        });
                    });
                }

                dialogGroups.appendChild(card);
            });

            renderRegisterRow(node);

            dialogAdminPanel.classList.toggle('d-none', !isAdmin);
            if (isAdmin) {
                nodeNameInput.value = node.name;
                nodeMaxInput.value = node.maxPlayers;
                nodeGroupInput.value = node.groupCount;
                deleteNodeButton.classList.toggle('d-none', Boolean(node.main));
            }
        };

        const openNode = (id) => {
            activeNodeId = id;
            renderDialog();
            dialog.show();
        };

        joinButton.addEventListener('click', () => {
            const node = findNode(activeNodeId);
            if (!node) return;
            const name = userInfo && userInfo.name ? userInfo.name : null;
            if (!name || findRegistration(name)) return;
            if (assignRandomGroup(node, name)) {
                saveState();
                render();
                renderDialog();
            }
        });

        saveNodeButton.addEventListener('click', () => {
            const node = findNode(activeNodeId);
            if (!node || !isAdmin) return;
            const name = nodeNameInput.value.trim();
            if (name) node.name = name;
            const newMax = Math.max(1, Math.min(64, Number(nodeMaxInput.value) || node.maxPlayers));
            const newCount = Math.max(1, Math.min(32, Number(nodeGroupInput.value) || node.groupCount));

            // 如果组数变了，重建 groups
            if (newCount !== node.groupCount) {
                node.groupCount = newCount;
                node.groups = Array.from({ length: newCount }, () => []);
                // 重新分配玩家到各组
                node.players.forEach((p, i) => {
                    node.groups[i % newCount].push(p);
                });
            }

            // 如果总容量缩小，从后往前移除多余玩家
            if (newMax < node.maxPlayers && node.players.length > newMax) {
                const toRemove = node.players.slice(newMax);
                toRemove.forEach((p) => {
                    node.groups.forEach((g) => {
                        const idx = g.indexOf(p);
                        if (idx >= 0) g.splice(idx, 1);
                    });
                });
                node.players = node.players.slice(0, newMax);
            }
            node.maxPlayers = newMax;

            saveState();
            render();
            renderDialog();
        });

        deleteNodeButton.addEventListener('click', () => {
            const node = findNode(activeNodeId);
            if (!node || node.main || !isAdmin) return;
            deleteNode(node.id);
            dialog.hide();
        });

        const apply_admin_ui = () => {
            document.getElementById('admin_badge').classList.toggle('d-none', !isAdmin);
            renderNodes();
            if (dialog.open) renderDialog();
        };

        window.addEventListener('load', async () => {
            render();
            applyZoom();
            await verify_admin();
            apply_admin_ui();
        });
    </script>
</body>

</html>
