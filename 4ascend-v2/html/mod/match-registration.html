    <style>
        .loading-a {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 1);
            transition: all 0.4s ease;
        }

        .loading-p {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: loading-spin 1s linear infinite;
        }

        .loading-t {
            margin-top: 15px;
            font-family: sans-serif;
            color: #666;
            font-size: 14px;
        }

        @keyframes loading-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .category-title {
            font-size: 1.1rem;
            color: var(--sl-color-neutral-600);
            border-left: 4px solid var(--sl-color-primary-500);
            padding-left: 8px;
            margin-bottom: 0.5rem;
        }

        /* 节点地图画布 */
        .bracket-canvas {
            position: relative;
            min-height: 420px;
            overflow: auto;
            border: 1px solid rgba(13, 110, 253, 0.14);
            border-radius: 0.85rem;
            background-color: #fff;
            background-image: radial-gradient(rgba(13, 110, 253, 0.08) 1px, transparent 1px);
            background-size: 18px 18px;
        }

        .bracket-edges {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* 方块节点：长方形、蓝色边框、白色内部 */
        .bracket-node {
            position: absolute;
            width: 240px;
            background: #ffffff;
            border: 1.5px solid rgba(13, 110, 253, 0.5);
            border-radius: 0.5rem;
            box-shadow: 0 0.25rem 0.9rem rgba(13, 110, 253, 0.08);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .bracket-node:hover,
        .bracket-node:focus-visible {
            border-color: rgba(13, 110, 253, 0.85);
            box-shadow: 0 0.4rem 1.2rem rgba(13, 110, 253, 0.16);
            transform: translateY(-2px);
            outline: none;
        }

        .bracket-node-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            padding: 0.55rem 0.75rem;
            border-bottom: 1px solid rgba(13, 110, 253, 0.16);
        }

        .bracket-node-name {
            font-weight: 700;
            font-size: 0.92rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bracket-node-body {
            padding: 0.55rem 0.75rem 0.65rem;
        }

        .bracket-node-count {
            font-size: 0.8rem;
            color: var(--sl-color-neutral-500);
        }

        .bracket-node-players {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-top: 0.45rem;
        }

        .bracket-node-chip {
            max-width: 100%;
            padding: 0.1rem 0.5rem;
            border: 1px solid var(--sl-color-neutral-200);
            border-radius: 999px;
            background: var(--sl-color-neutral-50);
            font-size: 0.74rem;
            color: var(--sl-color-neutral-700);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .bracket-node-chip.more {
            border-style: dashed;
            color: var(--sl-color-neutral-500);
        }

        .player-row {
            border: 1px solid var(--sl-color-neutral-200);
            border-radius: 0.7rem;
            background: #fff;
        }

        .player-avatar {
            width: 2rem;
            height: 2rem;
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--sl-color-primary-700);
            background: var(--sl-color-primary-100);
        }

        .admin-panel {
            border: 1px solid rgba(255, 193, 7, 0.35);
            background: rgba(255, 193, 7, 0.08);
            border-radius: 0.7rem;
        }

        .sticky-actions {
            position: sticky;
            bottom: 0;
            z-index: 5;
            background: rgba(248, 249, 250, 0.94);
            backdrop-filter: blur(8px);
        }
    </style>

    <div id='loading' class='loading-a'>
        <div class='loading-p'></div>
        <p class='loading-t'>正在初始化...</p>
    </div>

    <script>
        (async () => {
            const icons = Array.from(document.querySelectorAll('sl-icon'));
            const st = Date.now();
            await Promise.allSettled([
                customElements.whenDefined('sl-button'),
                customElements.whenDefined('sl-icon'),
                customElements.whenDefined('sl-input'),
                customElements.whenDefined('sl-badge'),
                customElements.whenDefined('sl-dialog'),
            ]);
            if (document.readyState === 'loading') await new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve, { 'once': true }));
            await Promise.allSettled(icons.map((icon) => new Promise((resolve) => {
                if (icon.hasAttribute('library')) resolve();
                icon.addEventListener('sl-load', () => requestAnimationFrame(() => requestAnimationFrame(resolve)), { 'once': true });
            })));
            await new Promise((resolve) => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { 'once': true });
            });
            setTimeout(() => {
                window.loaded = true;
                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                    setTimeout(() => loader.remove(), 400);
                }
            }, Math.max(0, 300 - (Date.now() - st)));
        })();
    </script>
</head>

<body class='d-flex flex-column w-100 h-100 bg-light'>
    <div id='button_music_wrap' class='position-fixed top-0 start-0 d-flex p-2' style='z-index: 1050;'>
        <sl-button id='button_music_toggle' variant='default' circle title='单击切换下一首；1 秒内双击开始/停止播放' aria-label='单击切换下一首；1 秒内双击开始/停止播放'>
            <sl-icon id='icon_music_toggle' name='volume-up'></sl-icon>
        </sl-button>
    </div>

    <div class='d-flex flex-column w-100 h-100'>
        <header></header>

        <main class='container py-4 flex-grow-1 overflow-auto' style='max-width: 960px;'>
            <header class='text-center'>
                <sl-icon name='diagram-3' style='font-size: 3.5rem; color: var(--sl-color-primary-600);'></sl-icon>
                <h1 class='display-5 fw-bold mt-2 mb-1' style='letter-spacing: -1px;'>赛事报名和抽签</h1>
                <p class='text-secondary'>点击方块报名 · 抽签结果同步显示</p>
            </header>

            <div class='d-flex flex-column gap-4 px-2'>
                <section>
                    <div class='category-title fw-bold'>赛事信息</div>
                    <div class='card shadow-sm'>
                        <div class='card-body p-3'>
                            <div class='d-flex align-items-start justify-content-between gap-3'>
                                <div>
                                    <div class='fw-bold'>四子棋春季公开赛</div>
                                    <div class='text-secondary small mt-1'>点击流程图中的方块进入报名，报名结束后由管理员发起抽签。</div>
                                </div>
                                <sl-badge id='summary_status' variant='success' pill>报名中</sl-badge>
                            </div>
                            <div class='row g-2 mt-2 text-secondary small'>
                                <div class='col-6'><sl-icon name='people' class='me-1'></sl-icon><span id='summary_players'>0 / 8 人</span></div>
                                <div class='col-6'><sl-icon name='diagram-3' class='me-1'></sl-icon><span id='summary_nodes'>1 个方块</span></div>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <div class='d-flex align-items-center justify-content-between gap-2'>
                        <div>
                            <div class='category-title fw-bold mb-0'>抽签流程图</div>
                            <div class='text-secondary small mt-1'>点击方块查看名单并报名</div>
                        </div>
                        <sl-badge id='admin_badge' class='d-none' variant='warning' pill>管理员模式</sl-badge>
                    </div>
                    <div id='bracket_canvas' class='bracket-canvas shadow-sm mt-2'>
                        <svg id='bracket_edges' class='bracket-edges'></svg>
                    </div>
                </section>
            </div>
        </main>

        <div class='sticky-actions px-3 pb-2'>
            <div class='container d-flex flex-column flex-sm-row justify-content-center gap-2' style='max-width: 960px;'>
                <sl-button id='button_add_node' class='d-none' variant='warning' size='large' pill outline>
                    <sl-icon slot='prefix' name='plus-square'></sl-icon>添加分支方块
                </sl-button>
                <sl-button id='button_back' variant='default' size='large' pill href='/pages/mod/match.html'>返回赛事大厅</sl-button>
            </div>
        </div>

        <footer class='text-center text-muted py-1' style='font-size: 0.74rem;'>
            <a href='/' class='text-decoration-none text-secondary'>返回功能选择</a>
        </footer>
    </div>

    <sl-dialog id='dialog_node' label='方块详情'>
        <div class='d-flex flex-column gap-3'>
            <div class='d-flex align-items-center justify-content-between gap-2'>
                <div class='text-secondary small'>报名名单</div>
                <sl-badge id='dialog_node_status' variant='success' pill>报名中</sl-badge>
            </div>

            <div id='dialog_node_players' class='d-flex flex-column gap-2'></div>

            <div id='dialog_register_row' class='d-flex flex-column gap-2'>
                <div class='d-flex flex-row align-items-end gap-2'>
                    <sl-input id='input_player_name' class='flex-grow-1' label='参赛昵称' placeholder='请输入昵称（演示用）' clearable></sl-input>
                    <sl-button id='button_join' variant='primary'>报名</sl-button>
                </div>
                <div class='text-secondary small'>符合条件即可参与抽签：昵称不重复，且方块未满员。</div>
            </div>

            <div id='dialog_admin_panel' class='admin-panel d-none p-3'>
                <div class='d-flex align-items-center gap-2 mb-2'>
                    <sl-icon name='shield-lock' class='text-warning'></sl-icon>
                    <div class='fw-bold'>管理员设置</div>
                </div>
                <div class='d-flex flex-column gap-2'>
                    <sl-input id='input_node_name' label='方块名称' placeholder='请输入方块名称'></sl-input>
                    <sl-input id='input_node_capacity' type='number' label='可容纳人数' min='2' max='64' step='1'></sl-input>
                    <div class='d-flex flex-row gap-2'>
                        <sl-button id='button_save_node' class='flex-grow-1' variant='warning' outline>保存设置</sl-button>
                        <sl-button id='button_draw_node' class='flex-grow-1' variant='primary'>
                            <sl-icon slot='prefix' name='shuffle'></sl-icon>随机抽签
                        </sl-button>
                    </div>
                </div>
            </div>
        </div>

        <div slot='footer' class='gap-2'>
            <sl-button onclick='this.closest("sl-dialog").hide();' variant='neutral'>关闭</sl-button>
        </div>
    </sl-dialog>

    <script>
        // 管理员身份检验：登录 token + 服务端权限等级（等级 4 = 管理员）
        let isAdmin = false;
        let userInfo = null;

        const verify_admin = async () => {
            const token = window.get_token();
            if (!token) return;
            try {
                userInfo = await window.http_user_info(token);
                isAdmin = Number(userInfo && userInfo.level) === 4;
            } catch (_) {
                isAdmin = false;
            }
        };

        const STORAGE_KEY = 'match_bracket_state_v1';
        const NODE_WIDTH = 240;

        // 节点地图数据模型：nodes 存方块，edges 存连接（为后续添加分支/连接预留）
        const defaultState = () => ({
            nodes: [
                { id: 'node_1', name: '主赛事（第1次抽签）', capacity: 8, players: [], drawn: false, x: 0, y: 0 }
            ],
            edges: []
        });

        let state;
        try {
            const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            state = saved && Array.isArray(saved.nodes) && saved.nodes.length ? saved : defaultState();
        } catch (_) {
            state = defaultState();
        }

        const saveState = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

        const canvas = document.getElementById('bracket_canvas');
        const edgesSvg = document.getElementById('bracket_edges');
        const dialog = document.getElementById('dialog_node');
        const dialogStatus = document.getElementById('dialog_node_status');
        const dialogPlayers = document.getElementById('dialog_node_players');
        const dialogRegisterRow = document.getElementById('dialog_register_row');
        const dialogAdminPanel = document.getElementById('dialog_admin_panel');
        const playerNameInput = document.getElementById('input_player_name');
        const joinButton = document.getElementById('button_join');
        const nodeNameInput = document.getElementById('input_node_name');
        const nodeCapacityInput = document.getElementById('input_node_capacity');
        const saveNodeButton = document.getElementById('button_save_node');
        const drawNodeButton = document.getElementById('button_draw_node');
        const addNodeButton = document.getElementById('button_add_node');
        const summaryPlayers = document.getElementById('summary_players');
        const summaryNodes = document.getElementById('summary_nodes');
        const summaryStatus = document.getElementById('summary_status');

        let activeNodeId = null;

        const nodeStatus = (node) => {
            if (node.drawn) return { text: '已抽签', variant: 'primary' };
            if (node.players.length >= node.capacity) return { text: '已满员', variant: 'danger' };
            return { text: '报名中', variant: 'success' };
        };

        // 自动布局：目前只有首个方块，居中放置；后续多分支时按层级排布
        const layout = () => {
            const rect = canvas.getBoundingClientRect();
            state.nodes.forEach((node) => {
                node.x = Math.max(24, (Math.max(rect.width, 600) - NODE_WIDTH) / 2);
                node.y = Math.max(24, (420 - 150) / 2);
            });
        };

        const renderSummary = () => {
            const total = state.nodes.reduce((sum, node) => sum + node.players.length, 0);
            const capacity = state.nodes.reduce((sum, node) => sum + node.capacity, 0);
            summaryPlayers.textContent = `${total} / ${capacity} 人`;
            summaryNodes.textContent = `${state.nodes.length} 个方块`;
            const allDrawn = state.nodes.every((node) => node.drawn);
            summaryStatus.textContent = allDrawn ? '已抽签' : '报名中';
            summaryStatus.variant = allDrawn ? 'primary' : 'success';
        };

        const renderEdges = () => {
            edgesSvg.innerHTML = '';
            state.edges.forEach((edge) => {
                const from = state.nodes.find((node) => node.id === edge.from);
                const to = state.nodes.find((node) => node.id === edge.to);
                if (!from || !to) return;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const x1 = from.x + NODE_WIDTH, y1 = from.y + 60;
                const x2 = to.x, y2 = to.y + 60;
                line.setAttribute('d', `M ${x1} ${y1} C ${x1 + 48} ${y1}, ${x2 - 48} ${y2}, ${x2} ${y2}`);
                line.setAttribute('stroke', 'rgba(13, 110, 253, 0.45)');
                line.setAttribute('stroke-width', '1.5');
                line.setAttribute('fill', 'none');
                edgesSvg.appendChild(line);
            });
        };

        const renderNodes = () => {
            canvas.querySelectorAll('.bracket-node').forEach((el) => el.remove());
            state.nodes.forEach((node) => {
                const status = nodeStatus(node);
                const el = document.createElement('div');
                el.className = 'bracket-node';
                el.style.left = `${node.x}px`;
                el.style.top = `${node.y}px`;
                el.setAttribute('role', 'button');
                el.setAttribute('tabindex', '0');
                el.dataset.nodeId = node.id;

                const chips = node.players.slice(0, 6).map((name, index) =>
                    `<span class='bracket-node-chip'>${node.drawn ? `${index + 1}. ` : ''}${name}</span>`
                ).join('');
                const more = node.players.length > 6
                    ? `<span class='bracket-node-chip more'>+${node.players.length - 6}</span>` : '';
                const empty = node.players.length ? '' : `<span class='bracket-node-chip more'>虚位以待</span>`;

                el.innerHTML = `
                    <div class='bracket-node-head'>
                        <span class='bracket-node-name'>${node.name}</span>
                        <sl-badge variant='${status.variant}' pill>${status.text}</sl-badge>
                    </div>
                    <div class='bracket-node-body'>
                        <div class='bracket-node-count'>已报名 ${node.players.length} / ${node.capacity} 人</div>
                        <div class='bracket-node-players'>${chips}${more}${empty}</div>
                    </div>
                `;

                el.addEventListener('click', () => openNode(node.id));
                el.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openNode(node.id); }
                });
                canvas.appendChild(el);
            });
        };

        const render = () => {
            layout();
            renderSummary();
            renderEdges();
            renderNodes();
        };

        const renderDialog = () => {
            const node = state.nodes.find((item) => item.id === activeNodeId);
            if (!node) return;

            const status = nodeStatus(node);
            dialog.label = node.name;
            dialogStatus.textContent = status.text;
            dialogStatus.variant = status.variant;

            dialogPlayers.innerHTML = '';
            if (!node.players.length) {
                const empty = document.createElement('div');
                empty.className = 'text-secondary small text-center py-3';
                empty.textContent = '还没有人报名，来抢第一个位置吧。';
                dialogPlayers.appendChild(empty);
            }
            node.players.forEach((name, index) => {
                const row = document.createElement('div');
                row.className = 'player-row d-flex align-items-center gap-2 px-2 py-2';
                row.innerHTML = `
                    <span class='player-avatar'><sl-icon name='person-fill'></sl-icon></span>
                    <span class='text-truncate flex-grow-1'></span>
                    ${node.drawn ? `<sl-badge variant='primary' pill>签位 ${index + 1}</sl-badge>` : ''}
                `;
                row.querySelector('.text-truncate').textContent = name;
                dialogPlayers.appendChild(row);
            });

            const canRegister = !node.drawn && node.players.length < node.capacity;
            dialogRegisterRow.classList.toggle('d-none', !canRegister);

            dialogAdminPanel.classList.toggle('d-none', !isAdmin);
            if (isAdmin) {
                nodeNameInput.value = node.name;
                nodeCapacityInput.value = node.capacity;
                drawNodeButton.disabled = node.players.length < 2;
            }
        };

        const openNode = (id) => {
            activeNodeId = id;
            renderDialog();
            dialog.show();
        };

        joinButton.addEventListener('click', () => {
            const node = state.nodes.find((item) => item.id === activeNodeId);
            if (!node) return;
            const name = playerNameInput.value.trim();
            if (!name) return playerNameInput.focus();
            if (node.drawn || node.players.length >= node.capacity || node.players.includes(name)) return;
            node.players.push(name);
            playerNameInput.value = '';
            saveState();
            render();
            renderDialog();
        });

        playerNameInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') joinButton.click();
        });

        saveNodeButton.addEventListener('click', () => {
            const node = state.nodes.find((item) => item.id === activeNodeId);
            if (!node || !isAdmin) return;
            const name = nodeNameInput.value.trim();
            if (name) node.name = name;
            node.capacity = Math.max(2, Math.min(64, Number(nodeCapacityInput.value) || node.capacity));
            node.players = node.players.slice(0, node.capacity);
            saveState();
            render();
            renderDialog();
        });

        drawNodeButton.addEventListener('click', () => {
            const node = state.nodes.find((item) => item.id === activeNodeId);
            if (!node || !isAdmin || node.players.length < 2) return;
            node.players = [...node.players].sort(() => Math.random() - 0.5);
            node.drawn = true;
            saveState();
            render();
            renderDialog();
        });

        // 管理员 UI 统一入口：鉴权结果到达后再显示管理功能
        const apply_admin_ui = () => {
            document.getElementById('admin_badge').classList.toggle('d-none', !isAdmin);
            addNodeButton.classList.toggle('d-none', !isAdmin);
            if (dialog.open) renderDialog();
        };

        // 添加分支方块：与当前方块连接（管理员功能，节点地图扩展入口）
        addNodeButton.addEventListener('click', () => {
            if (!isAdmin) return;
            const id = `node_${Date.now()}`;
            const last = state.nodes[state.nodes.length - 1];
            state.nodes.push({ id, name: `分支方块 ${state.nodes.length}`, capacity: 8, players: [], drawn: false, x: last.x + 320, y: last.y });
            state.edges.push({ from: last.id, to: id });
            saveState();
            render();
        });

        window.addEventListener('load', async () => {
            render();
            await verify_admin();
            apply_admin_ui();
        });
        window.addEventListener('resize', render);
    </script>
</body>

</html>
