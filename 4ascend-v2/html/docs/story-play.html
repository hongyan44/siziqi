<!DOCTYPE html>
<html lang='zh-CN'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>
    <!-- 申请退出浏览器自动深色（Force Dark）：否则 vivo 等浏览器夜间模式会把页面反色，白底表情图会被渲染成负片 -->
    <meta name='color-scheme' content='only light'>

    <style>
        .story-main { max-width: 1180px; }
        .story-board-wrap { width: min(94vw, 680px); aspect-ratio: 1; background: #fff; border: 1px solid rgba(0, 0, 0, .08); border-radius: .75rem; overflow: hidden; }
        .story-board { position: relative; width: 100%; height: 100%; }
        .story-board canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        #canvas_board { position: absolute; z-index: 1; touch-action: none; cursor: crosshair; }
        .story-board canvas:not(#canvas_board) { z-index: 2; }
        .story-board canvas { pointer-events: none; }
        .story-board #canvas_board { pointer-events: auto; }
        #canvas_annot { position: fixed; inset: 0; z-index: 1096; pointer-events: none; }
        .dialogue-dim { position: fixed; inset: 0; z-index: 1040; pointer-events: none; opacity: 1; transition: opacity .3s ease; }
        .dialogue-dim.is-hidden { opacity: 0; }
        .mark-layer { position: fixed; inset: 0; z-index: 1095; pointer-events: none; overflow: hidden; }
        .mark-arrow { position: absolute; width: 36px; height: 36px; will-change: transform; }
        .mark-arrow > svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .45)); animation: mark-bounce .9s ease-in-out infinite; }
        .mark-arrow--up { transform: rotate(0deg); }
        .mark-arrow--down { transform: rotate(180deg); }
        .mark-arrow--left { transform: rotate(-90deg); }
        .mark-arrow--right { transform: rotate(90deg); }
        @keyframes mark-bounce { 0%, 100% { transform: translateY(-5px); } 50% { transform: translateY(5px); } }
        .story-top-panel { width: min(94vw, 680px); }
        .story-board-wrap { box-shadow: 0 0 0 2px rgba(52, 152, 219, .08), 0 12px 28px rgba(0, 0, 0, .12); }
        .story-board-wrap.is-dialogue { pointer-events: none; }
        /* 剧情推进时棋盘不接收点击，保证点击棋盘空白处能触发对话框收起/弹出 */
        .story-board-wrap.is-dialogue #canvas_board { pointer-events: none; }
        #game_p1_name, #game_p1_hp, #game_p2_name, #game_p2_hp { transition: color .5s ease; }
        /* 对话框高度固定为半屏；表情框尺寸由脚本按对话框高度的 2/5 计算（1:1.5），靠左并上下居中，此处为兜底值 */
        .dialogue-panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1100; height: 50vh; box-sizing: border-box; padding: .75rem; transition: transform .36s cubic-bezier(.4, 0, .2, 1), opacity .3s ease; will-change: transform, opacity; }
        /* 对局/结束时收起与玩家点击空白处临时收起共用同一套底部滑出动效 */
        .dialogue-panel.is-hidden, .dialogue-panel.is-collapsed { transform: translateY(130%); opacity: 0; pointer-events: none; }
        /* 重新弹出时带轻微回弹，模拟对话框从底部弹起 */
        .dialogue-panel.is-popping { transition-timing-function: cubic-bezier(.34, 1.4, .64, 1); }
        .dialogue-inner { height: 100%; box-sizing: border-box; max-width: 900px; margin-inline: auto; background: rgba(23, 26, 33, var(--dialogue-alpha, .6)); color: #f5f6f8; border-radius: .8rem; box-shadow: 0 -6px 26px rgba(0, 0, 0, .35); padding: 1rem 1.1rem 1.1rem; cursor: pointer; display: flex; align-items: center; gap: 1rem; }
        .met-cursor-pointer .dialogue-inner { cursor: pointer; }
        .dialogue-face { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem; }
        .dialogue-face-frame { position: relative; flex: 0 0 auto; width: 120px; height: 180px; display: flex; align-items: center; justify-content: center; border: 2px solid #000; border-radius: .4rem; background: #0b0d11; overflow: hidden; }
        .dialogue-face-frame img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
        /* 兜底：表情框声明只支持浅色并禁止强制配色，避免浏览器自动深色把表情图渲染成负片 */
        .dialogue-face-frame { color-scheme: only light; }
        .dialogue-face-frame img { forced-color-adjust: none; }
        .dialogue-face-frame sl-icon { font-size: 1.6rem; color: #57616e; }
        .dialogue-speaker { font-weight: 700; font-size: .95rem; line-height: 1.25; color: #8fd0ff; text-align: center; max-width: 100%; word-break: break-all; }
        .dialogue-body { flex: 1 1 auto; min-width: 0; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; justify-content: safe center; }
        .dialogue-text { font-size: clamp(1rem, 2.4vw, 1.18rem); line-height: 1.85; min-height: 4.2em; white-space: pre-wrap; }
        .dialogue-options { display: flex; flex-direction: column; gap: .5rem; margin-top: .85rem; }
        .dialogue-option { text-align: left; border: 1px solid rgba(143, 208, 255, .5); background: rgba(52, 152, 219, .16); color: #eaf6ff; border-radius: .5rem; padding: .55rem .8rem; font-size: 1rem; transition: background .15s ease, border-color .15s ease; }
        .dialogue-option:hover { background: rgba(52, 152, 219, .34); border-color: #8fd0ff; }
        .dialogue-next { text-align: right; font-size: .82rem; color: #9fb0c0; margin-top: .5rem; animation: dialogue-blink 1.4s ease-in-out infinite; }
        @keyframes dialogue-blink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
        @media (prefers-reduced-motion: reduce) {
            .dialogue-panel, .dialogue-dim { transition: none; }
        }
        .ending-panel { position: fixed; inset: 0; z-index: 1200; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(12, 14, 18, .9); color: #fff; gap: 1rem; }
        .ending-title { font-size: 2.6rem; font-weight: 800; letter-spacing: .3em; }
        .story-subtitle { font-size: .82rem; }
        .story-plant-hint { font-size: .74rem; color: var(--sl-color-neutral-500); }
        @media (max-width: 991.98px) { .story-board-wrap, .story-top-panel { width: min(94vw, 620px); } }
    </style>
</head>
<body class='d-flex flex-column w-100 h-100 bg-light'>
    <div id='button_home' class='position-fixed top-0 start-0 d-flex gap-1 p-2 met-cursor-pointer' style='z-index: 1050;'>

        </header>
        <main class='container story-main flex-grow-1 overflow-auto pb-3'>
            <div id='game_top_card' class='story-top-panel d-flex flex-column gap-2 justify-content-center align-items-center mx-auto mb-3'>

                    <div id='game_p1_card' class='card card-bg py-2 px-1 rounded-2 w-50 turn-init'>
                        <span class='d-flex align-items-center justify-content-around'>

                        </span>
                    </div>
                    <div id='game_p2_card' class='card card-bg py-2 px-1 rounded-2 w-50 turn-init'>
                        <span class='d-flex align-items-center justify-content-around'>

                    <div id='game_p1_info' class='card card-bg py-2 px-1 rounded-2 w-50 turn-init'>

                        <span class='d-flex align-items-center justify-content-around'>
                            <span id='game_p2_hp' class='d-flex align-items-center hp-color-p2'>HP: 6/6</span>
                            <span id='game_p2_ascend' class='d-flex align-items-center text-color'>PR：0+0</span>
                        </span>

                <div class='d-flex flex-row gap-1 w-100'>
                    <div class='card card-bg py-1 rounded-2 w-100'>
                        <span class='d-flex align-items-center justify-content-around'>
                            <div id='game_info_turn'>0 Turns</div>

    <canvas id='dialogue_dim' class='dialogue-dim is-hidden' aria-hidden='true'></canvas>

    <div id='dialogue' class='dialogue-panel is-hidden'>

            <div id='dialogue_face' class='dialogue-face'>

            </div>
            <div class='dialogue-body'>
                <div id='dialogue_text' class='dialogue-text'></div>

    <div id='ending' class='ending-panel d-none'>
        <sl-icon name='journals' style='font-size: 3.6rem; color: #8fd0ff;'></sl-icon>
        <div class='ending-title'>剧 终</div>
        <div class='text-secondary' id='ending_tip'>本段剧情已结束。</div>
        <sl-button variant='primary' href='/pages/docs/story.html'><sl-icon slot='prefix' name='arrow-left'></sl-icon>返回关卡列表</sl-button>
    </div>

    <script>
        const params = new URLSearchParams(location.search);
        const targetLevel = Math.max(1, Number.parseInt(params.get('level') || '1', 10) || 1);
        const boardCanvas = document.getElementById('canvas_board');
        const { GameStory, Board, State, RulesRuntime, PLAYER_ENUM, STONE_ENUM, PLANT_ENUM, ASCEND_ENUM, OVER_ENUM, RandAIC, RandUnity } = window.FAscendExports;
        const { StoryScript, StoryRuntime } = window.StoryExports;
        const GameCanvas = window.GameExports.Canvas;
        // 剧情对局使用纯 4zero MCTS（150 次模拟），不套用残局战术矫正。
        const STORY_SIMULATIONS = 150;
        // 剧情防误触等级（0 单次确认 / 1 仅「打」双击 / 2 全部双击），由剧情列表页写入。
        const STORY_SETTINGS_KEY = 'four-ascend-story-settings-v1';
        const clickLevel = (() => {
            try {
                const saved = JSON.parse(localStorage.getItem(STORY_SETTINGS_KEY) || '{}') || {};
                const level = Number(saved.click_level);
                return level === 0 || level === 1 || level === 2 ? level : 2;
            } catch (_) { return 2; }
        })();

        const $ = (id) => document.getElementById(id);
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        const indexOf = (x, y) => y * 9 + x;

        // 按剧情内的「对话框不透明度=xx」设置对话框背景透明度，默认 60%
        const applyDialogueOpacity = (parsed) => {
            const findSetting = (nodes) => {
                for (const node of nodes || []) {
                    if (node.type === 'setting' && node.key === 'opacity') return node;
                    if (node.type === 'choice') {
                        for (const option of node.options || []) {
                            const found = findSetting(option.body_nodes);
                            if (found) return found;
                        }
                    }
                }
                return null;
            };
            const setting = findSetting(parsed && parsed.nodes ? parsed.nodes : []);
            const number = setting ? Number(setting.value) : 60;
            const value = Number.isFinite(number) ? Math.max(0, Math.min(100, Math.round(number))) : 60;
            const inner = $('dialogue_inner');
            if (inner) inner.style.setProperty('--dialogue-alpha', String(value / 100));
        };

        let runtime = null;
        let playerName = '你';
        let mode = 'dialogue';
        let game = null, state = null, ui = null, sound = null, aiWorker = null, aiWorkerThread = null;
        let aiReady = false;
        let branch = null;
        let bookedWhite = null;
        // 残局码里的 AI 预设：作者定义的无条件落子队列，优先级高于正着应手与 MCTS
        let aiPreset = null;
        // AI 执黑时，作者定义的黑方正着同样作为 AI 的无条件预设队列
        let bookPreset = null;
        let moves = [];
        let endLimit = 0;
        // 结束对局=步数:0：不要求落子，点击屏幕即可结束本局
        let endByClick = false;
        // 步数对话：支持 步数 / 位置落子 / 拿起棋子 / AI拿起棋子 四类触发，按条目索引去重，每条只触发一次
        let triggeredEvents = new Set();
        // 本次落子是否形成了「打」（ASCEND），用于区分「拿起棋子」与「AI拿起棋子」
        let lastMovePicked = false;
        let gameNodeIndex = 0;
        let pendingResume = null;
        let pendingConfirm = null;
        let running = false;
        let gameOver = false;
        let gameGeneration = 0;
        let settlementDamage = [0, 0];
        let selfPlayer = PLAYER_ENUM.BLACK;
        let aiPlayer = PLAYER_ENUM.WHITE;
        let importedArchive = false;
        let currentConfig = null;
        let hpMax = { black: 6, white: 6 };
        let pendingAscend = [[], []];
        let typingTimer = null, typingChars = [], typingIndex = 0;

        const setStatus = (message, variant = 'primary') => { const node = $('story_status'); node.className = `text-center small mt-2 text-${variant === 'primary' ? 'secondary' : variant}`; node.textContent = message; };
        const showAlertText = (message) => { $('game_msg').textContent = message; };

        // ==================== 剧本引擎 ====================
        const dialoguePanel = $('dialogue');
        const dialogueDim = $('dialogue_dim');
        const boardWrap = $('board_wrap');
        // dialogueActive：当前是否处于剧情推进（对局时关闭）；dialogueCollapsed：玩家点击对话框外临时收起
        let dialogueActive = false;
        let dialogueCollapsed = false;
        let dialoguePopTimer = 0;

        // 弹出时临时切换为回弹曲线，动画结束后恢复常速
        const popDialogue = () => {
            dialoguePanel.classList.add('is-popping');
            clearTimeout(dialoguePopTimer);
            dialoguePopTimer = setTimeout(() => dialoguePanel.classList.remove('is-popping'), 460);
        };

        const applyDialogueVisible = (showPop) => {
            const shown = dialogueActive && !dialogueCollapsed;
            dialoguePanel.classList.toggle('is-hidden', !dialogueActive);
            dialoguePanel.classList.toggle('is-collapsed', dialogueActive && dialogueCollapsed);
            dialoguePanel.setAttribute('aria-hidden', String(!shown));
            dialogueDim.classList.toggle('is-hidden', !shown);
            boardWrap.classList.toggle('is-dialogue', dialogueActive);
            if (!shown) return;
            drawDim();
            if (showPop) popDialogue();
        };

        const setDialogueVisible = (visible) => {
            dialogueActive = Boolean(visible);
            if (!dialogueActive) dialogueCollapsed = false;
            applyDialogueVisible(true);
        };

        // 点击对话框外：收起；再次点击任意位置：从底部弹出。仅临时隐藏，不改变当前节点与打字进度。
        const setDialogueCollapsed = (collapsed) => {
            if (!dialogueActive) return;
            const next = Boolean(collapsed);
            if (next === dialogueCollapsed) return;
            dialogueCollapsed = next;
            if (next) clearTimeout(dialoguePopTimer);
            applyDialogueVisible(!next);
        };

        const finishTyping = () => {
            if (!typingTimer) return false;
            clearInterval(typingTimer); typingTimer = null;
            typingIndex = typingChars.length;
            $('dialogue_text').textContent = typingChars.join('');
            $('dialogue_next').classList.remove('d-none');
            return true;
        };
        const typeText = (text) => {
            if (typingTimer) clearInterval(typingTimer);
            typingChars = Array.from(String(text == null ? '' : text));
            typingIndex = 0;
            $('dialogue_text').textContent = '';
            $('dialogue_next').classList.add('d-none');
            typingTimer = setInterval(() => {
                typingIndex++;
                $('dialogue_text').textContent = typingChars.slice(0, typingIndex).join('');
                if (typingIndex >= typingChars.length) { clearInterval(typingTimer); typingTimer = null; $('dialogue_next').classList.remove('d-none'); }
            }, 22);
        };
        const applyPlaceholders = (text) => String(text == null ? '' : text).split('<玩家名称>').join(playerName);

        // ==================== 角色表情框（对话框最左侧，高度为对话框的 2/5，1:1.5 上下居中） ====================
        const characterIndex = new Map();
        const faceFrame = $('dialogue_face_frame');
        const FACE_RATIO = 1.5;              // 宽:高 = 1:1.5
        const FACE_HEIGHT_RATIO = 0.4;       // 表情框高度 / 对话框高度
        const FACE_MAX_WIDTH = 512;          // 服务端原图上限，再大也无法更清晰
        const FACE_MAX_HEIGHT = 768;
        let faceTarget = { 'w': 0, 'h': 0 }; // 角色框需要的设备像素
        let lastFace = { 'speaker': '', 'expression': '' };
        const faceResolved = new Map();      // 图源缓存：kind:id:表情id:目标尺寸 -> 实际显示图
        const faceOriginals = new Map();     // 原图缓存：kind:id:表情id -> data URL

        // 角色框尺寸随页面变化：高度 = 对话框实际高度的 2/5，宽度按 1:1.5 推导
        const layoutFaceFrame = () => {
            const inner = faceFrame.closest('.dialogue-inner');
            const boxHeight = inner ? inner.clientHeight : Math.round(window.innerHeight * 0.5);
            if (!boxHeight) return false;
            const height = Math.max(60, Math.round(boxHeight * FACE_HEIGHT_RATIO));
            const width = Math.max(40, Math.round(height / FACE_RATIO));
            faceFrame.style.height = `${height}px`;
            faceFrame.style.width = `${width}px`;
            const dpr = Math.min(3, Math.max(1, window.devicePixelRatio || 1));
            faceTarget = {
                'w': Math.min(FACE_MAX_WIDTH, Math.max(1, Math.round((faceFrame.clientWidth || width) * dpr))),
                'h': Math.min(FACE_MAX_HEIGHT, Math.max(1, Math.round((faceFrame.clientHeight || height) * dpr)))
            };
            return true;
        };

        // 只拉取本关剧本用到的角色与表情（管理员上传），建立 角色名 -> {id, 代表图, 表情名->图} 索引
        const loadCharacters = async (faces) => {
            characterIndex.clear();
            if (!faces || !faces.length) return;
            try {
                const data = window.http_story_character_query ? await window.http_story_character_query(faces) : null;
                const list = data && Array.isArray(data.characters) ? data.characters : [];
                list.forEach((item) => {
                    if (!item || !item.name) return;
                    const expressions = new Map();
                    (Array.isArray(item.expressions) ? item.expressions : []).forEach((expression) => {
                        if (expression && expression.name) expressions.set(String(expression.name), { 'id': Number(expression.id) || 0, 'image': String(expression.image || '') });
                    });
                    characterIndex.set(String(item.name), { 'id': Number(item.id) || 0, 'rep': String(item.rep || ''), 'expressions': expressions });
                });
            } catch (error) {
                console.warn('剧情角色数据加载失败，表情框将显示占位图。', error);
            }
        };

        const loadImageSize = (src) => new Promise((resolve) => {
            const image = new Image();
            image.onload = () => resolve({ 'w': image.naturalWidth, 'h': image.naturalHeight });
            image.onerror = () => resolve(null);
            image.src = src;
        });

        // 按角色框实际像素居中裁切并缩放，保证刚好填满且不变形
        const resizeToFrame = (dataUrl, width, height) => new Promise((resolve) => {
            const image = new Image();
            image.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                if (!ctx) { resolve(''); return; }
                const srcRatio = image.naturalWidth / image.naturalHeight;
                const dstRatio = width / height;
                let sx = 0, sy = 0, sw = image.naturalWidth, sh = image.naturalHeight;
                if (srcRatio > dstRatio) { sw = Math.round(sh * dstRatio); sx = Math.round((image.naturalWidth - sw) / 2); }
                else if (srcRatio < dstRatio) { sh = Math.round(sw / dstRatio); sy = Math.round((image.naturalHeight - sh) / 2); }
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(image, sx, sy, sw, sh, 0, 0, width, height);
                const webp = canvas.toDataURL('image/webp', 0.9);
                resolve(webp.startsWith('data:image/webp') ? webp : canvas.toDataURL('image/png'));
            };
            image.onerror = () => resolve('');
            image.src = dataUrl;
        });

        // 取服务端原图并缓存，窗口反复拖动时不重复下载；旧服务端没有该接口时返回空串，回退压缩图
        const fetchFaceOriginal = async (job) => {
            const key = `${job.kind}:${job.charId}:${job.exprId}`;
            if (faceOriginals.has(key)) return faceOriginals.get(key);
            try {
                const result = window.http_story_image_source ? await window.http_story_image_source(job.kind, job.charId, job.exprId) : null;
                const image = result && typeof result.image === 'string' && result.image.startsWith('data:image/') ? result.image : '';
                if (image) faceOriginals.set(key, image);
                return image;
            } catch (_) { return ''; }
        };

        const faceJob = (speaker, expression) => {
            const character = characterIndex.get(String(speaker == null ? '' : speaker));
            if (!character) return null;
            const picked = expression ? character.expressions.get(String(expression)) : null;
            if (picked && picked.image) return { 'thumb': picked.image, 'kind': 'expression', 'charId': character.id, 'exprId': picked.id };
            if (character.rep) return { 'thumb': character.rep, 'kind': 'rep', 'charId': character.id, 'exprId': 0 };
            return null;
        };

        const faceCacheKey = (job) => `${job.kind}:${job.charId}:${job.exprId}:${faceTarget.w}x${faceTarget.h}`;

        const collectFaceJobs = (faces) => {
            const jobs = [];
            (faces || []).forEach((face) => {
                const character = characterIndex.get(String(face.name));
                if (!character) return;
                if (character.rep) jobs.push({ 'thumb': character.rep, 'kind': 'rep', 'charId': character.id, 'exprId': 0 });
                (face.expressions || []).forEach((name) => {
                    const picked = character.expressions.get(String(name));
                    if (picked && picked.image) jobs.push({ 'thumb': picked.image, 'kind': 'expression', 'charId': character.id, 'exprId': picked.id });
                });
            });
            return jobs;
        };

        // 压缩图足够覆盖角色框像素时直接使用；不够时取原图重新压缩到框尺寸
        const prepareFace = async (job) => {
            const key = faceCacheKey(job);
            if (!job.thumb) return;
            faceResolved.set(key, job.thumb);
            if (!faceTarget.w || !faceTarget.h) return;
            const size = await loadImageSize(job.thumb);
            if (!size || (size.w >= faceTarget.w && size.h >= faceTarget.h)) return;
            const original = await fetchFaceOriginal(job);
            if (!original) return;
            const resized = await resizeToFrame(original, faceTarget.w, faceTarget.h);
            if (resized) faceResolved.set(key, resized);
        };

        // 立刻用已缓存的压缩图填充当前框（拖动窗口时先保证有图、不空白）
        const primeFaceThumbs = (faces) => {
            collectFaceJobs(faces).forEach((job) => {
                if (job.thumb) faceResolved.set(faceCacheKey(job), job.thumb);
            });
        };

        // 清掉旧框尺寸的缓存，避免拖动窗口时缓存无限增长
        const pruneFaceCache = () => {
            const suffix = `:${faceTarget.w}x${faceTarget.h}`;
            Array.from(faceResolved.keys()).forEach((key) => {
                if (!key.endsWith(suffix)) faceResolved.delete(key);
            });
        };

        // 进入关卡前取齐并预加载本关用到的角色图；需要原图的先按框尺寸压缩，避免播放时闪烁
        const preloadFaces = async (faces) => {
            layoutFaceFrame();
            await Promise.all(collectFaceJobs(faces).map((job) => prepareFace(job)));
        };

        // 取图：优先命中指定表情，其次回退角色代表图；命中预处理结果时用按框压缩后的图
        const faceImage = (speaker, expression) => {
            const job = faceJob(speaker, expression);
            if (!job) return '';
            return faceResolved.get(faceCacheKey(job)) || job.thumb || '';
        };

        // 刷新表情框：角色名放在表情框下方，无图时回退占位图标
        const renderFace = (speaker, expression) => {
            lastFace = { 'speaker': speaker || '', 'expression': expression || '' };
            $('dialogue_speaker').textContent = speaker || '旁白';
            const image = faceImage(speaker, expression);
            const img = $('dialogue_face_img');
            const holder = $('dialogue_face_holder');
            if (image) {
                if (img.getAttribute('src') !== image) img.src = image;
                img.classList.remove('d-none');
                holder.classList.add('d-none');
            } else {
                img.removeAttribute('src');
                img.classList.add('d-none');
                holder.classList.remove('d-none');
            }
        };

        // ==================== 剧情标注（红色动态箭头 / 旋转虚线圈） ====================
        const MARK_SIZE = 36;
        const MARK_GAP = 6;
        const MARK_DEFAULT_COLOR = '#ff2d2d';
        const MARK_ARROW_SVG = "<svg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><path d='M12 2 L21 13 L14.6 13 L14.6 22 L9.4 22 L9.4 13 L3 13 Z' fill='#ff2d2d' stroke='#ffffff' stroke-width='1.6' stroke-linejoin='round'/></svg>";
        const MARK_ANCHOR_IDS = {
            '名字': ['game_p1_card', 'game_p2_card'],
            '棋子颜色': ['game_p1_stone', 'game_p2_stone'],
            '生命值': ['game_p1_info', 'game_p2_info'],
            '信息': ['game_info_turn', 'game_info_plant_cd', 'game_info_plant_normal', 'game_info_plant_left'],
            '刷草点': ['game_info_plant_left'],
            '棋盘': ['board_wrap'],
        };
        const markLayer = $('mark_layer');
        const annotCanvas = $('canvas_annot');
        let activeArrow = null;
        let activeCircle = null;
        let markArrowNode = null;
        let markFrame = 0;
        let markPhase = 0;

        const sanitizeColor = (value) => {
            const text = String(value == null ? '' : value).trim();
            return /^#[0-9a-fA-F]{3,8}$/.test(text) || /^(rgb|hsl)a?\(/i.test(text) ? text : MARK_DEFAULT_COLOR;
        };

        const anchorRect = (target) => {
            const text = String(target == null ? '' : target).trim();
            let ids = MARK_ANCHOR_IDS[text] || null;
            if (!ids && text === '我方') ids = [selfPlayer === PLAYER_ENUM.BLACK ? 'game_p1_card' : 'game_p2_card'];
            if (!ids && text === '对手') ids = [selfPlayer === PLAYER_ENUM.BLACK ? 'game_p2_card' : 'game_p1_card'];
            if (!ids && text.startsWith('#')) ids = [text.slice(1)];
            if (!ids) return null;
            const nodes = ids.map((id) => $(id)).filter((node) => node && node.getBoundingClientRect);
            if (!nodes.length) return null;
            const rects = nodes.map((node) => node.getBoundingClientRect());
            const left = Math.min(...rects.map((r) => r.left));
            const top = Math.min(...rects.map((r) => r.top));
            const right = Math.max(...rects.map((r) => r.right));
            const bottom = Math.max(...rects.map((r) => r.bottom));
            if (right - left <= 0 || bottom - top <= 0) return null;
            return { 'left': left, 'top': top, 'right': right, 'bottom': bottom, 'width': right - left, 'height': bottom - top };
        };

        const placeArrow = () => {
            if (!activeArrow || !markArrowNode) return;
            const rect = anchorRect(activeArrow.anchor);
            if (!rect) { markArrowNode.style.display = 'none'; return; }
            markArrowNode.style.display = '';
            const vw = window.innerWidth || document.documentElement.clientWidth;
            const vh = window.innerHeight || document.documentElement.clientHeight;
            const reach = MARK_SIZE + MARK_GAP + 4;
            const spaceLeft = rect.left;
            const spaceRight = vw - rect.right;
            let dir;
            if (Math.max(spaceLeft, spaceRight) >= reach) dir = spaceRight >= spaceLeft ? 'left' : 'right';
            else if (rect.top >= reach) dir = 'down';
            else dir = 'up';
            const midX = rect.left + rect.width / 2;
            const midY = rect.top + rect.height / 2;
            let cx, cy;
            if (dir === 'down') { cx = midX; cy = rect.top - MARK_GAP - MARK_SIZE / 2; }
            else if (dir === 'up') { cx = midX; cy = rect.bottom + MARK_GAP + MARK_SIZE / 2; }
            else if (dir === 'left') { cx = rect.right + MARK_GAP + MARK_SIZE / 2; cy = midY; }
            else { cx = rect.left - MARK_GAP - MARK_SIZE / 2; cy = midY; }
            cx = Math.min(Math.max(cx, MARK_SIZE / 2 + 2), Math.max(MARK_SIZE / 2 + 2, vw - MARK_SIZE / 2 - 2));
            cy = Math.min(Math.max(cy, MARK_SIZE / 2 + 2), Math.max(MARK_SIZE / 2 + 2, vh - MARK_SIZE / 2 - 2));
            markArrowNode.className = `mark-arrow mark-arrow--${dir}`;
            markArrowNode.style.left = `${Math.round(cx - MARK_SIZE / 2)}px`;
            markArrowNode.style.top = `${Math.round(cy - MARK_SIZE / 2)}px`;
        };

        const fitAnnotCanvas = () => {
            const vw = window.innerWidth || document.documentElement.clientWidth;
            const vh = window.innerHeight || document.documentElement.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            const pixelW = Math.max(1, Math.round(vw * dpr));
            const pixelH = Math.max(1, Math.round(vh * dpr));
            if (annotCanvas.width !== pixelW || annotCanvas.height !== pixelH) { annotCanvas.width = pixelW; annotCanvas.height = pixelH; }
            annotCanvas.style.width = `${vw}px`;
            annotCanvas.style.height = `${vh}px`;
            return { vw, vh, dpr };
        };

        // 圈绘制为全屏覆盖层（棋盘之上、暗化层之上），因此棋盘即使处于对话暗化阶段也能清晰指示
        const drawAnnotCircle = () => {
            if (!annotCanvas) return;
            const ctx = annotCanvas.getContext('2d');
            if (!ctx) return;
            const view = fitAnnotCanvas();
            ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
            ctx.clearRect(0, 0, view.vw, view.vh);
            if (!activeCircle || !ui || !ui.spacing || !ui.size || !boardCanvas) return;
            const rect = boardCanvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            const scale = rect.width / ui.size;
            const cx = rect.left + (ui.offset + activeCircle.x * ui.spacing) * scale;
            const cy = rect.top + (ui.offset + activeCircle.y * ui.spacing) * scale;
            const radius = ui.spacing * ((ui.stone_radius || 0.41) + 0.16) * scale;
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.setLineDash([Math.max(6, radius * 0.38), Math.max(5, radius * 0.26)]);
            ctx.lineDashOffset = -markPhase;
            ctx.strokeStyle = activeCircle.color;
            ctx.lineWidth = Math.max(3, radius * 0.16);
            ctx.shadowColor = activeCircle.color;
            ctx.shadowBlur = Math.max(4, radius * 0.32);
            ctx.stroke();
            ctx.closePath();
            ctx.restore();
        };

        const markTick = () => {
            markFrame = 0;
            markPhase = (markPhase + 1.6) % 720;
            if (activeArrow) { placeArrow(); drawDim(); }
            if (activeCircle) drawAnnotCircle();
            if (activeArrow || activeCircle) markFrame = requestAnimationFrame(markTick);
        };

        const ensureMarkLoop = () => {
            if (!markFrame && (activeArrow || activeCircle)) markFrame = requestAnimationFrame(markTick);
        };

        const clearMarks = () => {
            activeArrow = null;
            activeCircle = null;
            if (markFrame) { cancelAnimationFrame(markFrame); markFrame = 0; }
            if (markArrowNode) { markArrowNode.remove(); markArrowNode = null; }
            if (annotCanvas) {
                const ctx = annotCanvas.getContext('2d');
                if (ctx && annotCanvas.width && annotCanvas.height) { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, annotCanvas.width, annotCanvas.height); }
            }
            dimKey = '';
            drawDim();
        };

        // ==================== 暗化层 + 箭头指向处的亮化（圆角方块，边界略模糊） ====================
        const dimCanvas = $('dialogue_dim');
        const DIM_ALPHA = 0.52;
        const SPOT_BLUR = 10;
        let dimKey = '';

        const roundRectPath = (ctx, x, y, w, h, r) => {
            const radius = Math.max(0, Math.min(r, w / 2, h / 2));
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        };

        const drawDim = () => {
            if (!dimCanvas || !dimCanvas.getContext) return;
            const ctx = dimCanvas.getContext('2d');
            if (!ctx) return;
            const vw = window.innerWidth || document.documentElement.clientWidth;
            const vh = window.innerHeight || document.documentElement.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            const pixelW = Math.max(1, Math.round(vw * dpr));
            const pixelH = Math.max(1, Math.round(vh * dpr));
            const rect = activeArrow ? anchorRect(activeArrow.anchor) : null;
            const key = `${pixelW}x${pixelH}|${rect ? `${Math.round(rect.left)},${Math.round(rect.top)},${Math.round(rect.width)},${Math.round(rect.height)}` : 'flat'}`;
            if (key === dimKey) return;
            dimKey = key;
            if (dimCanvas.width !== pixelW || dimCanvas.height !== pixelH) { dimCanvas.width = pixelW; dimCanvas.height = pixelH; }
            dimCanvas.style.width = `${vw}px`;
            dimCanvas.style.height = `${vh}px`;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, vw, vh);
            ctx.fillStyle = `rgba(0, 0, 0, ${DIM_ALPHA})`;
            ctx.fillRect(0, 0, vw, vh);
            if (!rect) return;
            const padX = Math.max(10, rect.width * 0.08);
            const padY = Math.max(10, rect.height * 0.16);
            const x = rect.left - padX;
            const y = rect.top - padY;
            const w = rect.width + padX * 2;
            const h = rect.height + padY * 2;
            const radius = Math.max(6, Math.min(22, h * 0.3));
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.filter = `blur(${SPOT_BLUR}px)`;
            roundRectPath(ctx, x, y, w, h, radius);
            ctx.fillStyle = '#000';
            ctx.fill();
            ctx.restore();
        };

        const applyMark = (node) => {
            clearMarks();
            if (!node || node.kind === 'clear') return;
            const color = sanitizeColor(node.color);
            if (node.kind === 'arrow') {
                activeArrow = { 'anchor': node.target, 'color': color };
                markArrowNode = document.createElement('div');
                markArrowNode.className = 'mark-arrow';
                markArrowNode.innerHTML = MARK_ARROW_SVG.split(MARK_DEFAULT_COLOR).join(color);
                markLayer.append(markArrowNode);
            } else if (node.kind === 'circle') {
                if (!node.cell) return;
                activeCircle = { 'x': node.cell[0], 'y': node.cell[1], 'color': color };
            }
            placeArrow();
            drawDim();
            ensureMarkLoop();
        };

        const renderNode = () => {
            const node = runtime.current();
            if (!node || node.type === 'end' || runtime.is_end()) { endStory(); return; }
            if (node.type === 'say') {
                renderFace(node.speaker, node.expression);
                $('dialogue_options').classList.add('d-none');
                $('dialogue_options').innerHTML = '';
                typeText(applyPlaceholders(runtime.interpolate(node.text)));
                return;
            }
            if (node.type === 'choice') {
                renderFace(node.speaker || '请选择', node.expression || '');
                typeText(applyPlaceholders(runtime.interpolate(node.prompt)));
                const options = $('dialogue_options');
                options.innerHTML = '';
                options.classList.remove('d-none');
                $('dialogue_next').classList.add('d-none');
                node.options.forEach((option, index) => {
                    const button = document.createElement('button');
                    button.type = 'button'; button.className = 'dialogue-option';
                    button.textContent = runtime.interpolate(option.text);
                    button.addEventListener('click', (event) => { event.stopPropagation(); runtime.choose(index); renderNode(); });
                    options.append(button);
                });
                return;
            }
            if (node.type === 'jump') { runtime.goto(node.target); renderNode(); return; }
            if (node.type === 'cond') { runtime.step_cond(node); renderNode(); return; }
            if (node.type === 'mark') { applyMark(node); runtime.advance(); renderNode(); return; }
            if (node.type === 'game') { startGame(node); return; }
            if (node.type === 'resume') {
                const done = pendingResume;
                if (done) {
                    pendingResume = null;
                    runtime.index = gameNodeIndex;
                    mode = 'game';
                    setDialogueVisible(false);
                    refreshGuide();
                    done();
                } else { runtime.advance(); renderNode(); }
                return;
            }
            runtime.advance(); renderNode();
        };

        const advanceDialogue = () => {
            if (mode !== 'dialogue') return;
            const node = runtime.current();
            if (!node) return;
            if (node.type === 'choice' && !$('dialogue_options').classList.contains('d-none')) return;
            if (finishTyping()) return;
            runtime.advance();
            renderNode();
        };
        dialoguePanel.addEventListener('click', advanceDialogue);

        // 点击对话框以外的位置：临时收起对话框；收起后点击任意位置再从底部弹出
        document.addEventListener('click', (event) => {
            if (!dialogueActive || mode !== 'dialogue') return;
            const ending = $('ending');
            if (ending && !ending.classList.contains('d-none')) return;
            const target = event.target;
            if (!target || !target.closest) return;
            if (target.closest('#button_home')) return;
            if (dialogueCollapsed) { setDialogueCollapsed(false); return; }
            if (target.closest('#dialogue')) return;
            setDialogueCollapsed(true);
        });

        const endStory = () => {
            mode = 'end';
            gameOver = true;
            clearMarks();
            setDialogueVisible(false);
            if (pendingResume) { const done = pendingResume; pendingResume = null; done(); }
            const tip = $('ending_tip');
            tip.textContent = `${runtime && runtime.nodes ? runtime.nodes.length : 0} 个节点已播放完毕。`;
            $('ending').classList.remove('d-none');
        };

        // ==================== 对局引擎 ====================
        const toStone = (stone) => ({ 'black': STONE_ENUM.BLACK, 'white': STONE_ENUM.WHITE, 'black-ascend': STONE_ENUM.BLACK_ASCEND, 'white-ascend': STONE_ENUM.WHITE_ASCEND, 'black-used': STONE_ENUM.BLACK_USED, 'white-used': STONE_ENUM.WHITE_USED })[stone] || STONE_ENUM.NONE;
        const toPlant = (plant) => plant === 2 ? PLANT_ENUM.TWO : plant === 1 ? PLANT_ENUM.ONE : PLANT_ENUM.NONE;
        const toPlayer = (player) => Number(player) === 1 ? PLAYER_ENUM.WHITE : PLAYER_ENUM.BLACK;
        const toAscend = (status) => Number(status) === 1 ? ASCEND_ENUM.START : Number(status) === 2 ? ASCEND_ENUM.END : ASCEND_ENUM.NONE;
        const toOver = (status) => Number(status) === 1 ? OVER_ENUM.ENABLE : Number(status) === 2 ? OVER_ENUM.EXECUTE : OVER_ENUM.NONE;
        const colorFor = (stone) => stone === STONE_ENUM.BLACK ? '#2c3e50' : stone === STONE_ENUM.WHITE ? '#ecf0f1' : stone === STONE_ENUM.BLACK_ASCEND ? '#e74c3c' : '#3498db';
        const fromPlayer = () => state.turn_player === PLAYER_ENUM.BLACK ? STONE_ENUM.BLACK : STONE_ENUM.WHITE;
        const legal = (x, y) => game && game.valid(x, y, fromPlayer());
        // 防误触：清除待确认落点的紫色校验标记。
        const clearPendingConfirm = () => {
            pendingConfirm = null;
            if (ui && typeof ui.clear_stone_validate === 'function') ui.clear_stone_validate();
        };
        const moveLabel = (move) => `${move[0] + 1} · ${9 - move[1]}`;
        const archiveMoveToBoard = ([x, y]) => importedArchive ? [x, 8 - y] : [x, y];

        // ==================== 引导落子（残局码内嵌，红色虚线旋转圈） ====================
        // 作者在残局页定义的引导落子点随残局码写入 guide_moves，剧情对局按序提示玩家落点。
        const guideCanvas = $('canvas_guide');
        let guide = null;
        let guideFrame = 0;
        let guidePhase = 0;
        const GUIDE_COLOR = '#ff2d2d';
        const hasActiveGuide = () => Boolean(guide && guide.active() && mode === 'game' && !gameOver);
        const drawGuide = () => {
            if (!guideCanvas || !guideCanvas.getContext) return;
            const ctx = guideCanvas.getContext('2d');
            if (!ctx) return;
            const rect = boardCanvas.getBoundingClientRect();
            const cssW = rect.width || (ui && ui.size) || 0;
            const cssH = rect.height || (ui && ui.size) || 0;
            const dpr = window.devicePixelRatio || 1;
            const pixelW = Math.max(1, Math.round(cssW * dpr));
            const pixelH = Math.max(1, Math.round(cssH * dpr));
            if (guideCanvas.width !== pixelW || guideCanvas.height !== pixelH) {
                guideCanvas.width = pixelW;
                guideCanvas.height = pixelH;
                guideCanvas.style.width = `${cssW}px`;
                guideCanvas.style.height = `${cssH}px`;
            }
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, cssW, cssH);
            if (!hasActiveGuide() || !ui || !ui.spacing || !ui.size || !cssW) return;
            const target = guide.current();
            const scale = cssW / ui.size;
            const cx = (ui.offset + target[0] * ui.spacing) * scale;
            const cy = (ui.offset + target[1] * ui.spacing) * scale;
            const radius = ui.spacing * ((ui.stone_radius || 0.41) + 0.16) * scale;
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.setLineDash([Math.max(6, radius * 0.38), Math.max(5, radius * 0.26)]);
            ctx.lineDashOffset = -guidePhase;
            ctx.strokeStyle = GUIDE_COLOR;
            ctx.lineWidth = Math.max(3, radius * 0.16);
            ctx.shadowColor = GUIDE_COLOR;
            ctx.shadowBlur = Math.max(4, radius * 0.32);
            ctx.stroke();
            ctx.closePath();
            ctx.restore();
        };
        const guideTick = () => {
            if (!hasActiveGuide()) { guideFrame = 0; drawGuide(); return; }
            guidePhase = (guidePhase + 1.6) % 720;
            drawGuide();
            guideFrame = requestAnimationFrame(guideTick);
        };
        const refreshGuide = () => {
            if (!hasActiveGuide()) {
                if (guideFrame) { cancelAnimationFrame(guideFrame); guideFrame = 0; }
                drawGuide();
                return;
            }
            if (!guideFrame) guideFrame = requestAnimationFrame(guideTick);
        };
        // 玩家落在当前引导点则推进到下一个；否则取消后续全部引导。
        const advanceGuide = (x, y) => {
            if (!guide || !guide.active()) return;
            const result = guide.advance(x, y);
            if (result.cancelled) setStatus('未按引导落子，后续引导已取消。', 'warning');
            else if (result.done) setStatus('已按引导完成全部落子提示。', 'success');
            refreshGuide();
        };
        const resetGuide = (archiveData) => {
            const moves = (archiveData && archiveData.guide_moves) || [];
            guide = moves.length ? window.EndgameExports.create_guide(moves.map(archiveMoveToBoard)) : null;
            guidePhase = 0;
            refreshGuide();
        };

        const getBoardSize = () => {
            const wrap = boardCanvas.parentElement;
            const width = wrap ? wrap.clientWidth : 0;
            const height = wrap ? wrap.clientHeight : 0;
            return Math.max(280, Math.floor(Math.min(width || 320, height || width || 320)));
        };

        const redraw = () => {
            if (!ui || !game) return;
            ui.size = getBoardSize();
            ui.init(); ui.draw_board();
            game.board.data.forEach((pos) => {
                if (pos.stone === STONE_ENUM.BLACK) ui.draw_stone_fill(pos.x, pos.y, '#2c3e50');
                else if (pos.stone === STONE_ENUM.WHITE) ui.draw_stone_fill(pos.x, pos.y, '#ecf0f1');
                else if (pos.stone === STONE_ENUM.BLACK_ASCEND) ui.draw_stone_ascend(pos.x, pos.y, '#e74c3c');
                else if (pos.stone === STONE_ENUM.WHITE_ASCEND) ui.draw_stone_ascend(pos.x, pos.y, '#3498db');
                if (pos.plant === PLANT_ENUM.ONE) ui.draw_plant(pos.x, pos.y);
                else if (pos.plant === PLANT_ENUM.TWO) ui.draw_2plant(pos.x, pos.y);
            });
            if (state.turn_count > 0) ui.draw_stone_turn(state.turn_pos[0], state.turn_pos[1], '#FFD700', 5);
        };

        const renderInfo = () => {
            const blackHp = state ? state.hp[0] : hpMax.black;
            const whiteHp = state ? state.hp[1] : hpMax.white;
            const blackHpPercent = hpMax.black ? Math.trunc(Math.max(0, Math.min(1, blackHp / hpMax.black)).toFixed(2) * 100) : 0;
            const whiteHpPercent = hpMax.white ? Math.trunc(Math.max(0, Math.min(1, whiteHp / hpMax.white)).toFixed(2) * 100) : 0;
            document.documentElement.style.setProperty('--hp-color-p1', String(blackHpPercent));
            document.documentElement.style.setProperty('--hp-color-p2', String(whiteHpPercent));
            $('game_p1_name').textContent = selfPlayer === PLAYER_ENUM.BLACK ? playerName : '对手 AI';
            $('game_p2_name').textContent = selfPlayer === PLAYER_ENUM.WHITE ? playerName : '对手 AI';
            // 登录玩家已设置昵称颜色时，用自己的彩色昵称替换自己的名字
            if (typeof window.name_color_apply_self === 'function') {
                window.name_color_apply_self(selfPlayer === PLAYER_ENUM.BLACK ? $('game_p1_name') : $('game_p2_name'));
            }
            $('game_p1_hp').textContent = `HP: ${blackHp}/${hpMax.black}`;
            $('game_p2_hp').textContent = `HP: ${whiteHp}/${hpMax.white}`;
            const ascendPower = (stone) => game ? game.board.data.filter((pos) => pos.stone === stone).reduce((sum, pos) => sum + 1 + (pos.plant === PLANT_ENUM.TWO ? 2 : pos.plant === PLANT_ENUM.ONE ? 1 : 0), 0) : 0;
            const ascendCount = (stone) => game ? game.board.data.filter((pos) => pos.stone === stone).length : 0;
            const blackPower = ascendPower(STONE_ENUM.BLACK_ASCEND), whitePower = ascendPower(STONE_ENUM.WHITE_ASCEND);
            $('game_p1_ascend').textContent = `PR：${ascendCount(STONE_ENUM.BLACK_ASCEND)}+${Math.max(0, blackPower - ascendCount(STONE_ENUM.BLACK_ASCEND))}`;
            $('game_p2_ascend').textContent = `PR：${ascendCount(STONE_ENUM.WHITE_ASCEND)}+${Math.max(0, whitePower - ascendCount(STONE_ENUM.WHITE_ASCEND))}`;
            $('game_info_turn').textContent = `${state ? state.turn_count : 0} Turns`;
            $('game_info_plant_cd').textContent = state && state.ascend_status !== ASCEND_ENUM.NONE ? (state.ascend_status === ASCEND_ENUM.START ? 'CD=st' : 'CD=ed') : `CD=${state ? state.grow_count : 'cd'}`;
            const normalPlants = game ? game.board.data.filter((pos) => pos.stone === STONE_ENUM.NONE && pos.plant !== PLANT_ENUM.NONE).length : 0;
            $('game_info_plant_normal').textContent = `${normalPlants} NPlants`;
            const pendingPoints = game && Array.isArray(game.plant_points) ? game.plant_points.length : 0;
            const pendingSchedule = game && Array.isArray(game.plant_schedule) ? game.plant_schedule.filter((entry, index) => !(game.plant_fired && game.plant_fired.has(index))).length : 0;
            $('game_info_plant_left').textContent = `剩余刷草点：${pendingPoints} / 计划：${pendingSchedule}`;
            $('game_p1_card').classList.toggle('is-defeated', blackHp <= 0);
            $('game_p2_card').classList.toggle('is-defeated', whiteHp <= 0);
            $('game_p1_info').classList.toggle('is-defeated', blackHp <= 0);
            $('game_p2_info').classList.toggle('is-defeated', whiteHp <= 0);
            const playerTurn = state && state.turn_player === selfPlayer;
            $('game_p1_card').classList.toggle('turn-green', Boolean(playerTurn && selfPlayer === PLAYER_ENUM.BLACK));
            $('game_p1_info').classList.toggle('turn-green', Boolean(playerTurn && selfPlayer === PLAYER_ENUM.BLACK));
            $('game_p2_card').classList.toggle('turn-blue', Boolean(playerTurn && selfPlayer === PLAYER_ENUM.WHITE));
            $('game_p2_info').classList.toggle('turn-blue', Boolean(playerTurn && selfPlayer === PLAYER_ENUM.WHITE));
            if (ui) ui.set_turn_flash(Boolean(playerTurn) && !gameOver);
        };

        const stoneMeta = (pos) => ({
            gx: pos.x, gy: pos.y,
            power: pos.plant === PLANT_ENUM.ONE ? 2 : pos.plant === PLANT_ENUM.TWO ? 3 : 1,
            plant: pos.plant === PLANT_ENUM.ONE ? 1 : pos.plant === PLANT_ENUM.TWO ? 2 : 0,
            color: pos.stone === STONE_ENUM.BLACK_ASCEND ? '#e74c3c' : '#3498db',
            stone_color: pos.stone === STONE_ENUM.BLACK_ASCEND ? '#2c3e50' : '#ecf0f1',
            marker_color: pos.stone === STONE_ENUM.BLACK_ASCEND ? '#e74c3c' : '#3498db',
        });

        const recordModelHistory = () => {
            game.history_boards.push(RulesRuntime.solidBoard(game));
            while (game.history_boards.length > 7) game.history_boards.shift();
        };

        const syncAiStone = async (x, y, generation) => {
            if (!aiWorker || generation !== gameGeneration) return;
            const result = await aiWorker.ENDGAME_APPLY(indexOf(x, y));
            if (!result || !result.legal) throw new Error(`4zero MCTS 拒绝了合法落子：${x},${y}`);
        };
        const syncAiBoard = async () => {
            if (!aiWorker) return;
            await aiWorker.ENDGAME_LOAD(RulesRuntime.snapshot(game));
        };

        const renderMove = async (x, y, source, generation) => {
            const stone = fromPlayer();
            const isBlack = stone === STONE_ENUM.BLACK;
            ui.clear_view_move(); ui.clear_view_turn();
            ui.draw_stone_turn(x, y, source === 'ai' ? '#00FFC5' : '#FFD700', 5);
            sound && sound.play_stone();
            const points = game.ed_as_1();
            lastMovePicked = Boolean(points);
            renderInfo();
            if (sound && sound.context && sound.context.state === 'suspended') sound.context.resume().catch(() => {});
            if (!points) {
                ui.clear_stone_fill(x, y); ui.clear_stone_ascend(x, y);
                ui.draw_stone_fill(x, y, isBlack ? '#2c3e50' : '#ecf0f1');
                const pos = game.board.get_pos(x, y);
                if (pos.plant === PLANT_ENUM.ONE) ui.draw_plant(x, y);
                else if (pos.plant === PLANT_ENUM.TWO) ui.draw_2plant(x, y);
                ui.draw_effect_place(x, y, isBlack ? '#2c3e50' : '#95a5a6');
                return;
            }
            const lifted = points.filter((pos) => pos.stone === STONE_ENUM.BLACK_ASCEND || pos.stone === STONE_ENUM.WHITE_ASCEND);
            lifted.forEach((pos) => {
                ui.clear_stone_fill(pos.x, pos.y); ui.clear_stone_ascend(pos.x, pos.y);
                ui.draw_stone_ascend(pos.x, pos.y, pos.stone === STONE_ENUM.BLACK_ASCEND ? '#e74c3c' : '#3498db');
            });
            await ui.ascend_lift(lifted.map(stoneMeta), isBlack ? 'left' : 'right');
            if (generation !== gameGeneration) return;
            lifted.forEach((pos) => ui.draw_effect_ascend(pos.x, pos.y, pos.stone === STONE_ENUM.BLACK_ASCEND ? '#e74c3c' : '#3498db'));
            pendingAscend[game.state.ascend_status === ASCEND_ENUM.START ? 0 : 1].push(...lifted);
            sound && sound.play_orbit();
        };

        const settleRound = async (generation) => {
            if (generation !== gameGeneration) return true;
            const as = game.ed_as_2(true);
            settlementDamage = game.state.pending_damage ? [...game.state.pending_damage] : [0, 0];
            if (as !== undefined) {
                const nextHp = [game.state.hp[0] - settlementDamage[0], game.state.hp[1] - settlementDamage[1]];
                const fxDone = ui.ascend_settle(
                    { left: $('game_p1_hp'), right: $('game_p2_hp') },
                    () => { if (game.state.pending_damage) { game.state.hp[0] -= game.state.pending_damage[0]; game.state.hp[1] -= game.state.pending_damage[1]; game.state.pending_damage = null; } renderInfo(); },
                    () => setStatus(`ASCEND 结算：黑方 ${nextHp[0]} · 白方 ${nextHp[1]}`, 'info')
                );
                await sleep(900);
                $('game_p1_ascend').textContent = 'PR：0+0';
                $('game_p2_ascend').textContent = 'PR：0+0';
                await fxDone;
                // 被反击/卖血占据的升变点已换成占方普通子，其草仍然存在，
                // 清层后必须按当前盘面重绘，否则占点上的草会被一并擦掉。
                pendingAscend.flat().forEach((pos) => {
                    ui.clear_stone_ascend(pos.x, pos.y);
                    ui.clear_plant(pos.x, pos.y);
                    const current = game.board.get_pos(pos.x, pos.y);
                    if (!current) return;
                    if (current.plant === PLANT_ENUM.ONE) ui.draw_plant(pos.x, pos.y);
                    else if (current.plant === PLANT_ENUM.TWO) ui.draw_2plant(pos.x, pos.y);
                });
                pendingAscend[0].length = 0; pendingAscend[1].length = 0;
            }
            game.ed_tr_2();
            const win = game.ed_win();
            if (win) { concludeGame(win); return true; }
            settlementDamage = [0, 0];
            const plants = game.ed_pl_1();
            if (plants) {
                plants.forEach((pos) => {
                    ui.clear_plant(pos.x, pos.y);
                    const count = pos.plant === PLANT_ENUM.TWO ? 2 : 1;
                    ui.draw_effect_plant(pos.x, pos.y, count);
                    count === 1 ? ui.draw_plant(pos.x, pos.y) : ui.draw_2plant(pos.x, pos.y);
                });
                sound && sound.play_plant();
                setStatus(`刷草点生成：${plants.map((pos) => `${pos.x + 1},${9 - pos.y}`).join(' / ')}`, 'info');
                // 新草必须同步给 AI：Worker 不会自然刷草，否则 AI 看到的盘面落后一株。
                await syncAiBoard();
                await sleep(420);
            }
            game.ed_as_3();
            renderInfo();
            return false;
        };

        const aiThink = async () => {
            if (aiWorker) {
                try {
                    // 纯 Zero MCTS：不调用残局链路，避免斩杀 / 防自杀矫正在剧情中改写落点。
                    const search = await aiWorker.STORY_THINK(STORY_SIMULATIONS);
                    const index = search && search.action;
                    const move = Number.isInteger(index) && index >= 0 && index < 81 ? [index % 9, Math.floor(index / 9)] : null;
                    if (move && legal(move[0], move[1])) {
                        setStatus(`4zero MCTS 完成：${search.simulations || 0}/${search.requestedSimulations || STORY_SIMULATIONS} 次模拟`, 'info');
                        return move;
                    }
                } catch (error) { console.warn('剧情 AI 搜索失败，启用合法落点保护。', error); }
            }
            for (let y = 0; y < 9; y++) for (let x = 0; x < 9; x++) if (legal(x, y)) return [x, y];
            return null;
        };

        const applyMove = async (move, source, generation) => {
            if (ui.ascend_is_lifted(move[0], move[1])) ui.ascend_counter(move[0], move[1]);
            recordModelHistory();
            if (!game.ed_tr_1(move[0], move[1])) { game.history_boards.pop(); return false; }
            if (source === 'player') advanceGuide(move[0], move[1]);
            await syncAiStone(move[0], move[1], generation);
            moves.push({ move, source });
            await renderMove(move[0], move[1], source, generation);
            const ended = await settleRound(generation);
            if (ended || gameOver) return true;
            // 残局结束条件：本局落子数达到设定步数即结束（胜负优先，此处按平局处理）
            if (endLimit > 0 && moves.length >= endLimit) { await concludeGame(null); return true; }
            // 步数对话：每次落子后按当前总手数检查是否触发（支持任意步数）
            await runStepDialogues(source, move);
            return false;
        };

        const runAiTurns = async (generation) => {
            while (!gameOver && generation === gameGeneration && state.turn_player === aiPlayer) {
                const response = bookedWhite;
                bookedWhite = null;
                let move = null;
                // 作者在残局码里定义的 AI 预设优先级最高：与玩家是否命中正着无关，
                // 每次 AI 回合依序消费一步；预设点不可落子时仅该步改由 AI 思考，其余步继续按预设。
                if (aiPreset && aiPreset.active()) {
                    const preset = aiPreset.next();
                    aiPreset.advance();
                    if (preset && legal(preset[0], preset[1])) { move = preset; setStatus('对手按 AI 预设落子。', 'info'); }
                    else setStatus('AI 预设点不可落子，本步改由 AI 思考，其余步仍按预设。', 'warning');
                }
                // AI 执黑时，作者的黑方正着就是黑方的预设队列
                if (!move && bookPreset && bookPreset.active()) {
                    const preset = bookPreset.next();
                    bookPreset.advance();
                    if (preset && legal(preset[0], preset[1])) { move = preset; setStatus('对手按黑方正着预设落子。', 'info'); }
                }
                // 玩家命中正着时，白方严格按作者预案应手（与残局挑战一致）
                if (!move && response && response.white_move && legal(response.white_move[0], response.white_move[1])) {
                    move = response.white_move;
                    setStatus('白方按残局预案应手。', 'info');
                }
                if (!move) {
                    setStatus('对手 AI（4zero MCTS）正在计算...', 'info');
                    move = await aiThink();
                }
                if (!move || !legal(move[0], move[1])) { setStatus('对手 AI 未找到合法落点。', 'danger'); return; }
                const ended = await applyMove(move, 'ai', generation);
                if (ended || gameOver) return;
            }
        };

        // 步数对话：命中触发条件后暂停本局，跳转到配置的标签播放对话；“继续对局”回到棋盘
        // 四类触发：步数（玩家第一步=1、AI 应手=2…）、位置落子（先横后竖，1-9，5,5 为正中心）、拿起棋子、AI拿起棋子
        const runStepDialogues = async (source, move) => {
            const entries = (currentConfig && currentConfig.dialogues) || [];
            const step = moves.length;
            const hitIndex = entries.findIndex((item, index) => {
                if (!item || !item.target || triggeredEvents.has(index)) return false;
                if (item.type === 'cell') return Boolean(move) && item.x === move[0] && item.y === move[1];
                if (item.type === 'pick') return source === 'player' && lastMovePicked;
                if (item.type === 'ai_pick') return source === 'ai' && lastMovePicked;
                return item.step === step;
            });
            if (hitIndex < 0) return;
            const hit = entries[hitIndex];
            if (!Object.prototype.hasOwnProperty.call(runtime.labels, hit.target) && hit.target !== '结束' && hit.target !== '剧终') return;
            triggeredEvents.add(hitIndex);
            await new Promise((resolve) => {
                pendingResume = resolve;
                mode = 'dialogue';
                setDialogueVisible(true);
                runtime.goto(hit.target);
                renderNode();
            });
        };

        const playerTurn = async (x, y) => {
            if (mode !== 'game' || running || gameOver || !state || state.turn_player !== selfPlayer) return;
            if (!aiReady) { setStatus('对手 AI 仍在准备，请稍候。', 'warning'); return; }
            if (!legal(x, y)) { setStatus('此处不能落子。', 'danger'); return; }
            clearPendingConfirm();
            if (activeCircle && activeCircle.x === x && activeCircle.y === y) clearMarks();
            running = true;
            const generation = gameGeneration;
            try {
                let currentBook = null;
                if (selfPlayer === PLAYER_ENUM.BLACK && branch) currentBook = await branch.black_move([x, y], {});
                const ended = await applyMove([x, y], 'player', generation);
                if (ended || gameOver) return;
                if (mode !== 'game' || gameOver || generation !== gameGeneration) return;
                const white = currentBook && currentBook.white_move ? currentBook.white_move : null;
                // 作者预案命中时白方严格按预案应手；偏离后 currentBook.white_move 已是普通 AI 结果。
                bookedWhite = white ? { white_move: white } : null;
                await runAiTurns(generation);
            } catch (error) {
                console.error('剧情对局回合失败。', error);
                setStatus('回合执行失败，请返回列表重试。', 'danger');
            } finally { running = false; }
        };

        const pointFromEvent = (event) => {
            const rect = boardCanvas.getBoundingClientRect();
            if (!rect.width || !rect.height || !ui.spacing) return [-1, -1];
            const drawX = (event.clientX - rect.left) * ui.size / rect.width;
            const drawY = (event.clientY - rect.top) * ui.size / rect.height;
            return [Math.round((drawX - ui.offset) / ui.spacing), Math.round((drawY - ui.offset) / ui.spacing)];
        };
        const handleBoardPress = (x, y) => {
            if (endByClick) return;
            if (mode !== 'game' || running || gameOver || !state || state.turn_player !== selfPlayer) return;
            if (!aiReady || !legal(x, y)) { clearPendingConfirm(); playerTurn(x, y); return; }
            // 等级 1 仅保护会触发 ASCEND「打」的落子；等级 2 所有落子都需二次确认。
            const isAttack = clickLevel === 1 && game && game.board && typeof game.board.get_ascend === 'function'
                ? Boolean(game.board.get_ascend(x, y, fromPlayer()))
                : false;
            const needConfirm = clickLevel === 2 || isAttack;
            if (!needConfirm) { clearPendingConfirm(); playerTurn(x, y); return; }
            if (pendingConfirm && pendingConfirm[0] === x && pendingConfirm[1] === y) { clearPendingConfirm(); playerTurn(x, y); return; }
            pendingConfirm = [x, y];
            if (ui) { if (typeof ui.clear_stone_validate === 'function') ui.clear_stone_validate(); ui.draw_stone_validate(x, y, '#BF00FF'); }
            setStatus(isAttack ? '此落子会发动「打」，再次点击同一位置确认。' : '再次点击同一位置确认落子。', 'info');
        };
        boardCanvas.addEventListener('pointerdown', (event) => {
            event.preventDefault();
            if (mode !== 'game') return;
            if (endByClick) { clearPendingConfirm(); concludeGame(null); return; }
            const [x, y] = pointFromEvent(event);
            if (x >= 0 && x < 9 && y >= 0 && y < 9) handleBoardPress(x, y);
        });

        const archiveFlatToBoard = (values) => {
            if (!importedArchive) return Array.from(values || []);
            return Array.from({ length: 81 }, (_, index) => values[(8 - Math.floor(index / 9)) * 9 + (index % 9)]);
        };

        const createGame = (config, archiveData) => {
            const boardSize = getBoardSize();
            ui = new GameCanvas(boardCanvas, $('canvas_stone_fill'), $('canvas_stone_ascend'), $('canvas_plant'), $('canvas_view_turn'), $('canvas_view_ascend'), $('canvas_view_move'), 9, 9, .41, .12, .062, boardSize);
            const saved = (archiveData && archiveData.snapshot) || {};
            const integer = (value, fallback) => Number.isFinite(Number(value)) ? Math.trunc(Number(value)) : fallback;
            const hp = Array.isArray(saved.hp) ? saved.hp : [hpMax.black, hpMax.white];
            state = new State();
            state.hp = [Math.max(0, integer(hp[0], hpMax.black)), Math.max(0, integer(hp[1], hpMax.white))];
            state.turn_player = toPlayer(saved.turnPlayer);
            state.turn_count = Math.max(0, integer(saved.turnCount, 0));
            state.turn_pos = archiveMoveToBoard(Array.isArray(saved.turnPos) ? saved.turnPos : [0, 0]);
            state.ascend_status = toAscend(saved.ascendStatus);
            state.pending_damage = Array.isArray(saved.pendingDamage) ? saved.pendingDamage.map((value) => integer(value, 0)) : null;
            state.unascend_charge = Math.max(0, integer(saved.unascendCharge, 25));
            state.unascend_chargef = Array.isArray(saved.fastUnascendCharge) ? saved.fastUnascendCharge.map((value) => Math.max(0, integer(value, 9))) : [9, 9];
            state.grow_count = Math.max(1, integer(saved.growCount, 11));
            state.just_unascend = Boolean(saved.justUnascend);
            state.over_status = toOver(saved.overStatus);
            state.turn_player = toPlayer(config.first === 'white' ? 1 : 0);
            const randAic = new RandAIC(0x4A534B31), randUnity = new RandUnity(0x4A534B32);
            game = new GameStory(new Board(9, 9), state, randAic, randUnity);
            game.plant_points = (config.points || []).map((point) => [point[0], point[1]]);
            game.plant_schedule = (config.schedule || []).map((entry) => ({ 'turn': entry.turn, 'cells': (entry.cells || []).map((cell) => [cell[0], cell[1]]) }));
            game.first_player = state.turn_player;
            game.history_boards = [];
            const soundOptions = (() => { let savedOpt = {}; try { savedOpt = JSON.parse(localStorage.getItem('opt') || '{}') || {}; } catch (_) { /* 默认音量 */ } const read = (key, fallback) => Number.isFinite(Number(savedOpt[key])) ? Number(savedOpt[key]) : fallback; return { bgmv: read('bgmv', 1), stonev: read('stonev', 5), plantv: read('plantv', 5), matchv: read('matchv', 5), tickv: read('tickv', 5), annihilationv: read('annihilationv', 0), hitv: read('hitv', 0), orbitv: read('orbitv', 0), flyv: read('flyv', 0) }; })();
            sound = new window.GameExports.Sound(soundOptions.bgmv, soundOptions.stonev, soundOptions.plantv, soundOptions.matchv, soundOptions.tickv, soundOptions.tickv, soundOptions.annihilationv, soundOptions.hitv, soundOptions.orbitv, soundOptions.flyv);
            ui.set_sound(sound);
            if (archiveData && archiveData.cells) archiveData.cells.forEach((cell, index) => {
                const x = index % 9, y = 8 - Math.floor(index / 9);
                game.board.set_pos(x, y, toStone(cell.stone), toPlant(cell.plant));
            });
            RulesRuntime.initialize(game, game.first_player);
            game.board.turns = (saved.turns || []).map(archiveMoveToBoard);
            ui.init(); ui.draw_board(); redraw(); renderInfo();
            resetGuide(archiveData);
        };

        // 解析阵营/血量配置（可选残局码），并写回 config
        const resolveSides = (config) => {
            importedArchive = false;
            let archiveData = null;
            if (config.archive) {
                try { archiveData = window.EndgameExports.EndgameArchive.decode(config.archive); importedArchive = true; }
                catch (error) { console.warn('残局码解析失败，改用空盘。', error); }
            }
            const selfSide = config.self || (archiveData ? archiveData.player : 'black');
            const firstSide = config.first || (archiveData ? archiveData.first : 'black');
            selfPlayer = selfSide === 'white' ? PLAYER_ENUM.WHITE : PLAYER_ENUM.BLACK;
            aiPlayer = selfPlayer === PLAYER_ENUM.BLACK ? PLAYER_ENUM.WHITE : PLAYER_ENUM.BLACK;
            hpMax = archiveData ? { black: Math.max(1, archiveData.hp.black), white: Math.max(1, archiveData.hp.white) } : { black: 6, white: 6 };
            config.self = selfSide; config.first = firstSide;
            return archiveData;
        };

        // 对话阶段即初始化棋盘：让对话文字/箭头出现时棋盘已在背景中（配合暗化）可见
        const prepareDialogueBoard = () => {
            const firstGame = (runtime.nodes || []).find((item) => item.type === 'game');
            if (!firstGame || ui) return;
            const config = firstGame.config || {};
            currentConfig = config;
            createGame(config, resolveSides(config));
        };

        const initAi = async () => {
            aiReady = false;
            if (sound) sound.init().catch(() => {});
            try {
                aiWorkerThread = new Worker('/js/worker/ai.min.js');
                aiWorker = Comlink.wrap(aiWorkerThread);
                await aiWorker.AI_INIT();
                await syncAiBoard();
                aiReady = true;
            } catch (error) {
                console.warn('4zero MCTS 加载失败，将使用合法落点保护模式。', error);
                if (aiWorkerThread) aiWorkerThread.terminate();
                aiWorkerThread = null; aiWorker = null; aiReady = true;
                setStatus('4zero MCTS 不可用，将使用首个合法落点。', 'warning');
            }
        };

        const concludeGame = async (winner) => {
            if (gameOver) return;
            gameOver = true;
            // winner 为 null 表示未分出胜负即中止（达到结束步数或点击结束），按平局处理
            const outcome = winner === null || winner === undefined ? 'draw' : winner === selfPlayer ? 'win' : 'lose';
            renderInfo();
            if (aiWorkerThread) aiWorkerThread.terminate();
            aiWorkerThread = null; aiWorker = null; aiReady = false;
            runtime.finish_game(outcome);
            mode = 'dialogue';
            setDialogueVisible(true);
            renderNode();
        };

        // 结束对局=步数:0 时无需落子，点击屏幕任意位置直接结束本局
        document.addEventListener('click', () => {
            if (mode !== 'game' || gameOver || !endByClick) return;
            clearPendingConfirm();
            concludeGame(null);
        });

        const startGame = async (node) => {
            const config = node.config || {};
            currentConfig = config;
            const archiveData = resolveSides(config);
            mode = 'game';
            setDialogueVisible(false);
            $('ending').classList.add('d-none');
            $('board_wrap').classList.remove('is-dialogue');
            const generation = ++gameGeneration;
            running = true; gameOver = false; moves = []; bookedWhite = null;
            triggeredEvents = new Set(); lastMovePicked = false; gameNodeIndex = runtime.index; pendingResume = null;
            // 结束残局=步数:N -> 本局第 N 手落子后结束；步数:0 -> 不落子，点击屏幕结束；胜负 或未配置 -> 分出胜负才结束
            endLimit = config.end_kind === 'steps' ? Math.max(0, Math.trunc(Number(config.end_steps) || 0)) : 0;
            endByClick = config.end_kind === 'steps' && endLimit === 0;
            pendingAscend[0].length = 0; pendingAscend[1].length = 0;
            if (aiWorkerThread) aiWorkerThread.terminate();
            aiWorkerThread = null; aiWorker = null; aiReady = false;
            createGame(config, archiveData);
            branch = selfPlayer === PLAYER_ENUM.BLACK && archiveData && (archiveData.black_book || []).length
                ? window.EndgameExports.create_branch(archiveData.black_book.map(archiveMoveToBoard), archiveData.white_turns.map(archiveMoveToBoard), async () => aiThink())
                : null;
            // 残局码里的 AI 预设（作者定义的无条件队列）：无论玩家执哪一方、是否命中正着都优先执行。
            const makePreset = (moves) => typeof window.EndgameExports.create_ai_preset === 'function'
                ? window.EndgameExports.create_ai_preset((moves || []).map(archiveMoveToBoard))
                : null;
            aiPreset = archiveData ? makePreset(archiveData.ai_preset) : null;
            // AI 执黑时，黑方正着即黑方 AI 的预设队列；玩家执黑时由正着分支负责白方预案应手。
            bookPreset = archiveData && selfPlayer === PLAYER_ENUM.WHITE ? makePreset(archiveData.black_book) : null;
            setStatus('正在加载对手 AI...', 'primary');
            showAlertText(node.title || '剧情对局');
            await initAi();
            if (generation !== gameGeneration) return;
            running = false;
            renderInfo();
            if (endByClick) { setStatus('点击屏幕结束本局。', 'primary'); return; }
            setStatus(state.turn_player === selfPlayer ? '轮到你落子。' : '对手 AI 先手...', 'primary');
            await runAiTurns(generation);
            if (!gameOver && generation === gameGeneration) setStatus(state.turn_player === selfPlayer ? '轮到你落子。' : '对手 AI 回合。', 'primary');
        };

        // 页面尺寸变化时：角色框立即跟随对话框高度，先用缓存的压缩图填充；框大于压缩图时再取原图按新框像素重压
        let faceRelayoutTimer = 0;
        let levelFaces = [];
        window.addEventListener('resize', () => {
            if (ui && game) redraw();
            dimKey = '';
            drawDim();
            refreshGuide();
            layoutFaceFrame();
            if (!levelFaces.length) return;
            pruneFaceCache();
            primeFaceThumbs(levelFaces);
            renderFace(lastFace.speaker, lastFace.expression);
            clearTimeout(faceRelayoutTimer);
            faceRelayoutTimer = setTimeout(async () => {
                await preloadFaces(levelFaces);
                renderFace(lastFace.speaker, lastFace.expression);
            }, 150);
        });

        (async () => {
            if (!window.get_token || !window.get_token()) { playerName = '你'; }
            else { try { const info = await window.http_user_info(window.get_token()); if (info && info.name) playerName = info.name; } catch (_) { /* 使用默认称呼 */ } }
            // 只取本关剧本；旧服务端没有按关卡接口时回退到整份目录
            let level = null;
            try {
                const data = window.http_story_level_query ? await window.http_story_level_query(targetLevel) : null;
                if (data && typeof data.script === 'string') level = { 'level': Number(data.level) || targetLevel, 'title': String(data.title || ''), 'script': data.script };
            } catch (_) { /* 回退整份目录 */ }
            if (!level) {
                let catalog = window.StoryExports.DEFAULT_CATALOG;
                try {
                    const doc = await window.http_docs_query('story');
                    if (doc && doc.data) { const parsed = JSON.parse(doc.data); if (parsed && Array.isArray(parsed.levels) && parsed.levels.length) catalog = parsed; }
                } catch (_) { /* 回退内置目录 */ }
                const levels = Array.isArray(catalog.levels) ? catalog.levels.slice().sort((a, b) => Number(a.level) - Number(b.level)) : [];
                const found = levels.find((item) => Number(item.level) === targetLevel) || levels[0];
                if (found) level = { 'level': Number(found.level) || targetLevel, 'title': String(found.title || ''), 'script': String(found.script == null ? '' : found.script) };
            }
            if (!level) { setStatus('未找到剧情关卡。', 'danger'); return; }
            const parsed = StoryScript.parse(level.script);
            applyDialogueOpacity(parsed);
            const faces = StoryScript.faces(parsed);
            levelFaces = faces;
            // 进入关卡前先取齐并预加载本关用到的角色图
            await loadCharacters(faces);
            await preloadFaces(faces);
            runtime = new StoryRuntime(parsed);
            $('story_subtitle').textContent = `第 ${level.level} 关 · ${level.title}`;
            document.title = `四子棋 剧情 - ${level.title}`;
            setStatus('对话框推进剧情，对局决定走向。', 'primary');
            mode = 'dialogue';
            prepareDialogueBoard();
            setDialogueVisible(true);
            renderNode();
        })();
    </script>
</body>
</html>
