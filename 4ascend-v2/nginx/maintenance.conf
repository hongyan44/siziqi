user root;
worker_rlimit_nofile 65535;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;


events {
    worker_connections 1024;
    multi_accept on;
}


http {
    # 基础设置
    sendfile on;

    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 60;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;


    # 缓存设置
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;


    # 日志设置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;


    # SSL性能优化
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;


    # 开启 Gzip 压缩
    gzip on;
    gzip_min_length 1k; # 启用压缩的最小文件大小，小于 1k 的文件压缩后可能反而变大
    gzip_comp_level 5; # 压缩级别 (1-9)，6 是性能和压缩率的最佳平衡点

    gzip_vary on; # 往响应头添加 Vary: Accept-Encoding，告知缓存服务器根据压缩支持情况分发内容
    gzip_disable "MSIE [1-6]\."; # 禁用对低版本 IE 的压缩支持（这些老古董不支持 Gzip）

    gzip_types 
        text/plain 
        text/css 
        text/xml 
        application/javascript 
        application/json 
        application/xml 
        application/rss+xml 
        application/wasm
        application/vnd.ms-fontobject 
        application/x-font-ttf 
        font/opentype 
        image/svg+xml 
        image/x-icon;

    
    # 加密传输
    ssl_certificate /root/ssl/siziqi.net/server.cer;
    ssl_certificate_key /root/ssl/siziqi.net/server.key;


    # 跳转到HTTPS
    server {
        listen 80;
        server_name siziqi.net online.siziqi.net;

        # 简单直接的 301 跳转
        return 301 https://$host$request_uri;
    }


    # MAP
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      ""; # 如果没有 upgrade 头，则 Connection 设为空，兼容 HTTP 长连接
    }


    # 长连接
    upstream 4ascend_web
    { 
        server 127.0.0.1:50000; 
        keepalive 64;
    }

    upstream 4ascend_online
    { 
        server 127.0.0.1:50001; 
        keepalive 64;
    }


    # 4ASCEND静态网页服务 || 50000
    server {
        listen 443 ssl http2;
        server_name siziqi.net;

        location / {
            set $action "BLOCK";

            if ($request_uri ~* "debug") {
                set $action "PASS";
            }

            if ($action = "BLOCK") {
                return 302 /maintenance.html;
            }

            # 核心转发指令
            proxy_pass http://4ascend_web;

            # 版本
            proxy_http_version 1.1;

            # 长连接
            proxy_set_header Connection "";

            # 转发真实的客户端信息
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;

            add_header Strict-Transport-Security "max-age=0" always;

            # 强制告知浏览器和中间代理不要缓存
            add_header Last-Modified $date_gmt;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";

            # 浏览器缓存关闭
            if_modified_since off;
            expires off;
            etag off;
        }

        location = /maintenance.html {
            proxy_pass http://4ascend_web;
        }
    }

    # 4ASCEND联机服务 || 50001
    server {
        listen 443 ssl http2;
        server_name online.siziqi.net;

        location / {
            # 核心转发指令
            proxy_pass http://4ascend_online;

            # 版本
            proxy_http_version 1.1;

            # Websocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 转发真实的客户端信息
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;

            # 长连接，防止太久不发消息断开
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # 跨域
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
        }
    }
}