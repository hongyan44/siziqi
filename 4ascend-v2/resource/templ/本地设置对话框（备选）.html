<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置</title>
    <!-- 引入 Shoelace 样式与组件 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"></script>

    <style>
<style>
    :root {
        --sl-border-radius-medium: 4px; /* 更加克制的圆角 */
        --sl-border-radius-large: 6px;
        --sl-input-height-medium: 2.5rem;
    }

    body {
        font-family: var(--sl-font-sans);
        background-color: #ffffff; /* 纯白背景更显干净 */
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .settings-container {
        display: flex;
        flex-direction: column;
        gap: 2rem; /* 增加区域间的留白 */
        max-height: 85vh;
    }

    /* 移除背景色，优化网格 */
    .volume-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem 1rem; /* 增加行间距，方便手指操作 */
        padding: 4px 0;
    }

    .volume-item {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .volume-item label {
        font-size: 0.9rem; /* 稍微加大一点，避免蚊子字体 */
        font-weight: 500;
        color: var(--sl-color-neutral-700);
    }

    /* 功能开关列表 */
    .switch-list {
        display: flex;
        flex-direction: column;
    }

    .switch-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0; /* 增加触控面积 */
        border-bottom: 1px solid var(--sl-color-neutral-100);
    }

    .switch-item:last-child {
        border-bottom: none;
    }

    .switch-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    .switch-title {
        font-weight: 500;
        font-size: 1rem;
        color: var(--sl-color-neutral-900);
    }

    .switch-description {
        font-size: 0.85rem;
        color: var(--sl-color-neutral-400);
    }

    /* 标题微调 */
    .section-header {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--sl-color-neutral-950);
        display: block;
    }

    @media (max-width: 480px) {
        sl-dialog::part(panel) {
            width: 100%;
            height: 100%;
            max-height: 100%;
        }
        .volume-grid {
            grid-template-columns: 1fr 1fr;
        }
    }
</style>
    </style>
</head>
<body>

    <sl-button variant="primary" id="open-settings">打开本地设置</sl-button>

    <sl-dialog label="系统音频与功能配置" id="settings-dialog" style="--width: 500px;">
        <div class="settings-container">
            
            <!-- 音量调节区域 -->
            <section>
                <div style="margin-bottom: 10px; font-weight: 600;">混音器通道</div>
                <div class="volume-grid" id="volume-controls">
                    <!-- JS 动态生成 10 个音量条 -->
                </div>
            </section>

            <!-- 功能开关区域 -->
            <section>
                <div style="margin-bottom: 10px; font-weight: 600;">高级选项</div>
                <div class="switch-list">
                    <div class="switch-item">
                        <div class="switch-info">
                            <span class="switch-title">环境降噪</span>
                            <span class="switch-description">消除背景中的持续性蝉鸣与底噪</span>
                        </div>
                        <sl-switch checked></sl-switch>
                    </div>
                    <div class="switch-item">
                        <div class="switch-info">
                            <span class="switch-title">高保真模式</span>
                            <span class="switch-description">启用 24-bit 采样率，占用更多 CPU</span>
                        </div>
                        <sl-switch></sl-switch>
                    </div>
                </div>
            </section>
        </div>

        <sl-button slot="footer" variant="primary" id="close-settings">保存并关闭</sl-button>
    </sl-dialog>

    <script>
        const dialog = document.querySelector('#settings-dialog');
        const openButton = document.querySelector('#open-settings');
        const closeButton = document.querySelector('#close-settings');
        const volumeGrid = document.querySelector('#volume-controls');

        // 打开/关闭 逻辑
        openButton.addEventListener('click', () => dialog.show());
        closeButton.addEventListener('click', () => dialog.hide());

        // 动态生成10个音量控件
        const channels = ['主音量', '背景音乐', '系统通知', '语音聊天', '游戏音效', '媒体播放', '麦克风', '监听', '辅助输入', '全局均衡'];
        
        channels.forEach((name, index) => {
            const div = document.createElement('div');
            div.className = 'volume-item';
            div.innerHTML = `
                <label>${name}</label>
                <sl-range value="${Math.floor(Math.random() * 100)}" min="0" max="100" step="1"></sl-range>
            `;
            volumeGrid.appendChild(div);
        });
    </script>
</body>
</html>
