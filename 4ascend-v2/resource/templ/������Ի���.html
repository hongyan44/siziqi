<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoelace 界面示例</title>
  
  <!-- 引入 Shoelace 样式和脚本 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/themes/light.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.15.0/cdn/shoelace-autoloader.js"></script>

  <style>
    :root {
      /* 核心：控制圆角，使其不突兀 */
      --sl-border-radius-medium: 4px;
      --sl-border-radius-large: 6px;
      font-family: var(--sl-font-sans);
    }

    body {
      background-color: #f4f4f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    /* 对话框内部布局 */
    .content-container {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* 标签容器排版 */
    .tag-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.5rem 0;
    }

    /* 按钮网格布局：适配手机，2列分布 */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    /* 针对手机端的微调 */
    sl-dialog::part(panel) {
      max-width: 90vw;
      width: 400px;
    }
  </style>
</head>
<body>

  <sl-button variant="primary" id="open-dialog">打开配置面板</sl-button>

  <sl-dialog label="设置选项" id="dialog-panel">
    <div class="content-container">
      
      <!-- 下拉详情区域 -->
      <sl-details summary="参与者名单 (10)">
        <div class="tag-group">
          <sl-tag variant="neutral" size="small">张三</sl-tag>
          <sl-tag variant="neutral" size="small">李晓明</sl-tag>
          <sl-tag variant="neutral" size="small">王五</sl-tag>
          <sl-tag variant="neutral" size="small">赵四</sl-tag>
          <sl-tag variant="neutral" size="small">阿强</sl-tag>
          <sl-tag variant="neutral" size="small">小红</sl-tag>
          <sl-tag variant="neutral" size="small">陈工</sl-tag>
          <sl-tag variant="neutral" size="small">林主编</sl-tag>
          <sl-tag variant="neutral" size="small">技术宅</sl-tag>
          <sl-tag variant="neutral" size="small">匿名用户</sl-tag>
        </div>
      </sl-details>

      <!-- 操作按钮网格 -->
      <div class="button-grid">
        <sl-button size="medium">
          <sl-icon slot="prefix" name="gear"></sl-icon>系统设置
        </sl-button>
        <sl-button size="medium">
          <sl-icon slot="prefix" name="person-plus"></sl-icon>添加成员
        </sl-button>
        <sl-button size="medium">
          <sl-icon slot="prefix" name="cloud-arrow-up"></sl-icon>数据备份
        </sl-button>
        <sl-button size="medium">
          <sl-icon slot="prefix" name="share"></sl-icon>快速分享
        </sl-button>
        <sl-button size="medium">
          <sl-icon slot="prefix" name="printer"></sl-icon>打印报表
        </sl-button>
        <sl-button size="medium" variant="danger" outline>
          <sl-icon slot="prefix" name="trash"></sl-icon>清空记录
        </sl-button>
      </div>
    </div>

    <sl-button slot="footer" variant="primary" id="close-dialog">确定</sl-button>
  </sl-dialog>

  <script>
    const dialog = document.querySelector('#dialog-panel');
    const openButton = document.querySelector('#open-dialog');
    const closeButton = document.querySelector('#close-dialog');

    openButton.addEventListener('click', () => dialog.show());
    closeButton.addEventListener('click', () => dialog.hide());
  </script>

</body>
</html>
