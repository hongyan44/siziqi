<head>

    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, user-scalable=no'>


    <link rel='shortcut icon' href='/favicon.png' type='image/png'>

    <title>四子棋 在线观战对局</title>


    <!-- Bootstrap V5 -->
    <link href='https://quantil.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css' rel='stylesheet'>
    <!-- <script src='https://quantil.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js'></script> -->

    <!-- Shoelace -->
    <link href='https://quantil.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css' rel='stylesheet'>
    <script src='https://quantil.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js'
        type='module'></script>

    <!-- Clipboard -->
    <script src='https://quantil.jsdelivr.net/npm/clipboard-js@0.3.6/clipboard.min.js'></script>

    <!-- UUID V4 -->
    <script src='https://quantil.jsdelivr.net/npm/uuid@latest/dist/umd/uuidv4.min.js'></script>

    <!-- MY -->
    <script src='/js/game.min.js?v=replace'></script>
    <script src='/js/fascend.min.js?v=replace'></script>
    <script src='/js/utils.min.js?v=replace'></script>
    <script src='/js/ui.min.js?v=replace'></script>

    <link href='/css/main.min.css?v=replace' rel='stylesheet'>


    <!-- 全局 -->
    <style>
        body {
            touch-action: none;
            overflow: hidden;

            -webkit-tap-highlight-color: transparent;

            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>


    <!-- 加载动画 -->
    <style>
        .loading-a {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 1);
            transition: all 0.4s ease;
        }

        .loading-p {
            width: 40px;
            height: 40px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: loading-spin 1s linear infinite;
        }

        .loading-t {
            margin-top: 15px;
            font-family: sans-serif;
            color: #666;
            font-size: 14px;
        }

        @keyframes loading-spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <div id='loading' class='loading-a'>
        <div class='loading-p'></div>
        <p class='loading-t'>正在初始化...</p>
    </div>

    <script>
        (async () => {
            const icons = Array.from(document.querySelectorAll('sl-icon'));
            const st = Date.now();

            await Promise.allSettled([
                customElements.whenDefined('sl-button'),
                customElements.whenDefined('sl-icon'),
                customElements.whenDefined('sl-input'),
                customElements.whenDefined('sl-select'),
                customElements.whenDefined('sl-alert'),
                customElements.whenDefined('sl-tag'),
            ]);

            if (document.readyState === 'loading') await new Promise((resolve) => document.addEventListener('DOMContentLoaded', resolve, { 'once': true }))

            await Promise.allSettled(icons.map((icon) => {
                return new Promise((resolve) => {
                    if (icon.hasAttribute('library')) resolve();
                    icon.addEventListener('sl-load', () => requestAnimationFrame(() => requestAnimationFrame(resolve)), { 'once': true });
                });
            }));

            await new Promise((resolve) => {
                if (document.readyState === 'complete') resolve();
                else window.addEventListener('load', resolve, { 'once': true });
            });

            await Promise.allSettled([...document.images]
                .map((image) => image.complete ? Promise.resolve() : new Promise((resolve) => image.onload = resolve)));

            await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

            // await document.fonts.ready;

            const elapsed = Date.now() - st;
            const delay = Math.max(0, 1000 - elapsed); // 至少运行1s

            setTimeout(() => {
                window.loaded = true;

                const loader = document.getElementById('loading');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.visibility = 'hidden';
                    setTimeout(() => loader.remove(), 400);
                }
            }, delay);
        })();
    </script>
</head>


<body class='bg-light vh-100 d-flex flex-column overflow-hidden'>
    <div id='main_app' class='container-fluid h-100 d-flex flex-column p-3 gap-2'>
        <header id='header_main' class='text-center'>
            <h1 id='game_msg' class='h4 fw-bold m-0 msg-active'>等待加入房间
            </h1>
        </header>


        <main class='flex-grow-1 position-relative d-flex flex-column justify-content-center align-items-center'>
            <div id='main_connect' class='fade-slide d-flex flex-column gap-4' style='max-width: 500px; width: 100%;'>
                <div class='text-center'>
                    <sl-icon id='game_icon' name='controller' class='text-primary' style='font-size: 4rem;'></sl-icon>
                    <p class='text-muted'>准备观战</p>
                </div>

                <div class='d-flex flex-column gap-2'>
                    <sl-select id='select_server' placeholder='请选择节点' size='large' pill hoist>
                        <sl-option value='online-main.siziqi.net:16678'>中国大陆1 (深圳) (sz)</sl-option>
                    </sl-select>
                    <sl-input id='input_server' placeholder='输入 6 位房间代号' size='large' maxlength='6' pill></sl-input>
                    <sl-button id='button_server' variant='primary' size='large' pill>开始观战</sl-button>
                </div>
            </div>


            <div id='main_game' class='fade-slide h-100 d-flex flex-column gap-2 v-hide'>
                <div id='game_foe_crad' class='card card-bg py-3 mb-auto rounded-4 player'>
                    <span class='d-flex align-items-center justify-content-around'>
                        <!-- <sl-avatar id='aaa' image="http://q.qlogo.cn/headimg_dl?dst_uin=2032325676&spec=640"
                            style="--size: 2.0rem;">
                        </sl-avatar> -->

                        <span id='game_foe_color'>⚫</span>

                        <span id='game_foe_name' class='d-flex align-items-center msg-active'>
                            Lonelystarundersky
                        </span>

                        <span id='game_foe_hp' class='d-flex align-items-center msg-active'>
                            <!-- <span>⚫</span> -->
                            HP：3/6
                        </span>

                        <span id='game_foe_ascend' class='d-flex align-items-center msg-active'>
                            <!-- <span>⚫</span> -->
                            PR：4+1
                        </span>
                    </span>
                </div>


                <div class='position-relative d-flex justify-content-center align-items-center'>
                    <canvas id='canvas_board'></canvas>
                    <canvas id='canvas_stone' class='position-absolute pe-none top-0 start-0 w-100 h-100'></canvas>
                    <canvas id='canvas_view' class='position-absolute pe-none top-0 start-0 w-100 h-100'></canvas>
                    <canvas id='canvas_turn' class='position-absolute pe-none top-0 start-0 w-100 h-100'></canvas>
                    <canvas id='canvas_ascend' class='position-absolute pe-none top-0 start-0 w-100 h-100'></canvas>
                    <canvas id='canvas_plant' class='position-absolute pe-none top-0 start-0 w-100 h-100'></canvas>
                </div>


                <div id='game_my_crad' class='card card-bg py-3 mt-auto rounded-4 player'>
                    <span class='d-flex align-items-center justify-content-around'>
                        <!-- <sl-avatar id='aaa' image="http://q.qlogo.cn/headimg_dl?dst_uin=2032325676&spec=640"
                            style="--size: 2.0rem;">
                        </sl-avatar> -->

                        <span id='game_my_color'>⚪</span>

                        <span id='game_my_name' class='d-flex align-items-center msg-active'>
                            Lonelystarundersky
                        </span>

                        <span id='game_my_hp' class='d-flex align-items-center msg-active'>
                            <!-- <span>⚪</span> -->
                            HP：3/6
                        </span>

                        <span id='game_my_ascend' class='d-flex align-items-center msg-active'>
                            <!-- <span>⚪</span> -->
                            PR：4+1
                        </span>
                    </span>
                </div>
            </div>
        </main>


        <footer id='footer_main' class='mt-auto text-center text-muted' style='font-size: 0.74rem;'>
            <a href='https://beian.miit.gov.cn/' target='_blank' class='text-decoration-none text-secondary'>
                津ICP备2026002838号
            </a>
        </footer>
    </div>


    <sl-dialog id='dialog_init' class='d-none' label='初始化设置'>
        <div class='d-flex flex-column gap-4'>
            <sl-input id='input_init_name' label='你的昵称' placeholder='请输入 你的昵称' help-text='例如：我是神秘下棋猫SSR'>
            </sl-input>

            <div class='d-flex flex-row gap-2 w-100'>
                <sl-input class='w-50' id='input_init_bgmv' type='number' label='背景音乐音量' value='100'
                    placeholder='请输入 0-500' help-text='0%-500% 0不播放'>
                </sl-input>

                <sl-input class='w-50' id='input_init_stonev' type='number' label='落子音效音量' value='400'
                    placeholder='请输入 0-500' help-text='0%-500% 0不播放'>
                </sl-input>
            </div>
        </div>

        <div slot='footer' class='gap-2'>
            <sl-button onclick='this.closest("sl-dialog").hide();' variant='neutral'>关闭</sl-button>
            <sl-button id='button_init' variant='primary'>确认</sl-button>
        </div>
    </sl-dialog>


    <sl-dialog id='dialog_game' class='d-none' label='对局功能'>
        <div class='d-flex flex-column gap-4'>
            <sl-details id='game_sub_title' summary='当前观战 0人'>
                <div id='game_sub_names' class='d-flex flex-wrap gap-4'>
                </div>
            </sl-details>
        </div>

        <div slot='footer' class='gap-2'>
            <sl-button onclick='this.closest("sl-dialog").hide();' variant='neutral'>关闭</sl-button>
            <sl-button id='button_game_archive' variant='primary'>回放</sl-button>
            <sl-button id='button_game_restart' variant='primary'>新对局</sl-button>
        </div>
    </sl-dialog>


    <sl-dialog id='dialog_tip' class='d-none' label='提示'>
        <div class='d-flex flex-column gap-4'>
            玩家开始了新对局，您的对局已过期
        </div>

        <div slot='footer' class='gap-2'>
            <sl-button onclick='this.closest("sl-dialog").hide();' variant='neutral'>关闭</sl-button>
            <sl-button id='button_tip_archive' variant='primary'>回放</sl-button>
            <sl-button id='button_tip' variant='primary'>新对局</sl-button>
        </div>
    </sl-dialog>


    <div class='d-none'>
        <sl-alert></sl-alert>
        <sl-icon slot='icon' name='info-circle'></sl-icon>
        <sl-tag></sl-tag>
    </div>
</body>
