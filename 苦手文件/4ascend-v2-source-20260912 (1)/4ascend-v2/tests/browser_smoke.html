<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>4ASCEND JS AI smoke test</title>
    <script src="/vendor/comlink/comlink.min.js"></script>
    <script src="/js/global/fascend.min.js"></script>
    <script src="/js/global/endgame.min.js"></script>
</head>
<body>
    <h1>4ASCEND JS AI smoke test</h1>
    <pre id="result">RUNNING</pre>
    <script>
        (async () => {
            const output = document.getElementById('result');
            const log = [];
            const assert = (condition, message) => {
                if (!condition) throw new Error(message);
                log.push(`PASS: ${message}`);
            };
            const legacyEndgameBytes = () => {
                const bits = [];
                const write = (value, length) => {
                    for (let bit = length - 1; bit >= 0; bit--) bits.push((value >> bit) & 1);
                };
                [0x45, 0x47, 0x4B].forEach((byte) => write(byte, 8));
                write(1, 8); // V1
                write(0, 8); // flags
                write(2, 8); // fallback level
                write(6, 7); write(6, 7);
                for (let cell = 0; cell < 81; cell++) { write(0, 2); write(0, 2); }
                write(1, 8);
                write(4, 4); write(4, 4); write(4, 4); write(5, 4);
                while (bits.length % 8) bits.push(0);
                const body = new Uint8Array(bits.length / 8);
                bits.forEach((bit, index) => body[Math.floor(index / 8)] |= bit << (7 - index % 8));
                let crc = 0xFFFF;
                body.forEach((byte) => {
                    crc ^= byte << 8;
                    for (let bit = 0; bit < 8; bit++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
                });
                return Uint8Array.from([...body, crc >> 8, crc & 0xFF]);
            };
            const comparable = (snapshot) => ({
                stones: snapshot.stones,
                plants: snapshot.plants,
                turnPlayer: snapshot.turnPlayer,
                turnCount: snapshot.turnCount,
                ascendStatus: snapshot.ascendStatus,
                hp: snapshot.hp,
                unascendCharge: snapshot.unascendCharge,
                fastUnascendCharge: snapshot.fastUnascendCharge,
                growCount: snapshot.growCount,
                justUnascend: snapshot.justUnascend,
                overStatus: snapshot.overStatus,
                randAic: snapshot.randAic,
                randUnity: snapshot.randUnity,
            });
            const applyAnimatedPhases = (game, action) => {
                const x = action % 9;
                const y = Math.floor(action / 9);
                if (!game.ed_tr_1(x, y)) throw new Error(`page rejected ${action}`);
                game.ed_as_1();
                game.ed_as_2(true);
                // The real page commits this pending damage when the visual
                // settlement finishes. Doing it here exercises that exact
                // animation-facing path without introducing a timer.
                if (game.state.pending_damage) {
                    game.state.hp[0] -= game.state.pending_damage[0];
                    game.state.hp[1] -= game.state.pending_damage[1];
                    game.state.pending_damage = null;
                }
                game.ed_tr_2();
                const winner = game.ed_win();
                if (!winner) {
                    game.ed_pl_1();
                    game.ed_as_3();
                }
                return winner;
            };

            try {
                const worker = Comlink.wrap(new Worker('/js/worker/ai.min.js?v=browser-smoke'));
                const init = await worker.AI_INIT();
                assert(init.backend === 'onnxruntime-web/wasm', 'ONNX Runtime Web loaded');
                assert(init.rules === 'js/global/fascend', 'worker uses canonical JS rules');

                await worker.ZERO_RESET(12345, 67890, 0, 6, true);
                const initialEncoding = await worker.ZERO_DEBUG_ENCODE();
                const plane = (number) => initialEncoding.slice(number * 81, (number + 1) * 81);
                assert(plane(0).every((value) => value === 0), 'empty board has no current-player stones');
                assert(plane(1).every((value) => value === 0), 'empty board has no opponent stones');
                assert(plane(3).every((value) => value === 0), 'empty board has no plants');
                assert(plane(6).every((value) => value === 0), 'normal phase is not encoded as ASCEND');
                assert(plane(7).every((value) => value === 1), 'black first player plane is encoded');
                assert(plane(8).every((value) => value === 1), 'normal plant mode encodes the initial odd grow parity');

                const { GameNormal, Board, State, RandAIC, RandUnity, RulesRuntime, PLAYER_ENUM } = FAscendExports;
                const pageState = new State();
                pageState.turn_player = PLAYER_ENUM.BLACK;
                pageState.hp = [6, 6];
                const pageGame = new GameNormal(new Board(9, 9), pageState, new RandAIC(12345), new RandUnity(67890));
                RulesRuntime.initialize(pageGame, PLAYER_ENUM.BLACK);
                await worker.ZERO_RESET(12345, 67890, 0, 6, true);

                for (let turn = 0; turn < 18; turn++) {
                    const legal = RulesRuntime.legalMoves(pageGame);
                    assert(legal.length > 0, `turn ${turn + 1} has a legal move`);
                    const action = legal[Math.floor(legal.length / 2)];
                    const winner = applyAnimatedPhases(pageGame, action);
                    await worker.ZERO_TURN(action);
                    const pageSnapshot = comparable(RulesRuntime.snapshot(pageGame));
                    const workerSnapshot = comparable(await worker.ZERO_DEBUG_STATE());
                    assert(JSON.stringify(pageSnapshot) === JSON.stringify(workerSnapshot), `animated page and headless worker match after turn ${turn + 1}`);
                    if (winner) break;
                }

                const encoded = await worker.ZERO_DEBUG_ENCODE();
                assert(encoded.length === 25 * 9 * 9, 'feature tensor has shape [1,25,9,9]');
                assert(encoded.every(Number.isFinite), 'feature tensor contains only finite values');

                const exactSnapshot = RulesRuntime.snapshot(pageGame);
                const restored = RulesRuntime.fromSnapshot(exactSnapshot);
                assert(JSON.stringify(RulesRuntime.snapshot(restored)) === JSON.stringify(exactSnapshot), 'complete rules snapshot round-trips exactly');
                const parityAction = RulesRuntime.legalMoves(pageGame)[0];
                if (Number.isInteger(parityAction)) {
                    const originalFork = RulesRuntime.fork(pageGame);
                    RulesRuntime.applyMove(originalFork, parityAction);
                    RulesRuntime.applyMove(restored, parityAction);
                    assert(JSON.stringify(RulesRuntime.snapshot(restored)) === JSON.stringify(RulesRuntime.snapshot(originalFork)), 'restored snapshot keeps identical next-state and RNG behavior');
                }

                const archiveSnapshot = JSON.parse(JSON.stringify(exactSnapshot));
                [3, 4, 5, 6].forEach((stone, index) => { archiveSnapshot.stones[index] = stone; });
                archiveSnapshot.ascendStatus = 2;
                archiveSnapshot.pendingDamage = [1, 2];
                archiveSnapshot.justUnascend = true;
                archiveSnapshot.overStatus = 1;
                const archiveText = EndgameExports.EndgameArchive.encode({
                    snapshot: archiveSnapshot,
                    blackBook: [[0, 0]],
                    whiteTurns: [[1, 0]],
                    fallback: { level: 2 },
                });
                const archiveData = EndgameExports.EndgameArchive.decode(archiveText);
                assert(archiveData.version === 2, 'endgame archive writes the complete V2 snapshot format');
                const archivedSnapshotKeys = [
                    'mode', 'width', 'height', 'stones', 'plants', 'turns', 'turnPlayer', 'firstPlayer',
                    'turnCount', 'turnPos', 'ascendStatus', 'hp', 'pendingDamage', 'unascendCharge',
                    'fastUnascendCharge', 'growCount', 'justUnascend', 'overStatus', 'history',
                    'randAic', 'randUnity', 'naturalPlant', 'alwaysOverload',
                ];
                assert(archivedSnapshotKeys.every((key) =>
                    JSON.stringify(archiveData.snapshot[key]) === JSON.stringify(archiveSnapshot[key])
                ), 'endgame archive preserves complete deterministic and transient rules state');
                const legacyArchive = EndgameExports.EndgameArchive.load(legacyEndgameBytes());
                assert(legacyArchive.version === 1 && legacyArchive.snapshot.version === 2, 'legacy V1 endgame archives upgrade to a deterministic V2 snapshot');
                assert(legacyArchive.black_book[0][0] === 4 && legacyArchive.white_turns[0][1] === 5, 'legacy V1 authored response line remains intact');

                await worker.ZERO_RESET(1001, 2002, 0, 6, true);
                await worker.ZERO_TURN(40);
                const firstAction = await worker.ZERO_THINK(8, true);
                const firstState = await worker.ZERO_DEBUG_STATE();
                const knownSearch = await worker.ZERO_DEBUG_SEARCH();
                assert(Number.isInteger(firstAction) && firstAction >= 0 && firstAction < 81, 'MCTS returns a board action');
                assert(firstState.turnCount === 2, 'MCTS commits exactly one move');
                assert(knownSearch.randomMode === 'known' && knownSearch.searchSeeds === null, '??? level uses the synchronized match RNG');

                await worker.ZERO_RESET(1001, 2002, 0, 6, true);
                await worker.ZERO_TURN(40);
                const repeatedAction = await worker.ZERO_THINK(8, true);
                assert(firstAction === repeatedAction, '??? level reproduces the same move from the same match RNG');

                await worker.ZERO_RESET(1001, 2002, 0, 6, true);
                await worker.ZERO_TURN(40);
                const hiddenPageState = new State();
                hiddenPageState.turn_player = PLAYER_ENUM.BLACK;
                hiddenPageState.hp = [6, 6];
                const hiddenPageGame = new GameNormal(
                    new Board(9, 9),
                    hiddenPageState,
                    new RandAIC(1001),
                    new RandUnity(2002),
                );
                RulesRuntime.initialize(hiddenPageGame, PLAYER_ENUM.BLACK);
                applyAnimatedPhases(hiddenPageGame, 40);
                const hiddenAction = await worker.ZERO_THINK(8, false);
                const hiddenSearch = await worker.ZERO_DEBUG_SEARCH();
                assert(Number.isInteger(hiddenAction) && hiddenAction >= 0 && hiddenAction < 81, 'ordinary level returns a legal board action');
                assert(hiddenSearch.randomMode === 'hidden' && hiddenSearch.searchSeeds.length === 2, 'ordinary level searches with independent RNG seeds');
                assert(hiddenSearch.searchSeeds[0] !== 1001 && hiddenSearch.searchSeeds[1] !== 2002, 'ordinary level does not reuse the match seeds');
                applyAnimatedPhases(hiddenPageGame, hiddenAction);
                const hiddenPageSnapshot = comparable(RulesRuntime.snapshot(hiddenPageGame));
                const hiddenWorkerSnapshot = comparable(await worker.ZERO_DEBUG_STATE());
                assert(
                    JSON.stringify(hiddenPageSnapshot) === JSON.stringify(hiddenWorkerSnapshot),
                    'hidden-seed search commits its move to the synchronized live match',
                );

                const endgameState = new State();
                endgameState.turn_player = PLAYER_ENUM.BLACK;
                endgameState.hp = [6, 5];
                endgameState.grow_count = 4;
                const endgameGame = new FAscendExports.GameBlight(
                    new Board(9, 9),
                    endgameState,
                    new RandAIC(31415),
                    new RandUnity(92653),
                );
                RulesRuntime.initialize(endgameGame, PLAYER_ENUM.BLACK);
                endgameGame.board.data.forEach((pos, index) => {
                    if (index === 80) return;
                    const x = index % 9;
                    const y = Math.floor(index / 9);
                    pos.stone = (Math.floor(x / 2) + y) % 2 === 0
                        ? FAscendExports.STONE_ENUM.BLACK
                        : FAscendExports.STONE_ENUM.WHITE;
                });
                const endgameSnapshot = RulesRuntime.snapshot(endgameGame);
                await worker.ENDGAME_LOAD(endgameSnapshot);
                const blackEndgameEncoding = await worker.ENDGAME_DEBUG_ENCODE();
                assert(blackEndgameEncoding.slice(8 * 81, 9 * 81).every((value) => value === 1), 'no-plant endgame fixes grow parity to one for black');
                const whiteEndgameSnapshot = JSON.parse(JSON.stringify(endgameSnapshot));
                whiteEndgameSnapshot.turnPlayer = 1;
                await worker.ENDGAME_LOAD(whiteEndgameSnapshot);
                const whiteEndgameEncoding = await worker.ENDGAME_DEBUG_ENCODE();
                assert(whiteEndgameEncoding.slice(8 * 81, 9 * 81).every((value) => value === 1), 'no-plant endgame fixes grow parity to one for white');

                await worker.ENDGAME_LOAD(endgameSnapshot);
                const beforeAnalysis = await worker.ENDGAME_DEBUG_STATE();
                const solution = await worker.ENDGAME_THINK(8);
                const afterAnalysis = await worker.ENDGAME_DEBUG_STATE();
                assert(solution.action === 80 && solution.engine === '4zero-mcts', '4zero MCTS finds the only legal endgame move');
                assert(solution.requestedSimulations === 8 && solution.randomMode === 'known', 'endgame takeover uses requested MCTS simulations and the exact puzzle state');
                assert(JSON.stringify(beforeAnalysis) === JSON.stringify(afterAnalysis), 'endgame MCTS does not mutate the live worker state');
                const committed = await worker.ENDGAME_APPLY(solution.action);
                RulesRuntime.applyMove(endgameGame, solution.action);
                assert(committed.legal && committed.winner === 0, 'endgame move is committed explicitly and reports black victory');
                assert(JSON.stringify(committed.snapshot) === JSON.stringify(RulesRuntime.snapshot(endgameGame)), 'endgame worker stays identical to the canonical page state after commit');

                output.textContent = `${log.join('\n')}\nALL TESTS PASSED`;
            } catch (error) {
                console.error(error);
                output.textContent = `${log.join('\n')}\nFAIL: ${error && error.stack ? error.stack : error}`;
            }
        })();
    </script>
</body>
</html>
