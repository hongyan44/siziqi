user root;
worker_rlimit_nofile 65535;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;


events {
    worker_connections 1024;
    multi_accept on;
}


http {
    # 基础设置
    sendfile on;

    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 60;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;


    # 缓存设置
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;


    # 日志设置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;


    # SSL性能优化
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    
    # 加密传输
    ssl_certificate /root/ssl/siziqi.net/server.cer;
    ssl_certificate_key /root/ssl/siziqi.net/server.key;


    # 跳转到HTTPS
    server {
        listen 80;
        server_name siziqi.cc.cd online.siziqi.cc.cd;

        # 简单直接的 301 跳转
        return 301 https://$host$request_uri;
    }


    # MAP
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      ""; # 如果没有 upgrade 头，则 Connection 设为空，兼容 HTTP 长连接
    }


    # 长连接
    upstream 4ascend_web
    { 
        server 8.135.3.189:50000;
        keepalive 64;
    }

    upstream 4ascend_online
    { 
        server 8.135.3.189:50001; 
        keepalive 64;
    }


    # 4ASCEND静态网页服务 || 50000
    server {
        listen 443 ssl http2;
        server_name siziqi.cc.cd;

        location / {
            # 核心转发指令
            proxy_pass http://4ascend_web;

            # 版本
            proxy_http_version 1.1;

            # 长连接
            proxy_set_header Connection "";
        }
    }

    # 4ASCEND联机服务 || 50001
    server {
        listen 443 ssl http2;
        server_name online.siziqi.cc.cd;

        location / {
            # 核心转发指令
            proxy_pass http://4ascend_online;

            # 版本
            proxy_http_version 1.1;

            # Websocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 转发真实的客户端信息
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;

            # 长连接，防止太久不发消息断开
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}